pagination:
  style: offset-limit
  params:
  - name: record_offset
    location: request body (search operations)
    description: Zero-based offset of the first record to return.
  - name: record_size
    location: request body (search operations)
    description: Maximum number of records to return in the page.
  also:
  - offset (query, some list endpoints)
  - limit (query, some list endpoints)
  notes: >-
    Search-style POST operations (metadata/search, users/search, etc.) page via
    record_offset + record_size in the JSON request body; a few GET list
