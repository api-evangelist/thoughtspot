identifiers:
  style: >-
    Objects are addressed by GUID (identifier) or name; most search endpoints
    accept a list of identifiers plus type filters.
request_response:
  content_type: application/json
  error_envelope: '{ "error": {...} }'
  error_detail: errors/thoughtspot-problem-types.yml
idempotency:
  supported: true
  mechanism: >-
    ThoughtSpot models mutations as explicit create/update/delete operations
    keyed on stable object identifiers (GUIDs). Update and delete operations are
    naturally idempotent — repeating an update to the same target state, or
    deleting an already-deleted object, converges rather than duplicating.
    Create operations that accept a caller-supplied unique name/identifier are
    idempotent on that key. There is no separate Idempotency-Key header in the
    v2.0 REST API; idempotency is identifier-based.
  header: null
  scope: per-object-identifier
webhooks:
  supported: true
  detail: asyncapi/thoughtspot-webhooks.yml
rate_limiting:
  documented: >-
    ThoughtSpot enforces per-instance concurrency/throughput limits (notably on
    data/search and export operations) rather than a published fixed
    requests-per-minute quota; limits vary by deployment tier.
