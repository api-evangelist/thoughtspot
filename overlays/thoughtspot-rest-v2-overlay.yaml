overlay: 1.0.0
info:
  title: API Evangelist enhancements for ThoughtSpot Public REST API v2.0
  version: 1.0.0
extends: openapi/thoughtspot-rest-v2-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-21'
    x-apievangelist-provider: thoughtspot
    x-apievangelist-auth: bearer-token
    x-apievangelist-base-path: /api/rest/2.0
    x-apievangelist-mcp-server: https://agent.thoughtspot.app
    x-apievangelist-docs: https://developers.thoughtspot.com/docs/rest-apiv2-reference
- target: $.servers
  update:
  - url: 'https://{instance}/api/rest/2.0'
    description: >-
      ThoughtSpot instance base URL (replace {instance} with your ThoughtSpot
      Cloud host, e.g. my.thoughtspot.cloud). Overlay note: the original spec
      ships a {base-url} variable defaulting to https://localhost:443.
    variables:
      instance:
        default: my.thoughtspot.cloud
        description: Your ThoughtSpot instance host.
- target: $.info
  update:
    x-apievangelist-artifacts:
      authentication: authentication/thoughtspot-authentication.yml
      conventions: conventions/thoughtspot-conventions.yml
      errors: errors/thoughtspot-problem-types.yml
      data_model: data-model/thoughtspot-data-model.yml
      webhooks: asyncapi/thoughtspot-webhooks.yml
      agentic_access: agentic-access/thoughtspot-agentic-access.yml
