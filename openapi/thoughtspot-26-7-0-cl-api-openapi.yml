                        trace_id_guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        debug: Font color must be a valid 6-digit hex string (e.g. '#333333').
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized_access:
                  summary: Unauthorized access
                  value:
                    error:
                      message:
                        code: 10097
                        incident_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        trace_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        debug: Authentication required to update a custom font.
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden_access:
                  summary: Forbidden access
                  value:
                    error:
                      message:
                        code: 10023
                        incident_id_guid: c3d4e5f6-7890-1234-cdef-345678901234
                        trace_id_guid: c3d4e5f6-7890-1234-cdef-345678901234
                        debug: Only Tenant admin can update cluster-level fonts.
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unexpected_error:
                  summary: Unexpected error
                  value:
                    error:
                      message:
                        code: 10038
                        incident_id_guid: d4e5f678-9012-3456-defa-456789012345
                        trace_id_guid: d4e5f678-9012-3456-defa-456789012345
                        debug: Unexpected server error while updating the custom font.
  /api/rest/2.0/customization/styles/fonts/upload:
    post:
      operationId: uploadStyleFont
      description: "\n <span class=\"since-beta-tag\">Version: 26.7.0.cl or later</span>\n\nUploads a custom font to the cluster-level or org-level font library. Cluster-level fonts are available as defaults for all orgs. Org-level fonts are only available within that org.\n\nRequires `ADMINISTRATION` (**Can administer ThoughtSpot**) or `DEVELOPER` (**Has developer privilege**) privilege.\n\n#### Usage guidelines\n\n- Only **WOFF** and **WOFF2** font formats are accepted. TTF and OTF files are rejected with an error.\n- Set `scope` to `CLUSTER` to upload to the cluster-level library. Set `scope` to `ORG` (default) to upload to the authenticated user's org library.\n- `weight` defaults to `NORMAL` if omitted. Supported values: `NORMAL`, `LIGHT`, `BOLD`.\n- `style` defaults to `NORMAL` if omitted. Supported values: `NORMAL`, `ITALIC`, `OBLIQUE`.\n- `color` defaults to `#000000` (black) if omitted. Provide as a 6-digit hex string (e.g. `#333333`).\n- The uploaded font can be assigned to visualization areas using the `updateStyleCustomization` endpoint.\n\n\n\n\n#### Endpoint URL\n"
      tags:
      - 26.7.0.cl
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                scope:
                  description: 'Scope of the font library to upload to. CLUSTER uploads to the

                    cluster-level library, making the font available as a default for all

                    orgs. ORG uploads to the authenticated user''s org library. Defaults to

                    ORG if omitted.'
                  default: ORG
                  type: string
                  enum:
                  - CLUSTER
                  - ORG
                name:
                  description: Display name for the font (e.g. "Acme Sans").
                  type: string
                weight:
                  description: 'Weight of the font. Supported values: NORMAL, LIGHT, BOLD. Defaults to

                    NORMAL if omitted.'
                  default: NORMAL
                  type: string
                  enum:
                  - NORMAL
                  - LIGHT
                  - BOLD
                style:
                  description: 'Style of the font. Supported values: NORMAL, ITALIC, OBLIQUE. Defaults

                    to NORMAL if omitted.'
                  default: NORMAL
                  type: string
                  enum:
                  - NORMAL
                  - ITALIC
                  - OBLIQUE
                color:
                  description: 'Color of the font as a 6-digit hex string (e.g. "#333333"). Defaults to

                    #000000 (black) if omitted. Returns an error if the value is malformed.'
                  type: string
                file_content:
                  description: 'Binary WOFF or WOFF2 font file to upload. Only WOFF and WOFF2 formats

                    are accepted; TTF and OTF are rejected. The file is validated on upload.'
                  type: string
                  format: binary
              required:
              - name
              - file_content
        required: true
      parameters: []
      responses:
        '200':
          description: Font uploaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleFontUploadData'
              examples:
                example_1:
                  value:
                    id: c3d4e5f6-1111-1111-1111-111111111111
                    name: Acme Sans
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_request:
                  summary: Invalid request
                  value:
                    error:
                      message:
                        code: 10002
                        incident_id_guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        trace_id_guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        debug: Unsupported font format. Only WOFF and WOFF2 are accepted.
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized_access:
                  summary: Unauthorized access
                  value:
                    error:
                      message:
                        code: 10097
                        incident_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        trace_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        debug: Authentication required to upload a custom font to the font library.
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden_access:
                  summary: Forbidden access
                  value:
                    error:
                      message:
                        code: 10023
                        incident_id_guid: c3d4e5f6-7890-1234-cdef-345678901234
                        trace_id_guid: c3d4e5f6-7890-1234-cdef-345678901234
                        debug: Cluster config can only be accessed from PRIMARY org.
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unexpected_error:
                  summary: Unexpected error
                  value:
                    error:
                      message:
                        code: 10038
                        incident_id_guid: d4e5f678-9012-3456-defa-456789012345
                        trace_id_guid: d4e5f678-9012-3456-defa-456789012345
                        debug: Unexpected server error while uploading the custom font.
  /api/rest/2.0/webhooks/storage-config:
    get:
      operationId: getWebhookStorageConfig
      description: "\n <span class=\"since-beta-tag\">Version: 26.7.0.cl or later</span>\n\nReturns cluster-level storage setup information for configuring customer-managed storage. Use this endpoint to obtain the IAM identity details required before configuring a webhook storage destination. For S3 destinations, returns the platform AWS account ID and IAM trust policy template. For GCS destinations, returns the platform GCP service account email and the IAM role to grant for service account impersonation.\n\nRequires `ADMINISTRATION` (**Can administer ThoughtSpot**) or `DEVELOPER` (**Has developer privilege**) privilege. If [Role-Based Access Control (RBAC)](https://developers.thoughtspot.com/docs/rbac) is enabled on your instance, users with `CAN_MANAGE_WEBHOOKS` (**Can manage webhooks**) privilege are also authorized to perform this action.\n\n\n\n\n#### Endpoint URL\n"
      tags:
      - 26.7.0.cl
      parameters: []
      responses:
        '200':
          description: Storage setup information retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookStorageConfigInfo'
              examples:
                example_1:
                  description: AWS-hosted cluster — customer configuring S3 storage destination
                  value:
                  - storage_type: OBJECT_STORAGE
                    provider: AWS_S3
                    config:
                      config_type: AWS_TO_S3_STORAGE
                      aws_account_id: '123456789012'
                      trust_policy_template:
                        Version: '2012-10-17'
                        Statement:
                        - Effect: Allow
                          Principal:
                            AWS: arn:aws:iam::123456789012:root
                          Action: sts:AssumeRole
                          Condition:
                            StringEquals:
                              sts:ExternalId: ts-webhook-a1b2c3d4-7890
                      setup_instructions:
                      - 1. Create an IAM role in your AWS account
                      - 2. Attach the trust policy template to the role
                      - 3. Attach S3 permissions (s3:PutObject, s3:PutObjectAcl) to the role
                      - 4. Use the role ARN in your webhook storage configuration
                example_2:
                  description: GCP-hosted cluster — customer configuring S3 storage destination
                  value:
                  - storage_type: OBJECT_STORAGE
                    provider: AWS_S3
                    config:
                      config_type: GCP_TO_S3_STORAGE
                      gcp_service_account_id: '115663769112811637952'
                      oidc_provider: accounts.google.com
                      trust_policy_template:
                        Version: '2012-10-17'
                        Statement:
                        - Effect: Allow
                          Principal:
                            Federated: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:oidc-provider/accounts.google.com
                          Action: sts:AssumeRoleWithWebIdentity
                          Condition:
                            StringEquals:
                              accounts.google.com:sub: '115663769112811637952'
                      setup_instructions:
                      - 1. Add accounts.google.com as an Identity Provider in AWS IAM
                      - 2. Create an IAM role with Web Identity Federation trust
                      - 3. Configure the trust policy with the GCP service account ID
                      - 4. Attach S3 permissions (s3:PutObject, s3:PutObjectAcl) to the role
                      - 5. Use the role ARN in your webhook storage configuration
                example_3:
                  description: GCP-hosted cluster — customer configuring both S3 and GCS storage destinations
                  value:
                  - storage_type: OBJECT_STORAGE
                    provider: AWS_S3
                    config:
                      config_type: GCP_TO_S3_STORAGE
                      gcp_service_account_id: '115663769112811637952'
                      oidc_provider: accounts.google.com
                      trust_policy_template:
                        Version: '2012-10-17'
                        Statement:
                        - Effect: Allow
                          Principal:
                            Federated: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:oidc-provider/accounts.google.com
                          Action: sts:AssumeRoleWithWebIdentity
                          Condition:
                            StringEquals:
                              accounts.google.com:sub: '115663769112811637952'
                      setup_instructions:
                      - 1. Add accounts.google.com as an Identity Provider in AWS IAM
                      - 2. Create an IAM role with Web Identity Federation trust
                      - 3. Configure the trust policy with the GCP service account ID
                      - 4. Attach S3 permissions (s3:PutObject, s3:PutObjectAcl) to the role
                      - 5. Use the role ARN in your webhook storage configuration
                  - storage_type: OBJECT_STORAGE
                    provider: GCP_GCS
                    config:
                      config_type: GCP_TO_GCS_STORAGE
                      service_account_email: webhook-sa@example-project.iam.gserviceaccount.com
                      required_role: roles/iam.serviceAccountTokenCreator
                      setup_instructions:
                      - 1. In GCP Console, go to IAM & Admin > Service Accounts
                      - 2. Click on the service account that has write access to your GCS bucket
                      - 3. Open the 'Principals with access' tab and click 'Grant Access'
                      - 4. Enter the service account email as the principal
                      - 5. Assign the roles/iam.serviceAccountTokenCreator role and save
                      - 6. Use your service account email in the webhook storage configuration
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized_access:
                  summary: Unauthorized access
                  value:
                    error:
                      message:
                        code: 10097
                        incident_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        trace_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        debug: Authentication required to retrieve webhook storage configuration.
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden_access:
                  summary: Forbidden access
                  value:
                    error:
                      message:
                        code: 10023
                        incident_id_guid: c3d4e5f6-7890-1234-cdef-345678901234
                        trace_id_guid: c3d4e5f6-7890-1234-cdef-345678901234
                        debug: Insufficient privileges to retrieve webhook storage configuration.
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unexpected_error:
                  summary: Unexpected error
                  value:
                    error:
                      message:
                        code: 10038
                        incident_id_guid: d4e5f678-9012-3456-defa-456789012345
                        trace_id_guid: d4e5f678-9012-3456-defa-456789012345
                        debug: Unexpected server error while retrieving webhook storage configuration.
components:
  schemas:
    StyleNavigationPanel:
      type: object
      properties:
        theme:
          type: string
          enum:
          - DARK
          - TWO_TONE
          - CUSTOM
          description: Navigation panel color mode.
          nullable: true
        base_color:
          type: string
          description: Base color as a 6-digit hex string. Present only when theme is CUSTOM.
          nullable: true
        is_overridden:
          type: boolean
          description: True if explicitly set at this scope, overriding any inherited value.
          nullable: true
      description: Navigation panel color configuration for a specific scope.
    AgentConversationHistoryResponse:
      type: object
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/AgentConversationList'
          description: List of saved agent conversations for the current user.
          nullable: true
        has_more:
          type: boolean
          description: 'Whether additional conversations exist beyond this page. `true` when one or

            more conversations remain after the current page; `false` when the current

            page is the last. Use `offset` to fetch the next page.'
          nullable: true
      description: Response returned by getConversationList.
    StyleFontRecord:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: Unique UUID identifier of the font.
        scope:
          type: string
          enum:
          - CLUSTER
          - ORG
          description: Scope indicating whether this font belongs to the cluster or org library.
          nullable: true
        org:
          $ref: '#/components/schemas/StyleOrgInfo'
          description: Org associated with this font. Present only when scope is ORG.
          nullable: true
        name:
          type: string
          description: Display name of the font.
        weight:
          type: string
          enum:
          - NORMAL
          - LIGHT
          - BOLD
          description: Weight of the font.
          nullable: true
        style:
          type: string
          enum:
          - NORMAL
          - ITALIC
          - OBLIQUE
          description: Style of the font.
          nullable: true
        color:
          type: string
          description: Color of the font as a 6-digit hex string.
          nullable: true
        creation_time_in_millis:
          type: number
          format: float
          description: Timestamp in milliseconds when the font was uploaded.
          nullable: true
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/StyleFontAssignment'
          description: 'Visualization areas currently assigned to this font. Empty if not assigned

            to any area. Populated only when include_font_assignments is true.'
          nullable: true
      description: A custom font record in the font library.
    StyleFontDeleteAffectedAssignment:
      type: object
      properties:
        org:
          $ref: '#/components/schemas/StyleOrgInfo'
          description: Org context for this assignment. Present only when scope is ORG.
          nullable: true
        visualization_areas:
          type: array
          items:
            type: string
            enum:
            - CHART_X_AXIS_LABELS
            - CHART_X_AXIS_TITLE
            - CHART_Y_AXIS_LABELS
            - CHART_Y_AXIS_TITLE
            - CHART_TOOLTIP
            - CHART_SCATTER_DATA_LABELS
            - CHART_DONUT_DATA_LABELS
            - CHART_LINE_DATA_LABELS
            - CHART_COLUMN_DATA_LABELS
            - CHART_BAR_DATA_LABELS
            - CHART_AREA_DATA_LABELS
            - TABLE_VALUE_CELLS
            - ADVANCED_CHART_LABELS
          description: 'Visualization areas that used the deleted font and were automatically reset

            to the system default font.'
          nullable: true
      description: A visualization area assignment affected by a font deletion.
    ChartFontAssignmentInput:
      type: object
      required:
      - visualization_area
      - font_identifier
      properties:
        visualization_area:
          type: string
          enum:
          - CHART_X_AXIS_LABELS
          - CHART_X_AXIS_TITLE
          - CHART_Y_AXIS_LABELS
          - CHART_Y_AXIS_TITLE
          - CHART_TOOLTIP
          - CHART_SCATTER_DATA_LABELS
          - CHART_DONUT_DATA_LABELS
          - CHART_LINE_DATA_LABELS
          - CHART_COLUMN_DATA_LABELS
          - CHART_BAR_DATA_LABELS
          - CHART_AREA_DATA_LABELS
          description: Chart visualization area to assign the font to.
        font_identifier:
          type: string
          description: UUID or name of the font to assign to this area.
      description: Font assignment for a single chart visualization area.
    StyleColorEntry:
      type: object
      properties:
        primary:
          type: string
          description: Primary color as a 6-digit hex string.
          nullable: true
        secondary:
          type: array
          items:
            type: string
          description: Array of 4 secondary shade hex strings.
          nullable: true
      description: A single color entry in the chart color palette.
    StyleEmbeddedFooterText:
      type: object
      properties:
        value:
          type: string
          description: Footer text value. Empty string indicates no footer is set.
          nullable: true
        is_overridden:
          type: boolean
          description: True if explicitly set at this scope, overriding any inherited value.
          nullable: true
      description: Embedded footer text configuration for a specific scope.
    NavigationPanelInput:
      type: object
      properties:
        theme:
          type: string
          enum:
          - DARK
          - TWO_TONE
          - CUSTOM
          description: 'Color mode for the navigation panel. DARK applies the default dark theme.

            TWO_TONE applies a dual-tone style. CUSTOM enables a user-defined base

            color; base_color is required when theme is CUSTOM.'
          nullable: true
        base_color:
          type: string
          description: 'Base color as a 6-digit hex string (e.g. "#2359B6"). Required when theme

            is CUSTOM.'
          nullable: true
      description: Navigation panel color configuration.
    StyleOrgInfo:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: Unique integer ID of the org.
          nullable: true
        name:
          type: string
          description: Name of the org.
          nullable: true
      description: Org information returned in style API responses.
    StyleFontDeleteData:
      type: object
      properties:
        affected_assignments:
          type: array
          items:
            $ref: '#/components/schemas/StyleFontDeleteAffectedAssignment'
          description: 'Visualization areas that used the deleted font(s) and were automatically

            reset to the system default font. Empty if no areas were affected.'
          nullable: true
      description: Result data for font deletion.
    ACState:
      type: object
      properties:
        transaction_identifier:
          type: string
          description: Unique identifier of the transaction.
          nullable: true
        generation_number:
          type: integer
          format: int32
          description: Generation number of the transaction.
          nullable: true
    StyleFontAssignment:
      type: object
      properties:
        org:
          $ref: '#/components/schemas/StyleOrgInfo'
          description: Org context for this assignment. Present only when scope is ORG.
          nullable: true
        visualization_areas:
          type: array
          items:
            type: string
            enum:
            - CHART_X_AXIS_LABELS
            - CHART_X_AXIS_TITLE
            - CHART_Y_AXIS_LABELS
            - CHART_Y_AXIS_TITLE
            - CHART_TOOLTIP
            - CHART_SCATTER_DATA_LABELS
            - CHART_DONUT_DATA_LABELS
            - CHART_LINE_DATA_LABELS
            - CHART_COLUMN_DATA_LABELS
            - CHART_BAR_DATA_LABELS
            - CHART_AREA_DATA_LABELS
            - TABLE_VALUE_CELLS
            - ADVANCED_CHART_LABELS
          description: Visualization areas using this font.
          nullable: true
      description: Visualization areas assigned to a font, grouped by org context.
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          nullable: true
    StyleChartColorPalette:
      type: object
      properties:
        colors:
          type: array
          items:
            $ref: '#/components/schemas/StyleColorEntry'
          description: Ordered array of 8 color entries.
          nullable: true
        disable_color_rotation:
          type: boolean
          description: When true, automatic color rotation across chart data series is disabled.
          nullable: true
        is_overridden:
          type: boolean
          description: True if explicitly set at this scope, overriding any inherited value.
          nullable: true
      description: Chart color palette configuration for a specific scope.
    ConversationMessage:
      type: object
      required:
      - message_id
      - timestamp_in_millis
      properties:
        message_id:
          type: string
          description: 'Stable identifier for the turn. For liveboard-started synthetic first turns,

            this is the root node identifier.'
        timestamp_in_millis:
          type: object
          description: Milliseconds since Unix epoch for the turn.
        user_prompt:
          $ref: '#/components/schemas/UserPrompt'
          description: 'User-authored prompt that started the turn: the user''s message and any files

            or connector resources attached to it. Null for liveboard-started synthetic

            first turns.'
          nullable: true
        response_items:
          type: array
          items:
            type: object
          description: 'Agent-side output produced in response to this turn. Empty array for

            in-progress turns where the agent has not yet produced output.'
          nullable: true
      description: 'One conversational exchange: an optional user prompt (message and attachments),

        followed by the agent''s response items for that turn.'
    TableVisualizationFontRecord:
      type: object
      properties:
        visualization_area:
          type: string
          enum:
          - TABLE_VALUE_CELLS
          description: Table visualization area.
          nullable: true
        font_id:
          type: string
          description: 'UUID of the font assigned to this area. Null when the system default font

            is active.'
          nullable: true
        font_name:
          type: string
          description: 'Display name of the font assigned to this area. Null when the system

            default font is active.'
          nullable: true
        is_overridden:
          type: boolean
          description: True if explicitly set at this scope, overriding any inherited value.
          nullable: true
      description: Font assignment for a table visualization area in the response.
    AdvancedChartFontAssignmentInput:
      type: object
      required:
      - visualization_area
      - font_identifier
      properties:
        visualization_area:
          type: string
          enum:
          - ADVANCED_CHART_LABELS
          description: 'Advanced chart visualization area to assign the font to. <br/>  <span class="since-beta-tag">Version: 26.7.0.cl or later</span>'
        font_identifier:
          type: string
          description: 'UUID or name of the font to assign to this area. <br/>  <span class="since-beta-tag">Version: 26.7.0.cl or later</span>'
      description: Font assignment for a single advanced chart visualization area.
    StyleLogoSlot:
      type: object
      properties:
        id:
          type: string
          description: UUID of the active logo.
          nullable: true
        is_overridden:
          type: boolean
          description: 'True if a custom logo is uploaded at this scope. False if the system

            default or cluster logo is active.'
          nullable: true
      description: Status of a single logo slot.
    StyleFontUploadData:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: Unique UUID identifier of the uploaded font.
        name:
          type: string
          description: Display name of the uploaded font.
      description: Font data returned after a successful upload.
    UpdateConversationRequest:
      type: object
      properties:
        title:
          description: 'New display title for the conversation. Omit to leave the title

            unchanged.'
          type: string
    UserPrompt:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/UserMessage'
          description: User query that started the turn. Null for liveboard-started synthetic first turns.
          nullable: true
        attachments:
          type: array
          items:
            type: object
          description: 'Files or connector resources attached to the user message. Empty array when

            there are no attachments.'
          nullable: true
      description: 'User-authored prompt for a conversation turn: the user''s text message and any

        files or connector resources attached to it.'
    StyleColorEntryInput:
      type: object
      required:
      - primary
      properties:
        primary:
          type: string
          description: Primary color as a 6-digit hex string (e.g. "#2359B6"). Required.
        secondary:
          type: array
          items:
            type: string
          description: 'Array of exactly 4 secondary shade hex strings. If omitted, the server

            auto-generates 4 shades from the primary color. If provided, must contain

            exactly 4 valid 6-digit hex color strings.'
          nullable: true
      description: A single color entry in the chart color palette.
    VisualizationFontsInput:
      type: object
      properties:
        chart_visualization_fonts:
          type: array
          items:
            $ref: '#/components/schemas/ChartFontAssignmentInput'
          description: 'Font assignments for chart visualization areas. Provide only the areas to

            update; omitted areas remain unchanged.'
          nullable: true
        table_visualization_fonts:
          type: array
          items:
            $ref: '#/components/schemas/TableFontAssignmentInput'
          description: 'Font assignments for table visualization areas. Provide only the areas to

            update; omitted areas remain unchanged.'
          nullable: true
        advanced_chart_visualization_fonts:
          type: array
          items:
            $ref: '#/components/schemas/AdvancedChartFontAssignmentInput'
          description: 'Font assignments for advanced chart visualization areas. Provide only the

            areas to update; omitted areas remain unchanged. <br/>  <span class="since-beta-tag">Version: 26.7.0.cl or later</span>'
          nullable: true
      description: Font assignments grouped by visualization type.
    StyleColorPaletteInput:
      type: object
      properties:
        colors:
          type: array
          items:
            $ref: '#/components/schemas/StyleColorEntryInput'
          description: Ordered array of exactly 8 color entries defining the chart color palette.
          nullable: true
        disable_color_rotation:
          type: boolean
          description: When true, disables automatic color rotation across chart data series.
          nullable: true
      description: Chart color palette configuration.
    DataSourceEntry:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: Unique identifier of the data source.
        name:
          type: string
          description: Display name of the data source.
      description: A data source associated with a conversation, returned as a typed entry.
    AnswerDetails:
      type: object
      properties:
        title:
          type: string
          description: Display title of the answer.
          nullable: true
        description:
          type: string
          description: Description of the answer.
          nullable: true
        session_identifier:
          type: string
          description: Unique identifier of the session.
          nullable: true
        generation_number:
          type: integer
          format: int32
          description: Generation number of the answer.
          nullable: true
        tokens:
          type: array
          items:
            type: string
          description: Ordered list of TML token strings that make up the answer query.
          nullable: true
        visualization_type:
          type: string
          enum:
          - Chart
          - CHART
          - Table
          - TABLE
          - Undefined
          - UNDEFINED
          description: Visualization type for the answer.
          nullable: true
        formulas:
          type: array
          items:
            type: string
          description: List of formulas used in the answer.
          nullable: true
        parameters:
          type: array
          items:
            type: string
          description: List of parameters used in the answer.
          nullable: true
        sub_queries:
          type: array
          items:
            type: object
          description: List of sub-queries used in the answer.
          nullable: true
        ac_state:
          $ref: '#/components/schemas/ACState'
          description: Agent context state for the answer.
          nullable: true
    UpdateStyleFontRequest:
      type: object
      properties:
        scope:
          description: 'Scope of the font library containing this font. CLUSTER targets the

            cluster-level library. ORG targets the authenticated user''s org library.

            Defaults to ORG if omitted.'
          default: ORG
          type: string
          enum:
          - CLUSTER
          - ORG
        name:
          description: New display name for the font.
          type: string
        weight:
          description: 'New weight for the font. Supported values: NORMAL, LIGHT, BOLD.'
          type: string
          enum:
          - NORMAL
          - LIGHT
          - BOLD
        style:
          description: 'New style for the font. Supported values: NORMAL, ITALIC, OBLIQUE.'
          type: string
          enum:
          - NORMAL
          - ITALIC
          - OBLIQUE
        color:
          description: 'New color for the font as a 6-digit hex string (e.g. "#333333"). Returns

            an error if the value is malformed.'
          type: string
    StyleLogoStatus:
      type: object
      properties:
        default_logo:
          $ref: '#/components/schemas/StyleLogoSlot'
          description: 'Status of the DEFAULT logo slot (square app icon and favicon; recommended

            140x140 px).'
          nullable: true
        wide_logo:
          $ref: '#/components/schemas/StyleLogoSlot'
          description: 'Status of the WIDE logo slot (horizontal top nav bar logo; recommended

            230x45 px).'
          nullable: true
      description: Logo status per slot.
    SearchStyleFontsRequest:
      type: object
      properties:
        scope:
          description: 'Scope of the font library to search. CLUSTER searches the cluster-level

            library. ORG searches the authenticated user''s org library. Returns both Cluster and Org

            level font if omitted.'
          type: string
          enum:
          - CLUSTER
          - ORG
        font_identifier:
          description: Filter by UUID or name of a specific font.
          type: string
        name_pattern:
          description: Filter by font display name. Supports partial, case-insensitive matching.
          type: string
        include_font_assignments:
          description: 'When true, includes visualization areas this font is assigned to in the

            response. Defaults to false if omitted.'
          default: false
          type: boolean
          nullable: true
    CodeExecutionFileMetadata:
      type: object
      required:
      - file_id
      - expired
      properties:
        file_id:
          type: string
          description: 'Unique identifier of the code-execution-generated file. Stable across

            conversation turns.'
        display_name:
          type: string
          description: Human-readable file name.
          nullable: true
        file_type:
          type: string
          description: 'File type hint. Either a MIME string (e.g. `text/csv`) or an extension

            (e.g. `csv`).'
          nullable: true
        created_time_in_millis:
          type: object
          description: Milliseconds since Unix epoch when the file was created.
          nullable: true
        expired:
          type: boolean
          description: True when the file is no longer downloadable (storage expired or evicted).
      description: 'Sanitized public metadata for a code-execution-generated file. Internal

        storage identifiers (e.g. Azure blob ids) are deliberately not exposed.'
    StyleResetOptionsInput:
      type: object
      properties:
        style:
          type: array
          items:
            type: string
            enum:
            - CHART_COLOR_PALETTE
            - EMBEDDED_FOOTER_TEXT
            - NAV_PANEL_COLOR
            - DEFAULT_LOGO
            - WIDE_LOGO
          description: 'Style fields to reset. Supported values: CHART_COLOR_PALETTE,

            EMBEDDED_FOOTER_TEXT, NAV_PANEL_COLOR, DEFAULT_LOGO, WIDE_LOGO.'
          nullable: true
        visualization_areas:
          type: array
          items:
            type: string
            enum:
            - CHART_X_AXIS_LABELS
            - CHART_X_AXIS_TITLE
            - CHART_Y_AXIS_LABELS
            - CHART_Y_AXIS_TITLE
            - CHART_TOOLTIP
            - CHART_SCATTER_DATA_LABELS
            - CHART_DONUT_DATA_LABELS
            - CHART_LINE_DATA_LABELS
            - CHART_COLUMN_DATA_LABELS
            - CHART_BAR_DATA_LABELS
            - CHART_AREA_DATA_LABELS
            - TABLE_VALUE_CELLS
            - ADVANCED_CHART_LABELS
          description: 'Visualization areas whose font assignments should revert to the system

            default font.'
          nullable: true
      description: Fields to revert to defaults when operation is RESET.
    ConversationMessageResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
          description: Ordered conversation messages. Empty array when the conversation has no messages.
          nullable: true
        code_execution_files:
          type: array
          items:
            $ref: '#/components/schemas/CodeExecutionFileMetadata'
          description: 'Sanitized code-execution file metadata for files referenced by this

            conversation. Empty array when the conversation has no code-execution files.'
          nullable: true
      description: 'Response body of getConversation. `messages` is ordered oldest to newest.

        `code_execution_files` is a list of sanitized code-execution file metadata

        entries, keyed in upstream by `file_id`.'
    DeleteStyleFontsRequest:
      type: object
      properties:
        scope:
          description: 'Scope of the font library to delete from. CLUSTER deletes from the

            cluster-level library. ORG deletes from the authenticated user''s org

            library. Defaults to ORG if omitted.'
          default: ORG
          type: string
          enum:
          - CLUSTER
          - ORG
        font_identifiers:
          description: 'UUIDs or names of the fonts to delete. At least one identifier is

            required.'
          type: array
          items:
            type: string
        dry_run:
          description: 'When true, returns affected assignments without applying the deletion.

            Use this to preview the impact before committing. Defaults to true if

            omitted.'
          default: true
          type: boolean
          nullable: true
      required:
      - font_identifiers
    ChartVisualizationFontRecord:
      type: object
      properties:
        visualization_area:
          type: string
          enum:
          - CHART_X_AXIS_LABELS
          - CHART_X_AXIS_TITLE
          - CHART_Y_AXIS_LABELS
          - CHART_Y_AXIS_TITLE
          - CHART_TOOLTIP
          - CHART_SCATTER_DATA_LABELS
          - CHART_DONUT_DATA_LABELS
          - CHART_LINE_DATA_LABELS
          - CHART_COLUMN_DATA_LABELS
          - CHART_BAR_DATA_LABELS
          - CHART_AREA_DATA_LABELS
          description: Chart visualization area.
          nullable: true
        font_id:
          type: string
          description: 'UUID of the font assigned to this area. Null when the system default font

            is active.'
          nullable: true
        font_name:
          type: string
          description: 'Display name of the font assigned to this area. Null when the system

            default font is active.'
          nullable: true
        is_overridden:
          type: boolean
          description: True if explicitly set at this scope, overriding any inherited value.
          nullable: true
      description: Font assignment for a chart visualization area in the response.
    AdvancedChartVisualizationFontRecord:
      type: object
      properties:
        visualization_area:
          type: string
          enum:
          - ADVANCED_CHART_LABELS
          description: Advanced chart visualization area.
          nullable: true
        font_id:
          type: string
          description: 'UUID of the font assigned to this area. Null when the system default font

            is active.'
          nullable: true
        font_name:
          type: string
          description: 'Display name of the font assigned to this area. Null when the system

            default font is active.'
          nullable: true
        is_overridden:
          type: boolean
          description: True if explicitly set at this scope, overriding any inherited value.
          nullable: true
      description: Font assignment for an advanced chart visualization area in the response.
    SearchStyleCustomizationsRequest:
      type: object
      properties:
        scope:
          description: 'Scope of the style preferences to retrieve. CLUSTER returns cluster-level

            defaults. ORG returns preferences for the authenticated user''s org, which

            may override cluster defaults. If not specified, returns both cluster and

            org preferences based on user privileges.'
          type: string
          enum:
          - CLUSTER
          - ORG
    ExportStyleLogosRequest:
      type: object
      properties:
        scope:
          description: 'Scope of the logos to export. CLUSTER exports cluster-level logos. ORG

            exports logos for the authenticated user''s org, falling back to cluster

            or defaults if no custom logo is set. Defaults to ORG if

            omitted.'
          default: ORG
          type: string
          enum:
          - CLUSTER
          - ORG
    DeleteManualTranslationsRequest:
      type: object
      properties:
        scope:
          description: 'Org scope for the delete. `ORG` (default) targets the calling

            user''s current org. `CLUSTER` targets the All-Org context.'
          default: ORG
          type: string
          enum:
          - ORG
          - CLUSTER
    StyleVisualizationFonts:
      type: object
      properties:
        chart_visualization_fonts:
          type: array
          items:
            $ref: '#/components/schemas/ChartVisualizationFontRecord'
          description: Font assignments for chart visualization areas.
          nullable: true
        table_visualization_fonts:
          type: array
          items:
            $ref: '#/components/schemas/TableVisualizationFontRecord'
          description: Font assignments for table visualization areas.
          nullable: true
        advanced_chart_visualization_fonts:
          type: array
          items:
            $ref: '#/components/schemas/AdvancedChartVisualizationFontRecord'
          description: 'Font assignments for advanced chart visualization areas. <br/>  <span class="since-beta-tag">Version: 26.7.0.cl or later</span>'
          nullable: true
      description: Effective font assignments per visualization type.
    LoadAnswerResponse:
      type: object
      properties:
        answer:
          $ref: '#/components/schemas/AnswerDetails'
          description: Answer details for the loaded message.
          nullable: true
    AgentConversationList:
      type: object
      required:
      - conversation_identifier
      properties:
        conversation_identifier:
          type: string
          description: Unique identifier of the conversation.
        conversation_title:
          type: string
          description: Display title of the conversation.
          nullable: true
        created_at:
          type: string
          description: ISO 8601 timestamp when the conversation was created.
          nullable: true
        updated_at:
          type: string
          description: ISO 8601 timestamp when the conversation was last updated.
          nullable: true
        data_source_identifiers:
          type: array
          items:
            type: string
          description: Unique identifiers of the data sources associated with the conversation.
          nullable: true
        data_source_names:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceEntry'
          description: Data sources associated with the conversation, each with an `id` and `name`.
          nullable: true
      description: A saved agent conversation item returned in list responses.
    UserMessage:
      type: object
      required:
      - message_id
      - content
      properties:
        message_id:
          type: string
          description: Unique identifier of the user message.
        content:
          type: string
          description: Text body of the user query.
      description: 'User-authored text message that begins a conversation turn.

        Null when the turn is a synthetic liveboard-started first turn.'
    ExportManualTranslationsRequest:
      type: object
      properties:
        scope:
          description: 'Org scope for the export. `ORG` (default) targets the calling

            user''s current org. `CLUSTER` targets the All-Org context.'
          default: ORG
          type: string
          enum:
          - ORG
          - CLUSTER
    StylePreference:
      type: object
      properties:
        scope:
          type: string
          enum:
          - CLUSTER
          - ORG
          description: Scope at which these style preferences apply.
          nullable: true
        org:
          $ref: '#/components/schemas/StyleOrgInfo'
          description: Org associated with these preferences. Present only when scope is ORG.
          nullable: true
        navigation_panel:
          $ref: '#/components/schemas/StyleNavigationPanel'
          description: Navigation panel color configuration.
          nullable: true
        chart_color_palette:
          $ref: '#/components/schemas/StyleChartColorPalette'
          description: Chart color palette configuration.
          nullable: true
        embedded_footer_text:
          $ref: '#/components/schemas/StyleEmbeddedFooterText'
          description: Embedded footer text configuration.
          nullable: true
        logo:
          $ref: '#/components/schemas/StyleLogoStatus'
          description: Logo status per slot.
          nullable: true
        visualization_fonts:
          $ref: '#/components/schemas/StyleVisualizationFonts'
          description: Effective font assignments per visualization area.
          nullable: true
      description: Style preferences for a single scope entry.
    TableFontAssignmentInput:
      type: object
      required:
      - visualization_area
      - font_identifier
      properties:
        visualization_area:
          type: string
          enum:
          - TABLE_VALUE_CELLS
          description: Table visualization area to assign the font to.
        font_identifier:
          type: string
          description: UUID or name of the font to assign to this area.
      description: Font assignment for a single table visualization area.
    WebhookStorageConfigInfo:
      type: object
      required:
      - storage_type
      - provider
      - config
      properties:
        storage_type:
          type: string
          enum:
          - OBJECT_STORAGE
          description: Type of storage destination.
        provider:
          type: string
          enum:
          - AWS_S3
          - GCP_GCS
          description: Storage destination provider.
        config:
          $ref: '#/components/schemas/WebhookStorageSetupConfig'
          description: Setup configuration specific to the upload path.
      description: Cluster-level storage setup information for configuring customer-managed storage.
    WebhookStorageSetupConfig:
      type: object
      required:
      - config_type
      - setup_instructions
      properties:
        config_type:
          type: string
          enum:
          - AWS_TO_S3_STORAGE
          - GCP_TO_S3_STORAGE
          - GCP_TO_GCS_STORAGE
          description: 'Discriminator identifying the upload path. One of: AWS_TO_S3_STORAGE, GCP_TO_S3_STORAGE, GCP_TO_GCS_STORAGE.'
        aws_account_id:
          type: string
          description: AWS Account ID of the platform. Populated for AWS_TO_S3_STORAGE. Include in your IAM role trust policy.
          nullable: true
        gcp_service_account_id:
          type: string
          description: GCP service account numeric ID of the platform (the 'sub' claim in OIDC tokens). Populated for GCP_TO_S3_STORAGE.
          nullable: true
        oidc_provider:
          type: string
          description: OIDC identity provider URL. Populated for GCP_TO_S3_STORAGE; always 'accounts.google.com' for GCP.
          nullable: true
        trust_policy_template:
          type: object
          description: Sample IAM trust policy JSON. Populated for AWS_TO_S3_STORAGE and GCP_TO_S3_STORAGE.
          nullable: true
        service_account_email:
          type: string
          description: GCP service account email of the platform. Populated for GCP_TO_GCS_STORAGE. Grant it roles/iam.serviceAccountTokenCreator on your service account.
          nullable: true
        required_role:
          type: string
          description: IAM role the customer must grant to the platform service account. Populated for GCP_TO_GCS_STORAGE.
          nullable: true
        setup_instructions:
          type: array
          items:
            type: string
          description: Step-by-step instructions to configure the storage destination.
      description: 'Storage setup configuration for a specific upload path. The populated fields depend on config_type:

        AWS_TO_S3_STORAGE: aws_account_id, trust_policy_template, setup_instructions.

        GCP_TO_S3_STORAGE: gcp_service_account_id, oidc_provider, trust_policy_template, setup_instructions.

        GCP_TO_GCS_STORAGE: service_account_email, required_role, setup_instructions.'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
