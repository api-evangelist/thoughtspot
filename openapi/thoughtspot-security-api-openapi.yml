openapi: 3.2.0
info:
  title: ThoughtSpot Public REST Security API
  version: '2.0'
servers:
- url: '{base-url}'
  variables:
    base-url:
      default: https://localhost:443
security:
- bearerAuth: []
tags:
- name: Security
paths:
  /api/rest/2.0/security/metadata/assign:
    post:
      operationId: assignChangeAuthor
      description: 'Version: 9.0.0.cl or later


        Transfers the ownership of one or several objects from one user to another.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege.


        If Role-Based Access Control (RBAC) is enabled on your instance, the `USER_ADMINISTRATION` (**Can manage users**) privilege and edit access to the objects are required.


        #### Endpoint URL'
      tags:
      - Security
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignChangeAuthorRequest'
        required: true
      parameters: []
      responses:
        '204':
          description: Author assignment for given metadata objects is successful.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Assign change author
      x-summary-source: derived
  /api/rest/2.0/security/column/rules/fetch:
    post:
      operationId: fetchColumnSecurityRules
      description: 'Beta Version: 10.12.0.cl or later


        Fetches column security rules for specified tables.


        This API endpoint retrieves column-level security rules configured for tables. It returns information about which columns are secured and which groups have access to those columns.


        #### Usage guidelines


        - Provide an array of table identifiers using either `identifier` (GUID or name) or `obj_identifier` (object ID)

        - At least one of `identifier` or `obj_identifier` must be provided for each table

        - The API returns column security rules for all specified tables

        - Users must have appropriate permissions to access security rules for the specified tables


        #### Required permissions


        - `ADMINISTRATION` - Can administer ThoughtSpot

        - `DATAMANAGEMENT` - Can manage data

        - `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` - Can manage worksheet views and tables


        #### Example request


        ```json

        {

        "tables": [

        {

        "identifier": "table-guid",

        "obj_identifier": "table-object-id"

        }

        ]

        }

        ```


        #### Response format


        The API returns an array of `ColumnSecurityRuleResponse` objects wrapped in a `data` field. Each `ColumnSecurityRuleResponse` object contains:

        - Table information (GUID and object ID)

        - Array of column security rules with column details, group access, and source table information


        #### Example response


        ```json

        {

        "data": [

        {

        "guid": "table-guid",

        "objId": "table-object-id",

        "columnSecurityRules": [

        {

        "column": {

        "id": "col_123",

        "name": "Salary"

        },

        "groups": [

        {

        "id": "group_1",

        "name": "HR Department"

        }

        ],

        "sourceTableDetails": {

        "id": "source-table-guid",

        "name": "Employee_Data"

        }

        }

        ]

        }

        ]

        }

        ```


        #### Endpoint URL'
      tags:
      - Security
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchColumnSecurityRulesRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Successfully fetched column security rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColumnSecurityRuleResponse'
        '400':
          description: Bad request - Table not found or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - User doesn't have permission to access security rules for this table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Fetch column security rules
      x-summary-source: derived
  /api/rest/2.0/security/metadata/fetch-object-privileges:
    post:
      operationId: fetchObjectPrivileges
      description: 'Version: 26.3.0.cl or later


        This API fetches the object privileges present for the given list of principals (user or group), on the given set of objects. It supports pagination, which can be enabled and configured using the request parameters. It provides users access to certain features based on privilege based access control.


        #### Usage guidelines


        - Specify the `type` (`USER` or `USER_GROUP`) and `identifier` (either GUID or name) of the principals for which you want to retrieve object privilege information in the `principals` array.

        - Specify the `type` (`LOGICAL_TABLE`) and `identifier` (either GUID or name) of the metadata objects for which you want to retrieve object privilege information in the `metadata` array. Only `LOGICAL_TABLE` metadata type is supported for now. It may be extended for other metadata types in future.

        - To control the offset from where principals have to be fetched, use `record_offset`. When `record_offset` is 0, information is fetched from the beginning.

        - To control the number of principals to be fetched, use `record_size`. Default `record_size` is 20.

        - Ensure `record_offset` for a subsequent request is one more than the value of `record_size` of the previous request.

        - Ensure using correct Authorization Bearer Token corresponding to specific user & org.


        #### Example request


        ```json

        {

        "principals": [

        {

        "type": "type-1",

        "identifier": "principal-guid-or-name-1"

        },

        {

        "type": "type-2",

        "identifier": "principal-guid-or-name-2"

        }

        ],

        "metadata": [

        {

        "type": "metadata-type-1",

        "identifier": "metadata-guid-or-name-1"

        },

        {

        "type": "metadata-type-2",

        "identifier": "metadata-guid-or-name-2"

        }

        ],

        "record_offset": 0,

        "record_size": 20

        }

        ```


        #### Response format


        The API returns an array of `metadata_object_privileges` objects wrapped in JSON. Each `metadata_object_privileges` object contains:

        - Metadata information (GUID, name and type)

        - Array of `principal_object_privilege_info`.

        - Each `principal_object_privilege_info` contains:

        - Principal type. All principals of this type are listed as described below.

        - Array of `principal_object_privileges`.

        - Each `principal_object_privileges` contains:

        - Principal information (GUID, name, subtype)

        - List of applied object level privileges.


        #### Example response


        ```json

        {

        "metadata_object_privileges": [

        {

        "metadata_id": "metadata-guid-1",

        "metadata_name": "metadata-name-1",

        "metadata_type": "metadata-type-1",

        "principal_object_privilege_info": [

        {

        "principal_type": "principal-type-1",

        "principal_object_privileges": [

        {

        "principal_id": "principal-guid-1",

        "principal_name": "principal-name-1",

        "principal_sub_type": "principal-sub-type-1",

        "object_privileges": "[object-privilege-1, object-privilege-2]"

        },

        {

        "principal_id": "principal-guid-2",

        "principal_name": "principal-name-2",

        "principal_sub_type": "principal-sub-type-2",

        "object_privileges": "[object-privilege-1, object-privilege-2]"

        }

        ]

        },

        {

        "principal_type": "principal-type-2",

        "principal_object_privileges": [

        {

        "principal_id": "principal-guid-3",

        "principal_name": "principal-guid-4",

        "principal_sub_type": "principal-sub-type-4",

        "object_privileges": "[object-privilege-1]"

        }

        ]

        }

        ]

        },

        {

        "metadata_id": "metadata-guid-2",

        "metadata_name": "metadata-name-2",

        "metadata_type": "metadata-type-2",

        "principal_object_privilege_info": [

        {

        "principal_type": "principal-type-1",

        "principal_object_privileges": [

        {

        "principal_id": "principal-guid-1",

        "principal_name": "principal-name-1",

        "principal_sub_type": "principal-sub-type-1",

        "object_privileges": "[object-privilege-3, object-privilege-4]"

        },

        {

        "principal_id": "principal-guid-2",

        "principal_name": "principal-name-2",

        "principal_sub_type": "principal-sub-type-2",

        "object_privileges": "[object-privilege-4]"

        }

        ]

        }

        ]

        }

        ]

        }

        ```


        #### Endpoint URL'
      tags:
      - Security
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchObjectPrivilegesRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Fetching defined object privileges of metadata objects is successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectPrivilegesOfMetadataResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Fetch object privileges
      x-summary-source: derived
  /api/rest/2.0/security/principals/fetch-permissions:
