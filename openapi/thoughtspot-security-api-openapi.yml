  /api/rest/2.0/security/metadata/manage-object-privilege:
    post:
      operationId: manageObjectPrivilege
      description: 'Version: 26.3.0.cl or later


        This API allows the addition or deletion of object level privileges for a set of users and groups, on a set of metadata objects. It provides users to access certain features based on privilege based access control.


        #### Usage guidelines


        - Specify the `operation`. The supported operations are: `ADD`, `REMOVE`.

        - Specify the type of the objects on which the object privileges are being provided in `metadata_type`. Only `LOGICAL_TABLE` metadata type is supported for now. It may be extended for other metadata types in future.

        - Specify the list of object privilege types in the `object_privilege_types` array. The supported object privilege types are: `SPOTTER_COACHING_PRIVILEGE`.

        - Specify the identifiers (either GUID or name) for the metadata objects in the `metadata_identifiers` array.

        - Specify the `type` (`USER` or `USER_GROUP`) and `identifier` (either GUID or name) of the principals to which you want to apply the given operation and given object privileges in the `principals` array.

        - Ensure using correct Authorization Bearer Token corresponding to specific user & org.


        #### Example request


        ```json

        {

        "operation": "operation-type",

        "metadata_type": "metadata-type",

        "object_privilege_types": ["privilege-type-1", "privilege-type-2"],

        "metadata_identifiers": ["metadata-guid-or-name-1", "metadata-guid-or-name-1"],

        "principals": [

        {

        "type": "type-1",

        "identifier": "principal-guid-or-name-1"

        },

        {

        "type": "type-2",

        "identifier": "principal-guid-or-name-2"

        }

        ]

        }

        ```


        > ###### Note:

        > * Only admin users, users with edit access and users with coaching privilege on a given data-model can add or remove principals related to SPOTTER_COACHING_PRIVILEGE


        #### Endpoint URL'
      tags:
      - Security
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageObjectPrivilegeRequest'
        required: true
      parameters: []
      responses:
        '204':
          description: Object privileges added/removed successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
