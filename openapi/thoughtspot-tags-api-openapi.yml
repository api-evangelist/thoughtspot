openapi: 3.2.0
info:
  title: ThoughtSpot Public REST Tags API
  version: '2.0'
servers:
- url: '{base-url}'
  variables:
    base-url:
      default: https://localhost:443
security:
- bearerAuth: []
tags:
- name: Tags
paths:
  /api/rest/2.0/tags/assign:
    post:
      operationId: assignTag
      description: 'Version: 9.0.0.cl or later


        Assigns tags to Liveboards, Answers, Tables, and Worksheets.


        Requires edit access to the metadata object.


        #### Endpoint URL'
      tags:
      - Tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTagRequest'
        required: true
      parameters: []
      responses:
        '204':
          description: Tags successfully assigned.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Assign tag
      x-summary-source: derived
  /api/rest/2.0/tags/create:
    post:
      operationId: createTag
      description: 'Version: 9.0.0.cl or later


        Creates a tag object.


        Tags are labels that identify a metadata object. For example, you can create a tag to designate subject areas, such as sales, HR, marketing, and finance.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the `TAGMANAGEMENT` (**Can manage tags**) privilege is required to create, edit, and delete tags.


        #### Endpoint URL'
      tags:
      - Tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Tag successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
              examples:
                example_1:
                  value:
                    name: test5
                    id: 6abf5aec-3485-4f83-b25f-8c55b92e2b20
                    color: '#342323'
                    deleted: false
                    hidden: false
                    external: false
                    deprecated: false
                    creation_time_in_millis: 1685441468684
                    modification_time_in_millis: 1685441468684
                    author_id: 59481331-ee53-42be-a548-bd87be6ddd4a
                    modifier_id: 59481331-ee53-42be-a548-bd87be6ddd4a
                    owner_id: 6abf5aec-3485-4f83-b25f-8c55b92e2b20
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Create tag
      x-summary-source: derived
  /api/rest/2.0/tags/{tag_identifier}/delete:
    post:
      operationId: deleteTag
      description: 'Version: 9.0.0.cl or later


        Deletes a tag object from the ThoughtSpot system


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the `TAGMANAGEMENT` (**Can manage tags**) privilege is required to create, edit, and delete tags.


        #### Endpoint URL'
      tags:
      - Tags
      parameters:
      - in: path
        name: tag_identifier
        required: true
        schema:
          type: string
        description: Tag identifier Tag name or Tag id.
      responses:
        '204':
          description: Tag successfully deleted.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Delete tag
      x-summary-source: derived
  /api/rest/2.0/tags/search:
    post:
      operationId: searchTags
      description: 'Version: 9.0.0.cl or later


        Gets a list of tag objects available on the ThoughtSpot system. To get details of a specific tag object, specify the GUID or name.


        Any authenticated user can search for tag objects.


        #### Endpoint URL'
      tags:
      - Tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchTagsRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Tags search result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
              examples:
                example_1:
                  value:
                  - name: test4
                    id: 0935bbb5-17e2-43ab-b657-da6bf347cbb4
                    color: '#342323'
                    deleted: false
                    hidden: false
                    external: false
                    deprecated: false
                    creation_time_in_millis: 1684937524885
                    modification_time_in_millis: 1684937524885
                    author_id: 59481331-ee53-42be-a548-bd87be6ddd4a
                    modifier_id: 59481331-ee53-42be-a548-bd87be6ddd4a
                    owner_id: 0935bbb5-17e2-43ab-b657-da6bf347cbb4
                  - name: test6
                    id: 65a5c39a-daf5-4cae-975f-44283628494e
                    color: '#342323'
                    deleted: false
                    hidden: false
                    external: false
                    deprecated: false
                    creation_time_in_millis: 1684988834183
                    modification_time_in_millis: 1684988887888
                    author_id: 59481331-ee53-42be-a548-bd87be6ddd4a
                    modifier_id: 59481331-ee53-42be-a548-bd87be6ddd4a
                    owner_id: 65a5c39a-daf5-4cae-975f-44283628494e
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Search tags
      x-summary-source: derived
  /api/rest/2.0/tags/unassign:
    post:
      operationId: unassignTag
      description: 'Version: 9.0.0.cl or later


        Removes the tags applied to a Liveboard, Answer, Table, or Worksheet.


        Requires edit access to the metadata object.


        #### Endpoint URL'
      tags:
      - Tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnassignTagRequest'
        required: true
      parameters: []
      responses:
        '204':
          description: Tags successfully unassigned.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Unassign tag
      x-summary-source: derived
  /api/rest/2.0/tags/{tag_identifier}/update:
    post:
      operationId: updateTag
      description: 'Version: 9.0.0.cl or later


        Updates a tag object.


        You can modify the `name` and `color` properties of a tag object.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the `TAGMANAGEMENT` (**Can manage tags**) privilege is required to create, edit, and delete tags.


        #### Endpoint URL'
      tags:
      - Tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagRequest'
        required: true
      parameters:
      - in: path
        name: tag_identifier
        required: true
        schema:
          type: string
        description: Name or Id of the tag.
      responses:
        '204':
          description: Tag successfully updated.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Update tag
      x-summary-source: derived
components:
  schemas:
    CreateTagRequest:
      type: object
      properties:
        name:
          description: Name of the tag.
          type: string
        color:
          description: 'Hex color code to be assigned to the tag. For example, #ff78a9.'
          type: string
      required:
      - name
    UpdateTagRequest:
      type: object
      properties:
        name:
          description: Name of the tag.
          type: string
        color:
          description: 'Hex color code to be assigned to the tag. For example, #ff78a9.'
          type: string
    SearchTagsRequest:
      type: object
      properties:
        tag_identifier:
          description: Name or Id of the tag.
          type: string
        name_pattern:
          description: A pattern to match case-insensitive name of the Tag object.
          type: string
        color:
          description: Color of the tag.
          type: string
    TagMetadataTypeInput:
      type: object
      required:
      - identifier
      properties:
        type:
          type:
          - string
          - 'null'
          enum:
          - LIVEBOARD
          - ANSWER
          - LOGICAL_TABLE
          - LOGICAL_COLUMN
          - CONNECTION
          - COLLECTION
          description: "  Type of metadata.\n  \n\nRequired if the name of the object is set as the identifier. This attribute is optional when the object GUID is specified as the identifier.\n  1. LIVEBOARD\n  2. ANSWERS\n  3. LOGICAL_TABLE for any data object such as table, worksheet or view.\n  4. LOGICAL_COLUMN for a column of any data object such as tables, worksheets or views."
        identifier:
          type: string
          description: Unique ID or name of the metadata.
    Tag:
      type: object
      required:
      - name
      - id
      properties:
        name:
          type: string
        id:
          type: string
        color:
          type:
          - string
          - 'null'
        deleted:
          type:
          - boolean
          - 'null'
        hidden:
          type:
          - boolean
          - 'null'
        external:
          type:
          - boolean
          - 'null'
        deprecated:
          type:
          - boolean
          - 'null'
        creation_time_in_millis:
          type:
          - number
          - 'null'
          format: float
        modification_time_in_millis:
          type:
          - number
          - 'null'
          format: float
        author_id:
          type:
          - string
          - 'null'
        modifier_id:
          type:
          - string
          - 'null'
        owner_id:
          type:
          - string
          - 'null'
    AssignTagRequest:
      type: object
      properties:
        metadata:
          description: Metadata objects.
          type: array
          items:
            $ref: '#/components/schemas/TagMetadataTypeInput'
        tag_identifiers:
          description: GUID or name of the tag.
          type: array
          items:
            type: string
      required:
      - metadata
      - tag_identifiers
    ErrorResponse:
      type: object
      properties:
        error:
          type:
          - object
          - 'null'
    UnassignTagRequest:
      type: object
      properties:
        metadata:
          description: Metadata objects.
          type: array
          items:
            $ref: '#/components/schemas/TagMetadataTypeInput'
        tag_identifiers:
          description: GUID or name of the tag.
          type: array
          items:
            type: string
      required:
      - metadata
      - tag_identifiers
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
