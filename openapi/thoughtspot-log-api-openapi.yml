openapi: 3.2.0
info:
  title: ThoughtSpot Public REST Log API
  version: '2.0'
servers:
- url: '{base-url}'
  variables:
    base-url:
      default: https://localhost:443
security:
- bearerAuth: []
tags:
- name: Log
paths:
  /api/rest/2.0/logs/fetch:
    post:
      operationId: fetchLogs
      description: 'Version: 9.0.0.cl or later


        Fetches security audit logs.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the Admin Control privileges are required.


        #### Usage guidelines


        By default, the API retrieves logs for the last 24 hours. You can set a custom duration in EPOCH time. Make sure the log duration specified in your API request doesn’t exceed 24 hours. If you must fetch logs for a longer time range, modify the duration and make multiple sequential API requests.


        Upon successful execution, the API returns logs with the following information:

        * timestamp of the event

        * event ID

        * event type

        * name and GUID of the user

        * IP address of ThoughtSpot instance


        For more information see Audit logs Documentation.


        #### Endpoint URL'
      tags:
      - Log
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchLogsRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Log fetched successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Fetch logs
      x-summary-source: derived
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type:
          - object
          - 'null'
    LogResponse:
      type: object
      required:
      - date
      - log
      properties:
        date:
          type: string
          description: Date timestamp of the log entry
        log:
          type: string
          description: Log data
    FetchLogsRequest:
      type: object
      properties:
        log_type:
          description: Name of the log type
          type: string
          enum:
          - SECURITY_AUDIT
        start_epoch_time_in_millis:
          description: Start time in EPOCH format
          type: number
          format: float
        end_epoch_time_in_millis:
          description: End time in EPOCH format
          type: number
          format: float
        get_all_logs:
          description: Fetch all the logs. This is available from 9.10.5.cl
          default: true
          type:
          - boolean
          - 'null'
      required:
      - log_type
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
