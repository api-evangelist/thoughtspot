        base_url:
          description: Base url of the cluster.
          type: string
      required:
      - user_identifier
      - base_url
    FavoriteMetadataInput:
      type: object
      properties:
        identifier:
          type:
          - string
          - 'null'
          description: Unique ID or name of the metadata object.
        type:
          type:
          - string
          - 'null'
          enum:
          - LIVEBOARD
          - ANSWER
          description: "  Type of metadata object.\n  \n\nRequired if the name of the object is set as the identifier. This attribute is optional when the object GUID is specified as the identifier."
    ChangeUserPasswordRequest:
      type: object
      properties:
        current_password:
          description: Current password of the user.
          type: string
        new_password:
          description: New password for the user.
          type: string
        user_identifier:
          description: GUID or name of the user.
          type: string
      required:
      - current_password
      - new_password
      - user_identifier
    FavoriteMetadataItem:
      type: object
      required:
      - id
      - name
      - type
      properties:
        id:
          type: string
          description: Unique ID of the metadata object.
        name:
          type: string
          description: name of the metadata object.
        type:
          type: string
          enum:
          - LIVEBOARD
          - ANSWER
          - LOGICAL_TABLE
          - LOGICAL_COLUMN
          - CONNECTION
          - TAG
          - USER
          - USER_GROUP
          - LOGICAL_RELATIONSHIP
          description: "  Type of metadata object.\n  \n\nRequired if the name of the object is set as the identifier. This attribute is optional when the object GUID is specified as the identifier."
    ImportUsersResponse:
      type: object
