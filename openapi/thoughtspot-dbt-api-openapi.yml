openapi: 3.2.0
info:
  title: ThoughtSpot Public REST DBT API
  version: '2.0'
servers:
- url: '{base-url}'
  variables:
    base-url:
      default: https://localhost:443
security:
- bearerAuth: []
tags:
- name: DBT
paths:
  /api/rest/2.0/dbt/dbt-connection:
    post:
      operationId: dbtConnection
      description: 'Version: 9.9.0.cl or later


        Creates a DBT connection object in ThoughtSpot.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege or `DATAMANAGEMENT` (**Can manage data**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the following Data control privileges may be required:


        - `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)

        - `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)

        - `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)


        #### About create DBT connection

        DBT connection in ThoughtSpot is used by the user to define DBT credentials for cloud . The API needs embrace connection, embrace database name, DBT url, import type, DBT account identifier, DBT project identifier, DBT access token and environment details (or) embrace connection, embrace database name, import type, file_content to create a connection object. To know more about DBT, see ThoughtSpot Product Documentation.


        #### Endpoint URL'
      tags:
      - DBT
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                connection_name:
                  description: Name of the connection.
                  type: string
                database_name:
                  description: Name of the Database.
                  type: string
                import_type:
                  description: Mention type of Import
                  default: DBT_CLOUD
                  type: string
                  enum:
                  - DBT_CLOUD
                  - ZIP_FILE
                access_token:
                  description: Access token is mandatory when Import_Type is DBT_CLOUD.
                  type: string
                dbt_url:
                  description: DBT URL is mandatory when Import_Type is DBT_CLOUD.
                  type: string
                account_id:
                  description: Account ID is mandatory when Import_Type is DBT_CLOUD
                  type: string
                project_id:
                  description: Project ID is mandatory when Import_Type is DBT_CLOUD
                  type: string
                dbt_env_id:
                  description: DBT Environment ID"
                  type: string
                project_name:
                  description: Name of the project
                  type: string
                file_content:
                  description: Upload DBT Manifest and Catalog artifact files as a ZIP file. This field is Mandatory when Import Type is 'ZIP_FILE'
                  type: string
                  format: binary
              required:
              - connection_name
              - database_name
        required: true
      parameters: []
      responses:
        '200':
          description: Succesfully created DBT Connection.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Dbt connection
      x-summary-source: derived
  /api/rest/2.0/dbt/generate-sync-tml:
    post:
      operationId: dbtGenerateSyncTml
      description: 'Version: 9.9.0.cl or later


        Resynchronize the existing list of models, tables, worksheet tml’s and import them to Thoughtspot based on the DBT connection object.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege or `DATAMANAGEMENT` (**Can manage data**) privilege, along with an existing DBT connection.

        If Role-Based Access Control (RBAC) is enabled on your instance, the following data control privileges may be required:


        - `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)

        - `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)

        - `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)


        #### Endpoint URL'
      tags:
      - DBT
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                dbt_connection_identifier:
                  description: Unique ID of the DBT connection.
                  type: string
                file_content:
                  description: Upload DBT Manifest and Catalog artifact files as a ZIP file. This field is mandatory if the connection was created with import_type ‘ZIP_FILE’
                  type: string
                  format: binary
                include_semantic_report:
                  description: 'If true, includes a `semantic_report` per model showing which components were imported or skipped. Each component includes its name, type (such as dimension, measure, or metric), import status, SQL expression, and the corresponding generated ThoughtSpot formula. Note: supported only for Snowflake and Databricks connections.'
                  type:
                  - boolean
                  - 'null'
              required:
              - dbt_connection_identifier
        required: true
      parameters: []
      responses:
        '200':
          description: Sync Table and Worksheet TML's are successfully generated.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Dbt generate sync tml
      x-summary-source: derived
  /api/rest/2.0/dbt/generate-tml:
    post:
      operationId: dbtGenerateTml
      description: 'Version: 9.9.0.cl or later


        Generate required table and worksheet and import them.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege or `DATAMANAGEMENT` (**Can manage data**) privilege, along with an existing DBT connection.

        If Role-Based Access Control (RBAC) is enabled on your instance, the following data control privileges may be required:


        - `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)

        - `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)

        - `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)


        #### About generate TML

        Models and Worksheets to be imported can be selected by the user as part of the API.


        #### Endpoint URL'
      tags:
      - DBT
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                dbt_connection_identifier:
                  description: Unique ID of the DBT connection.
                  type: string
                model_tables:
                  description: 'List of Models and their respective Tables

                    Example: ''[{"model_name": "model_name", "model_path": "model_path", "tables": ["table_name"]}]'''
                  type: string
                  format: json
                import_worksheets:
                  description: Mention the worksheet tmls to import
                  type: string
                  enum:
                  - ALL
                  - NONE
                  - SELECTED
                worksheets:
                  description: 'List of worksheets is mandatory when import_Worksheets is type SELECTED

                    Example: ["worksheet_name"]'
                  type: string
                  format: json
                file_content:
                  description: Upload DBT Manifest and Catalog artifact files as a ZIP file. This field is mandatory if the connection was created with import_type ‘ZIP_FILE’
                  type: string
                  format: binary
                include_semantic_report:
                  description: 'If true, includes a `semantic_report` per model showing which components were imported or skipped. Each component includes its name, type (such as dimension, measure, or metric), import status, SQL expression, and the corresponding generated ThoughtSpot formula. Note: supported only for Snowflake and Databricks connections.'
                  type:
                  - boolean
                  - 'null'
              required:
              - dbt_connection_identifier
              - model_tables
              - import_worksheets
        required: true
      parameters: []
      responses:
        '200':
          description: Required Table and Worksheet TML's are successfully generated.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Dbt generate tml
      x-summary-source: derived
  /api/rest/2.0/dbt/search:
    post:
      operationId: dbtSearch
      description: 'Version: 9.9.0.cl or later


        Gets a list of DBT connection objects by user and organization, available on the ThoughtSpot system.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege or `DATAMANAGEMENT` (**Can manage data**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the following Data control privileges may be required:


        - `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)

        - `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)

        - `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)


        #### About search DBT connection

        To get details of a specific DBT connection identifier, database connection identifier, database connection name, database name, project name, project identifier, environment identifier , import type and author.


        #### Endpoint URL'
      tags:
      - DBT
      parameters: []
      responses:
        '200':
          description: Retrieved list of DBT connections successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DbtSearchResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Dbt search
      x-summary-source: derived
  /api/rest/2.0/dbt/{dbt_connection_identifier}/delete:
    post:
      operationId: deleteDbtConnection
      description: 'Version: 9.9.0.cl or later


        Removes the specified DBT connection object from the ThoughtSpot system.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) or `DATAMANAGEMENT` (**Can manage data ThoughtSpot**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the following Data control privileges may be required:


        - `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)

        - `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)

        - `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)


        #### Endpoint URL'
      tags:
      - DBT
      parameters:
      - in: path
        name: dbt_connection_identifier
        required: true
        schema:
          type: string
        description: Unique ID of the DBT Connection.
      responses:
        '204':
          description: DBT Connection successfully deleted.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Delete dbt connection
      x-summary-source: derived
  /api/rest/2.0/dbt/update-dbt-connection:
    post:
      operationId: updateDbtConnection
      description: 'Version: 9.9.0.cl or later


        Updates a DBT connection object.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege or `DATAMANAGEMENT` (**Can manage data ThoughtSpot**) privilege, along with an existing DBT connection.

        If Role-Based Access Control (RBAC) is enabled on your instance, the following data control privileges may be required:


        - `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)

        - `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)

        - `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)


        #### About update DBT connection

        You can modify DBT connection object properties such as embrace connection name, embrace database name, import type, account identifier, access token, project identifier and environment (or) embrace connection, embrace database name, import type, file_content settings.


        #### Endpoint URL'
      tags:
      - DBT
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                dbt_connection_identifier:
                  description: Unique ID of the DBT Connection.
                  type: string
                connection_name:
                  description: Name of the connection.
                  type: string
                database_name:
                  description: Name of the Database.
                  type: string
                import_type:
                  description: Mention type of Import
                  default: DBT_CLOUD
                  type: string
                  enum:
                  - DBT_CLOUD
                  - ZIP_FILE
                access_token:
                  description: Access token is mandatory when Import_Type is DBT_CLOUD.
                  type: string
                dbt_url:
                  description: DBT URL is mandatory when Import_Type is DBT_CLOUD.
                  type: string
                account_id:
                  description: Account ID is mandatory when Import_Type is DBT_CLOUD
                  type: string
                project_id:
                  description: Project ID is mandatory when Import_Type is DBT_CLOUD
                  type: string
                dbt_env_id:
                  description: DBT Environment ID"
                  type: string
                project_name:
                  description: Name of the project
                  type: string
                file_content:
                  description: Upload DBT Manifest and Catalog artifact files as a ZIP file. This field is Mandatory when Import Type is 'ZIP_FILE'
                  type: string
                  format: binary
              required:
              - dbt_connection_identifier
        required: true
      parameters: []
      responses:
        '200':
          description: DBT Connection successfully updated.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Update dbt connection
      x-summary-source: derived
components:
  schemas:
    DbtSearchResponse:
      type: object
      properties:
        dbt_connection_identifier:
          type:
          - string
          - 'null'
        project_name:
          type:
          - string
          - 'null'
        connection_id:
          type:
          - string
          - 'null'
        connection_name:
          type:
          - string
          - 'null'
        cdw_database:
          type:
          - string
          - 'null'
        import_type:
          type:
          - string
          - 'null'
        author_name:
          type:
          - string
          - 'null'
    ErrorResponse:
      type: object
      properties:
        error:
          type:
          - object
          - 'null'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
