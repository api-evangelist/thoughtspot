  /api/rest/2.0/vcs/git/branches/validate:
    post:
      operationId: validateMerge
      description: "\n <span class=\"since-beta-tag\">Version: 9.2.0.cl or later</span>\n\nValidates the content of your source branch against the objects in your destination environment.\n\nBefore merging content from your source branch to the destination branch, run this API operation from your destination environment and ensure that the changes from the source branch function in the destination environment.\n\nRequires `DATAMANAGEMENT` (**Can manage data**) privilege.\n\nIf [Role-Based Access Control (RBAC)](https://developers.thoughtspot.com/docs/rbac) is enabled on your instance on your instance, the `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**) privilege and edit access to the metadata objects.\n\n\n\n\n#### Endpoint URL\n"
      tags:
      - 9.2.0.cl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateMergeRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: validation done successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeployResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CommitBranchRequest:
      type: object
      properties:
        metadata:
          description: Metadata objects.
          type: array
          items:
            $ref: '#/components/schemas/MetadataObject'
        delete_aware:
          description: Delete the tml files from version control repo if it does not exist in the ThoughSpot instance
          default: true
          type: boolean
          nullable: true
        branch_name:
          description: "   Name of the remote branch where object should be pushed\n   \n\nNote: If no branch_name is specified, then the commit_branch_name will be considered."
          type: string
        comment:
          description: Comment to be added to the commit
          type: string
      required:
      - metadata
      - comment
    RepoConfigObject:
      type: object
      properties:
        repository_url:
          type: string
          description: Remote repository URL configured
          nullable: true
        username:
          type: string
          description: Username to authenticate connection to the version control system
          nullable: true
        commit_branch_name:
          type: string
          description: Name of the remote branch where objects from this Thoughtspot instance will be versioned.
          nullable: true
        branches:
          type: array
          items:
            type: string
          description: Branches that have been pulled in local repository
          nullable: true
        enable_guid_mapping:
          type: boolean
          description: Maintain mapping of guid for the deployment to an instance
          nullable: true
        configuration_branch_name:
          type: string
          description: Name of the branch where the configuration files related to operations between Thoughtspot and version control repo should be maintained.
          nullable: true
        org:
          $ref: '#/components/schemas/Org'
          description: Details of the Org
          nullable: true
    SortOptionInput:
      type: object
      properties:
        field_name:
          type: string
          enum:
          - NAME
          - DISPLAY_NAME
          - AUTHOR
          - CREATED
          - MODIFIED
          - LAST_ACCESSED
          - SYNCED
          - VIEWS
          - USER_STATE
          - ROW_COUNT
          description: Name of the field to apply the sort on.
          nullable: true
        order:
          type: string
          enum:
          - ASC
          - DESC
          description: 'Sort order : ASC(Ascending) or DESC(Descending).'
          nullable: true
    SearchConfigRequest:
      type: object
      properties:
        org_identifiers:
          description: "   Applicable when Orgs is enabled in the cluster\n   \n\nList of Org ids or name. Provide value -1 for cluster level. Example : [\"OrgID1-or-Name1\", \"OrgID2-or-Name2\"] \n\n\n   \n\nNote: If no value is specified, then the configurations will be returned for all orgs the user has access to  <br/>  <span class=\"since-beta-tag\">Version: 9.5.0.cl or later</span>"
          type: array
          items:
            type: string
    DeleteConfigRequest:
      type: object
      properties:
        cluster_level:
          description: "   Applicable when Orgs is enabled in the cluster\n   \n\nIndicator to consider cluster level or org level config. Set it to false to delete configuration from current org. If set to true, then the configuration at cluster level and orgs that inherited the configuration from cluster level will be deleted.  <br/>  <span class=\"since-beta-tag\">Version: 9.5.0.cl or later</span>"
          type: boolean
          nullable: true
    UpdateConfigRequest:
      type: object
      properties:
        username:
          description: Username to authenticate connection to version control system
          type: string
        access_token:
          description: Access token corresponding to the user to authenticate connection to version control system
          type: string
        org_identifier:
          description: "   Applicable when Orgs is enabled in the cluster\n   \n\nList of Org ids or name. Provide value -1 for cluster level. Example : [\"OrgID1-or-Name1\", \"OrgID2-or-Name2\"] \n\n\n   \n\nNote: If no value is specified, then the configurations will be returned for all orgs the user has access to  <br/>  <span class=\"since-beta-tag\">Version: 9.5.0.cl or later</span>"
          type: string
        branch_names:
          description: List the remote branches to configure. Example:[development, production]
          type: array
          items:
            type: string
        commit_branch_name:
          description: 'Name of the remote branch where objects from this Thoughtspot instance will be versioned. <br/>  <span class="since-beta-tag">Version: 9.7.0.cl or later</span>'
          type: string
        enable_guid_mapping:
          description: 'Maintain mapping of guid for the deployment to an instance <br/>  <span class="since-beta-tag">Version: 9.4.0.cl or later</span>'
          type: boolean
          nullable: true
        configuration_branch_name:
          description: 'Name of the branch where the configuration files related to operations between Thoughtspot and version control repo should be maintained. <br/>  <span class="since-beta-tag">Version: 9.7.0.cl or later</span>'
          type: string
    RevertCommitRequest:
      type: object
      properties:
        metadata:
          description: Metadata objects.
          type: array
          items:
            $ref: '#/components/schemas/MetadataObject'
        branch_name:
          description: "   Name of the branch where the reverted version should be committed\n   \n\nNote: If no branch_name is specified, then the commit_branch_name will be considered."
          type: string
        revert_policy:
          description: 'Policy to apply when reverting a commit. Valid values: [ALL_OR_NONE, PARTIAL]'
          default: ALL_OR_NONE
          type: string
          enum:
          - ALL_OR_NONE
          - PARTIAL
    ConnectionInput:
      type: object
      properties:
        identifier:
          type: string
          description: Unique ID or name of the connection.
          nullable: true
        name_pattern:
          type: string
          description: A pattern to match case-insensitive name of the connection object. User `%` for a wildcard match.
          nullable: true
        data_warehouse_objects:
          type: array
          items:
            $ref: '#/components/schemas/DataWarehouseObjectInput'
          description: Filter options for databases, schemas, tables and columns.
          nullable: true
    ValidateMergeRequest:
      type: object
      properties:
        source_branch_name:
          description: Name of the branch from which changes need to be picked for validation
          type: string
        target_branch_name:
          description: Name of the branch where files will be merged
          type: string
      required:
      - source_branch_name
      - target_branch_name
    CreateConnectionResponse:
      type: object
      required:
      - id
      - name
      - data_warehouse_type
      properties:
        id:
          type: string
          description: ID of the connection created.
        name:
          type: string
          description: Name of the connection.
        data_warehouse_type:
          type: string
          enum:
          - SNOWFLAKE
          - AMAZON_REDSHIFT
          - GOOGLE_BIGQUERY
          - AZURE_SYNAPSE
          - TERADATA
          - SAP_HANA
          - STARBURST
          - ORACLE_ADW
          - DATABRICKS
          - DENODO
          - DREMIO
          - TRINO
          - PRESTO
          - POSTGRES
          - SQLSERVER
          - MYSQL
          - GENERIC_JDBC
          - AMAZON_RDS_POSTGRESQL
          - AMAZON_AURORA_POSTGRESQL
          - AMAZON_RDS_MYSQL
          - AMAZON_AURORA_MYSQL
          - LOOKER
          - AMAZON_ATHENA
          - SINGLESTORE
          - GCP_SQLSERVER
          - GCP_ALLOYDB_POSTGRESQL
          - GCP_POSTGRESQL
          - GCP_MYSQL
          - MODE
          - GOOGLE_SHEETS
          - FALCON
          - FALCON_ONPREM
          - CLICKHOUSE
          - IOMETE
          description: Type of data warehouse.
        details:
          type: object
          description: Details of the connection.
          nullable: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          nullable: true
    Database:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the database.
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/SchemaObject'
          description: Schemas of the database.
          nullable: true
        auto_created:
          type: boolean
          description: Determines if the object is auto created.
          nullable: true
    SystemOverrideInfo:
      type: object
      properties:
        config_override_info:
          type: object
          nullable: true
    DeployResponse:
      type: object
      properties:
        file_name:
          type: string
          description: Name of the file deployed
          nullable: true
        metadata_name:
          type: string
          description: Name of the metadata object
          nullable: true
        metadata_type:
          type: string
          description: Type of the metadata object
          nullable: true
        status_code:
          type: string
          description: Indicates the status of deployment for the file
          nullable: true
        status_message:
          type: string
          description: Any error or warning with the deployment
          nullable: true
    SearchCommitsRequest:
      type: object
      properties:
        metadata_identifier:
          description: Unique ID or name of the metadata.
          type: string
        metadata_type:
          description: Type of metadata.
          type: string
          enum:
          - LIVEBOARD
          - ANSWER
          - LOGICAL_TABLE
          - CUSTOM_ACTION
        branch_name:
          description: "   Name of the branch from which commit history needs to be displayed.\n   \n\nNote: If no branch_name is specified, then commits will be returned for the default branch for this configuration."
          type: string
        record_offset:
          description: "    Record offset point in the commit history to display the response.\n    \n\nNote: If no record offset is specified, the beginning of the record will be considered."
          type: integer
          format: int32
        record_size:
          description: "    Number of history records from record offset point to be displayed in the response.\n    \n\nNote: If no record size is specified, then all the records will be considered."
          type: integer
          format: int32
      required:
      - metadata_identifier
    CommitResponse:
      type: object
      properties:
        committer:
          $ref: '#/components/schemas/CommiterType'
          description: Repository user using which changes were committed
          nullable: true
        author:
          $ref: '#/components/schemas/AuthorType'
          description: Thoughtspot user who commits the changes
          nullable: true
        comment:
          type: string
          description: Comments associated with the commit
          nullable: true
        commit_time:
          type: string
          description: Time at which the changes were committed.
          nullable: true
        commit_id:
          type: string
          description: SHA id associated with the commit
          nullable: true
        branch:
          type: string
          description: Branch where changes were committed
          nullable: true
        committed_files:
          type: array
          items:
            $ref: '#/components/schemas/CommitFileType'
          description: Files that were pushed as part of this commit
          nullable: true
    RevertedMetadata:
      type: object
      required:
      - file_name
      - metadata_name
      - metadata_type
      - status_code
      - status_message
      properties:
        file_name:
          type: string
          description: Name of the file deployed
        metadata_name:
          type: string
          description: Name of the metadata object
        metadata_type:
          type: string
          description: Type of the metadata object
        status_code:
          type: string
          description: Indicates the status of deployment for the file
        status_message:
          type: string
          description: Any error or warning with the deployment
    Org:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
          format: int32
          description: The ID of the object.
        name:
          type: string
          description: Name of the object.
      description: The current Org context of the user.
    CommitHistoryResponse:
      type: object
      required:
      - committer
      - author
      - comment
      - commit_time
      - commit_id
      - branch
      properties:
        committer:
          $ref: '#/components/schemas/CommiterType'
          description: Repository user using which changes were committed
        author:
          $ref: '#/components/schemas/AuthorType'
          description: Thoughtspot user who commits the changes
        comment:
          type: string
          description: Comments associated with the commit
        commit_time:
          type: string
          description: Time at which the changes were committed.
        commit_id:
          type: string
          description: SHA id associated with the commit
        branch:
          type: string
          description: Branch where changes were committed
    MetadataObject:
      type: object
      required:
      - identifier
      properties:
        identifier:
          type: string
          description: Unique ID or name of the metadata
        type:
          type: string
          enum:
          - LIVEBOARD
          - ANSWER
          - LOGICAL_TABLE
          - CUSTOM_ACTION
          description: "  Type of metadata.\n  \n\nRequired if the name of the object is set as the identifier. This attribute is optional when the object GUID is specified as the identifier."
          nullable: true
    DeployCommitRequest:
      type: object
      properties:
        commit_id:
          description: "   Commit_id against which the files should be picked to deploy.\n   \n\nNote: If no commit_id is specified, then the head of the branch is considered."
          type: string
        branch_name:
          description: Name of the remote branch where changes should be picked
          type: string
        deploy_type:
          description: Indicates if all files or only modified file at specified commit point should be considered
          default: DELTA
          type: string
          enum:
          - FULL
          - DELTA
        deploy_policy:
          description: Define the policy to follow while importing TML in the ThoughtSpot environment. Use “ALL_OR_NONE” to cancel the deployment of all ThoughtSpot objects if at least one of them fails to import. Use “Partial” to import ThoughtSpot objects that validate successfully even if other objects in the same deploy operations fail to import.
          default: ALL_OR_NONE
          type: string
          enum:
          - ALL_OR_NONE
          - PARTIAL
          - VALIDATE_ONLY
      required:
      - branch_name
    UpdateConnectionRequest:
      type: object
      properties:
        connection_identifier:
          description: Unique ID or name of the connection.
          type: string
        name:
          description: Updated name of the connection.
          type: string
        description:
          description: Updated description of the connection.
          type: string
        data_warehouse_config:
          description: Configuration of the data warehouse in JSON.
          type: object
        validate:
          description: Indicates whether to validate the connection details.
          default: true
          type: boolean
          nullable: true
      required:
      - connection_identifier
    CommitFileType:
      type: object
      required:
      - file_name
      - status_code
      properties:
        file_name:
          type: string
          description: Name of the file deployed
        status_code:
          type: string
          description: Indicates the status of deployment for the file
        status_message:
          type: string
          description: Any error or warning with the deployment
          nullable: true
    DataWarehouseObjectInput:
      type: object
      properties:
        database:
          type: string
          description: Name of the database.
          nullable: true
        schema:
          type: string
          description: Name of the schema within the database.
          nullable: true
        table:
          type: string
          description: Name of the table within the schema.
          nullable: true
        column:
          type: string
          description: Name of the column within the table.
          nullable: true
    SchemaObject:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the schema.
        tables:
          type: array
          items:
            $ref: '#/components/schemas/Table'
          description: Tables in the schema.
          nullable: true
    SearchConnectionResponse:
      type: object
      required:
      - id
      - name
      - data_warehouse_type
      properties:
        id:
          type: string
          description: Unique ID of the connection.
        name:
          type: string
          description: Name of the connection.
        obj_id:
          type: string
          description: 'Custom object ID (obj_id) of the connection, if one is set. <br/>  <span class="since-beta-tag">Version: 26.9.0.cl or later</span>'
          nullable: true
        description:
          type: string
          description: Description of the connection.
          nullable: true
        data_warehouse_type:
          type: string
          enum:
          - SNOWFLAKE
          - AMAZON_REDSHIFT
          - GOOGLE_BIGQUERY
          - AZURE_SYNAPSE
          - TERADATA
          - SAP_HANA
          - STARBURST
          - ORACLE_ADW
          - DATABRICKS
          - DENODO
          - DREMIO
          - TRINO
          - PRESTO
          - POSTGRES
          - SQLSERVER
          - MYSQL
          - GENERIC_JDBC
          - AMAZON_RDS_POSTGRESQL
          - AMAZON_AURORA_POSTGRESQL
          - AMAZON_RDS_MYSQL
          - AMAZON_AURORA_MYSQL
          - LOOKER
          - AMAZON_ATHENA
          - SINGLESTORE
          - GCP_SQLSERVER
          - GCP_ALLOYDB_POSTGRESQL
          - GCP_POSTGRESQL
          - GCP_MYSQL
          - MODE
          - GOOGLE_SHEETS
          - FALCON
          - FALCON_ONPREM
          - CLICKHOUSE
          - IOMETE
          description: Type of data warehouse.
        data_warehouse_objects:
          $ref: '#/components/schemas/DataWarehouseObjects'
          description: List of Data warehouse objects
          nullable: true
        details:
          type: object
          description: Details of the connection.
          nullable: true
    UpdateSystemConfigRequest:
      type: object
      properties:
        configuration:
          description: Configuration JSON with the key-value pair of configuration attributes to be updated.
          type: object
      required:
      - configuration
    Column:
      type: object
      required:
      - name
      - data_type
      properties:
        name:
          type: string
          description: Name of the column
        data_type:
          type: string
          description: Data type of the column
        is_aggregate:
          type: string
          description: Determines if the column schema is an aggregate
          nullable: true
        can_import:
          type: boolean
          description: Determines if the column schema can be imported
          nullable: true
        selected:
          type: boolean
          description: Determines if the table is selected
          nullable: true
        is_linked_active:
          type: boolean
          description: Determines if the table is linked
          nullable: true
    RevertResponse:
      type: object
      properties:
        committer:
          $ref: '#/components/schemas/CommiterType'
          description: Repository user using which changes were committed
          nullable: true
        author:
          $ref: '#/components/schemas/AuthorType'
          description: Thoughtspot user who commits the changes
          nullable: true
        comment:
          type: string
          description: Comments associated with the commit
          nullable: true
        commit_time:
          type: string
          description: Time at which the changes were committed.
          nullable: true
        commit_id:
          type: string
          description: SHA id associated with the commit
          nullable: true
        branch:
          type: string
          description: Branch where changes were committed
          nullable: true
        committed_files:
          type: array
          items:
            $ref: '#/components/schemas/CommitFileType'
          description: Files that were pushed as part of this commit
          nullable: true
        reverted_metadata:
          type: array
          items:
            $ref: '#/components/schemas/RevertedMetadata'
          description: Metadata of reverted file of this commit
          nullable: true
    CreateConnectionRequest:
      type: object
      properties:
        name:
          description: Unique name for the connection.
          type: string
        description:
          description: Description of the connection.
          type: string
        data_warehouse_type:
          description: Type of the data warehouse.
          type: string
          enum:
          - SNOWFLAKE
          - AMAZON_REDSHIFT
          - GOOGLE_BIGQUERY
          - AZURE_SYNAPSE
          - TERADATA
          - SAP_HANA
          - STARBURST
          - ORACLE_ADW
          - DATABRICKS
          - DENODO
          - DREMIO
          - TRINO
          - PRESTO
          - POSTGRES
          - SQLSERVER
          - MYSQL
          - GENERIC_JDBC
          - AMAZON_RDS_POSTGRESQL
          - AMAZON_AURORA_POSTGRESQL
          - AMAZON_RDS_MYSQL
          - AMAZON_AURORA_MYSQL
          - LOOKER
          - AMAZON_ATHENA
          - SINGLESTORE
          - GCP_SQLSERVER
          - GCP_ALLOYDB_POSTGRESQL
          - GCP_POSTGRESQL
          - GCP_MYSQL
          - MODE
          - GOOGLE_SHEETS
          - FALCON
          - FALCON_ONPREM
          - CLICKHOUSE
          - IOMETE
        data_warehouse_config:
          description: Connection configuration attributes in JSON format. To create a connection with tables, include table attributes. See the documentation above for sample JSON.
          type: object
        validate:
          description: Validates the connection metadata if tables are included. If you are creating a connection without tables, specify `false`.
          default: true
          type: boolean
          nullable: true
      required:
      - name
      - data_warehouse_type
      - data_warehouse_config
    DataWarehouseObjects:
      type: object
      required:
      - databases
      properties:
        databases:
          type: array
          items:
            $ref: '#/components/schemas/Database'
          description: Databases of the connection.
    SearchConnectionRequest:
      type: object
      properties:
        connections:
          description: List of connections and name pattern
          type: array
          items:
            $ref: '#/components/schemas/ConnectionInput'
        data_warehouse_types:
          description: Array of types of data warehouse defined for the connection.
          type: array
          items:
            type: string
            enum:
            - SNOWFLAKE
            - AMAZON_REDSHIFT
            - GOOGLE_BIGQUERY
            - AZURE_SYNAPSE
            - TERADATA
            - SAP_HANA
            - STARBURST
            - ORACLE_ADW
            - DATABRICKS
            - DENODO
            - DREMIO
            - TRINO
            - PRESTO
            - POSTGRES
            - SQLSERVER
            - MYSQL
            - GENERIC_JDBC
            - AMAZON_RDS_POSTGRESQL
            - AMAZON_AURORA_POSTGRESQL
            - AMAZON_RDS_MYSQL
            - AMAZON_AURORA_MYSQL
            - LOOKER
            - AMAZON_ATHENA
            - SINGLESTORE
            - GCP_SQLSERVER
            - GCP_ALLOYDB_POSTGRESQL
            - GCP_POSTGRESQL
            - GCP_MYSQL
            - MODE
            - GOOGLE_SHEETS
            - FALCON
            - FALCON_ONPREM
            - CLICKHOUSE
            - IOMETE
        record_offset:
          description: The starting record number from where the records should be included.
          default: 0
          type: integer
          format: int32
        record_size:
          description: The number of records that should be included.
          default: 10
          type: integer
          format: int32
        tag_identifiers:
          description: Unique ID or name of tags.
          type: array
          items:
            type: string
        data_warehouse_object_type:
          description: Data warehouse object type.
          type: string
          enum:
          - DATABASE
          - SCHEMA
          - TABLE
          - COLUMN
        sort_options:
          description: Sort options.
          allOf:
          - $ref: '#/components/schemas/SortOptionInput'
        include_details:
          description: Indicates whether to include complete details of the connection objects.
          type: boolean
          nullable: true
        configuration:
          description: 'Configuration values. If empty we are fetching configuration from datasource based on given connection id. If required you can provide config details to fetch specific details. Example input: {}, {"warehouse":"SMALL_WH","database":"DEVELOPMENT"}. This is only applicable when data_warehouse_object_type is selected.'
          type: object
        authentication_type:
          description: List of authentication types to fetch data_ware_house_objects from external Data warehouse. This is only applicable when data_warehouse_object_type is selected.
          default: SERVICE_ACCOUNT
          type: string
          enum:
          - SERVICE_ACCOUNT
          - OAUTH
          - IAM
          - EXTOAUTH
          - OAUTH_WITH_SERVICE_PRINCIPAL
          - PERSONAL_ACCESS_TOKEN
          - KEY_PAIR
          - OAUTH_WITH_PKCE
          - EXTOAUTH_WITH_PKCE
          - OAUTH_WITH_PEZ
          - OAUTH_CLIENT_CREDENTIALS
          - OAUTH_CLIENT_CREDENTIALS_WITH_X509
        show_resolved_parameters:
          description: '<div><span class="since-beta-tag">Version: 10.9.0.cl or later</span></div>


            Indicates whether to show resolved parameterised values.'
          default: false
          type: boolean
          nullable: true
    Table:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the table.
        columns:
          type: array
          items:
            $ref: '#/components/schemas/Column'
          description: Columns of the table.
          nullable: true
        type:
          type: string
          description: Type of table. Either view or table
          nullable: true
        description:
          type: string
          description: Description of the table
          nullable: true
        selected:
          type: boolean
          description: Determines if the table is selected
          nullable: true
        linked:
          type: boolean
          description: Determines if the table is linked
          nullable: true
        relationships:
          type: array
          items:
            type: object
          description: List of relationships for the table
          nullable: true
    CommiterType:
      type: object
      properties:
        email:
          type: string
          description: Email id of the committer
          nullable: true
        username:
          type: string
          description: Username of the committer
          nullable: true
    AuthorType:
      type: object
      properties:
        email:
          type: string
          description: Email id of the committer
          nullable: true
        username:
          type: string
          description: Username of the committer
          nullable: true
    DeleteConnectionRequest:
      type: object
      properties:
        connection_identifier:
          description: Unique ID or name of the connection.
          type: string
      required:
      - connection_identifier
    CreateConfigRequest:
      type: object
      properties:
        repository_url:
          description: URL for connecting to remote repository
          type: string
        username:
          description: Username to authenticate connection to remote repository
          type: string
        access_token:
          description: Access token corresponding to the user to authenticate connection to remote repository
          type: string
        org_identifier:
          description: "   Applicable when Orgs is enabled in the cluster\n   \n\nList of Org ids or name. Provide value -1 for cluster level. Example : [\"OrgID1-or-Name1\", \"OrgID2-or-Name2\"] \n\n\n   \n\nNote: If no value is specified, then the configurations will be returned for all orgs the user has access to  <br/>  <span class=\"since-beta-tag\">Version: 9.5.0.cl or later</span>"
          type: string
        branch_names:
          description: List the remote branches to configure. Example:[development, production]
          type: array
          items:
            type: string
        commit_branch_name:
          description: 'Name of the remote branch where objects from this Thoughtspot instance will be versioned. <br/>  <span class="since-beta-tag">Version: 9.7.0.cl or later</span>'
          type: string
        enable_guid_mapping:
          description: 'Maintain mapping of guid for the deployment to an instance <br/>  <span class="since-beta-tag">Version: 9.4.0.cl or later</span>'
          default: true
          type: boolean
          nullable: true
        configuration_branch_name:
          description: "   Name of the branch where the configuration files related to operations between Thoughtspot and version control repo should be maintained.\n   \n\nNote: If no branch name is specified, then by default, ts_config_files branch is considered. Ensure this branch exists before configuration. <br/>  <span class=\"since-beta-tag\">Version: 9.7.0.cl or later</span>"
          type: string
      required:
      - repository_url
      - username
      - access_token
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
