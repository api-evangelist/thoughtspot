      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteWebhookConfigurationsRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Webhook configurations deleted successfully
