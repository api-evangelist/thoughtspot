openapi: 3.2.0
info:
  title: ThoughtSpot Public REST Orgs API
  version: '2.0'
servers:
- url: '{base-url}'
  variables:
    base-url:
      default: https://localhost:443
security:
- bearerAuth: []
tags:
- name: Orgs
paths:
  /api/rest/2.0/orgs/create:
    post:
      operationId: createOrg
      description: 'Version: 9.0.0.cl or later


        Creates an Org object.


        To use this API, the Orgs feature must be enabled in your cluster.


        Requires cluster administration (**Can administer Org**) privileges.

        If Role-Based Access Control (RBAC) is enabled on your instance, the `ORG_ADMINISTRATION` (**Can manage Orgs**) privilege is required.


        #### Endpoint URL'
      tags:
      - Orgs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Organization successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgResponse'
              examples:
                example_1:
                  value:
                    id: 1980035173
                    name: test_org
                    status: ACTIVE
                    description: test_org
                    visibility: SHOW
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Create org
      x-summary-source: derived
  /api/rest/2.0/orgs/{org_identifier}/delete:
    post:
      operationId: deleteOrg
      description: 'Version: 9.0.0.cl or later


        Deletes an Org object from the ThoughtSpot system.


        Requires cluster administration (**Can administer Org**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the `ORG_ADMINISTRATION` (**Can manage Orgs**) privilege is required.


        When you delete an Org, all its users and objects created in that Org context are removed. However, if the users in the deleted Org also exists in other Orgs, they are removed only from the deleted Org.


        #### Endpoint URL'
      tags:
      - Orgs
      parameters:
      - in: path
        name: org_identifier
        required: true
        schema:
          type: string
        description: ID or name of the Org
      responses:
        '204':
          description: Organization successfully deleted.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Delete org
      x-summary-source: derived
  /api/rest/2.0/orgs/search:
    post:
      operationId: searchOrgs
      description: 'Version: 9.0.0.cl or later


        Gets a list of Orgs configured on the ThoughtSpot system. To get details of a specific Org, specify the Org ID or name. You can also pass parameters such as status, visibility, and user identifiers to get a specific list of Orgs.


        Requires cluster administration (**Can administer Org**) privileges.

        If Role-Based Access Control (RBAC) is enabled on your instance, the `ORG_ADMINISTRATION` (**Can manage Orgs**) privilege is required.


        #### Endpoint URL'
      tags:
      - Orgs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchOrgsRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Organization search result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgResponse'
              examples:
                example_1:
                  value:
                  - id: 0
                    name: Primary
                    status: ACTIVE
                    description: Primary Org
                    visibility: SHOW
                  - id: 583464508
                    name: test_org
                    status: ACTIVE
                    description: test_org
                    visibility: SHOW
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Search orgs
      x-summary-source: derived
  /api/rest/2.0/orgs/{org_identifier}/update:
    post:
      operationId: updateOrg
      description: 'Version: 9.0.0.cl or later


        Updates an Org object. You can modify Org properties such as name, description, and user associations.


        Requires cluster administration (**Can administer Org**) privileges.

        If Role-Based Access Control (RBAC) is enabled on your instance, the `ORG_ADMINISTRATION` (**Can manage Orgs**) privilege is required.


        #### Endpoint URL'
      tags:
      - Orgs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgRequest'
        required: true
      parameters:
      - in: path
        name: org_identifier
        required: true
        schema:
          type: string
        description: ID or name of the Org
      responses:
        '204':
          description: Organization successfully updated.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Update org
      x-summary-source: derived
components:
  schemas:
    SearchOrgsRequest:
      type: object
      properties:
        org_identifier:
          description: ID or name of the Org
          type: string
        description:
          description: Description of the Org
          type: string
        visibility:
          description: Visibility of the Org
          type: string
          enum:
          - SHOW
          - HIDDEN
        status:
          description: Status of the Org
          type: string
          enum:
          - ACTIVE
          - IN_ACTIVE
        user_identifiers:
          description: GUIDs or names of the users for which you want to retrieve the Orgs data
          type: array
          items:
            type: string
    OrgResponse:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          format: int32
          description: Unique identifier of the Org.
        name:
          type:
          - string
          - 'null'
          description: Name of the Org.
        status:
          type:
          - string
          - 'null'
          enum:
          - ACTIVE
          - IN_ACTIVE
          description: Status of the Org.
        description:
          type:
          - string
          - 'null'
          description: Description of the Org.
        visibility:
          type:
          - string
          - 'null'
          enum:
          - SHOW
          - HIDDEN
          description: Visibility of the Org.
    ErrorResponse:
      type: object
      properties:
        error:
          type:
          - object
          - 'null'
    CreateOrgRequest:
      type: object
      properties:
        name:
          description: Name of the Org.
          type: string
        description:
          description: Description of the Org.
          type: string
      required:
      - name
    UpdateOrgRequest:
      type: object
      properties:
        name:
          description: Name of the Org
          type: string
        description:
          description: Description of the Org
          type: string
        user_identifiers:
          description: Add Users to an Org
          type: array
          items:
            type: string
        group_identifiers:
          description: Add Default Groups to an Org
          type: array
          items:
            type: string
        operation:
          description: Type of update operation. Default operation type is ADD
          default: ADD
          type: string
          enum:
          - ADD
          - REMOVE
          - REPLACE
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
