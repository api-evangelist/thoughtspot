          type: string
        session_identifier:
          description: Unique ID of the answer session.
          type: string
        generation_number:
          description: Generation number of the answer session.
          type: integer
          format: int32
        file_format:
          description: Export file format.
          default: CSV
          type: string
          enum:
          - CSV
          - PDF
          - XLSX
          - PNG
        runtime_filter:
          description: 'JSON string representing runtime filter.

            { col1:region, op1: EQ, val1: northeast }'
          type: object
        runtime_sort:
          description: 'JSON string representing runtime sort.

            { sortCol1: region, asc1 :true, sortCol2 : date }'
          type: object
        runtime_param_override:
          description: JSON object for setting values of parameters in runtime.
          type: object
        regional_settings:
          description: Options for specific region specific overrides to support date/number/string/currency formatting.
          allOf:
          - $ref: '#/components/schemas/RegionalSettingsInput'
        png_options:
          description: 'Options for PNG export. <br/> <span class="since-beta-tag">Beta</span> <span class="since-beta-tag">Version: 26.6.0.cl or later</span>'
          allOf:
          - $ref: '#/components/schemas/AnswerPngOptionsInput'
        personalised_view_identifier:
          description: 'GUID or name of the personalised view of the Answer object. <br/> <span class="since-beta-tag">Beta</span> <span class="since-beta-tag">Version: 26.6.0.cl or later</span>'
          type: string
        type:
          description: 'Type of the answer being exported. <br/> <span class="since-beta-tag">Beta</span> <span class="since-beta-tag">Version: 26.6.0.cl or later</span>'
          default: SAVED
          type: string
          enum:
          - SAVED
          - PINNED
