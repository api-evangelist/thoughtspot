openapi: 3.0.0
info:
  title: ThoughtSpot Public REST 10.1.0.cl 10.9.0.cl API
  version: '2.0'
servers:
- url: '{base-url}'
  variables:
    base-url:
      default: https://localhost:443
security:
- bearerAuth: []
tags:
- name: 10.9.0.cl
paths:
  /api/rest/2.0/metadata/parameterize:
    post:
      operationId: parameterizeMetadata
      description: '

        Parameterize fields in metadata objects. <br/> <span class="since-beta-tag">Beta</span> <span class="since-beta-tag">Version: 10.9.0.cl or later</span>


        **Note:** This API endpoint is deprecated and will be removed from ThoughtSpot in a future release. Use [POST /api/rest/2.0/metadata/parameterize-fields](/api/rest/2.0/metadata/parameterize-fields) instead.


        Allows parameterizing fields in metadata objects in ThoughtSpot.


        Requires appropriate permissions to modify the metadata object.


        The API endpoint allows parameterizing the following types of metadata objects:

        * Logical Tables

        * Connections

        * Connection Configs


        For a Logical Table the field type must be `ATTRIBUTE` and field name can be one of:

        * databaseName

        * schemaName

        * tableName


        For a Connection or Connection Config, the field type is always `CONNECTION_PROPERTY`. In this case, field_name specifies the exact property of the Connection or Connection Config that needs to be parameterized.


        For Connection Config, the only supported field name is:

        * impersonate_user





        #### Endpoint URL

        '
      deprecated: true
      tags:
      - 10.9.0.cl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParameterizeMetadataRequest'
        required: true
      parameters: []
      responses:
        '204':
          description: Parameterize successful.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ParameterizeMetadataRequest:
      type: object
      properties:
        metadata_type:
          description: Type of metadata object to parameterize.
          type: string
          enum:
          - LOGICAL_TABLE
          - CONNECTION
          - CONNECTION_CONFIG
        metadata_identifier:
          description: Unique ID or name of the metadata object to parameterize.
          type: string
        field_type:
          description: Type of field in the metadata to parameterize.
          type: string
          enum:
          - ATTRIBUTE
          - CONNECTION_PROPERTY
        field_name:
          description: Name of the field which needs to be parameterized.
          type: string
        variable_identifier:
          description: Unique ID or name of the variable to use for parameterization
          type: string
      required:
      - metadata_identifier
      - field_type
      - field_name
      - variable_identifier
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
