  /api/rest/2.0/auth/search:
    post:
      operationId: searchAuthSettings
      description: 'Version: 26.6.0.cl or later


        Version: 26.6.0.cl or later


        Returns the authentication configuration for the specified auth type at cluster and org level. Currently supports `TRUSTED_AUTH`.


        #### Required privileges


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) or `CONTROL_TRUSTED_AUTH` (**Can Enable or Disable Trusted Authentication**) privilege. If Role-Based Access Control (RBAC) is enabled, the `CONTROL_TRUSTED_AUTH` privilege is required.


        #### Usage guidelines


        Use `scope` to control which level of settings are returned:

        - `CLUSTER` — Returns cluster-level authentication status and access tokens. Accessible only from the Primary Org.

        - `ORG` — Returns org-level authentication status and access tokens for the current Org. Requires the per-Org authentication feature to be enabled on your instance.

        - If `scope` is omitted, both cluster and org-level settings are returned based on the caller''s org context and feature availability.


        The `access_tokens` array in `cluster_preferences` or `org_preferences` is omitted when no token is configured at that level.


        **Note**: Access tokens returned in the response are sensitive credentials. Treat them with the same care as passwords.


        #### Endpoint URL'
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAuthSettingsRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Authentication settings retrieved successfully.
          content:
