components:
  schemas:
    SearchAuthSettingsResponse:
      type: object
      properties:
        auth_type:
          type:
          - string
          - 'null'
          enum:
          - TRUSTED_AUTH
          description: Type of authentication mechanism returned.
        cluster_preferences:
          $ref: '#/components/schemas/AuthClusterPreferences'
          description: Cluster-level authentication configuration. Present when cluster scope was requested and the caller has ADMINISTRATION or CONTROL_TRUSTED_AUTH privilege.
        org_preferences:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AuthOrgPreference'
          description: Org-level authentication configurations. Present when org scope was requested and per-org auth feature is enabled.
      description: Response for searchAuthSettings. Contains auth type and cluster/org-level preferences.
    OrgInfo:
      type: object
      required:
      - id
      properties:
        id:
          type: integer
          format: int32
          description: Id.
        name:
          type:
          - string
          - 'null'
          description: Name.
    ConfigureAuthSettingsRequest:
      type: object
      properties:
        auth_type:
          description: Type of authentication mechanism to configure. Currently supports TRUSTED_AUTH.
          type: string
          enum:
          - TRUSTED_AUTH
        cluster_preferences:
          description: Cluster-level authentication preferences. Omit to leave the existing cluster setting unchanged.
          allOf:
          - $ref: '#/components/schemas/AuthClusterPreferencesInput'
        org_preferences:
          description: Org-level authentication preferences. Each entry identifies an org and the desired status. Omit to leave existing org settings unchanged.
          type: array
          items:
            $ref: '#/components/schemas/AuthOrgPreferenceInput'
      required:
      - auth_type
    AuthOrgPreference:
      type: object
      properties:
        org:
          $ref: '#/components/schemas/AuthOrgInfo'
          description: Org identifier details.
        auth_status:
          type:
          - string
          - 'null'
          enum:
          - ENABLED
          - DISABLED
          description: Whether authentication is enabled or disabled for this org.
        access_tokens:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AuthSettingsAccessToken'
          description: Org-level access tokens. Absent when no token is configured or the feature flag is off.
      description: Org-level authentication preferences for a single org.
    RevokeTokenRequest:
      type: object
      properties:
        user_identifier:
          type: string
        token:
          type: string
    GetCustomAccessTokenRequest:
      type: object
      properties:
        username:
          description: Username of the ThoughtSpot user. The username is stored in the `name` attribute of the user object.
          type: string
        password:
          description: Password of the user account
          default: ''
          type: string
        secret_key:
          description: The secret key string provided by the ThoughtSpot application server. ThoughtSpot generates a secret key when Trusted authentication is enabled.
          default: ''
          type: string
        validity_time_in_sec:
          description: Token validity duration in seconds
          default: 300
          type: integer
          format: int32
        org_identifier:
          description: ID or name of the Org context to log in to. If the Org ID or name is not specified but a secret key is provided, the user will be logged into the Org associated with the secret key. If neither the Org ID/name nor the secret key is provided, the user will be logged into the Org context from their previous login session.
          type: string
        persist_option:
          description: Indicates whether the specified attributes should be persisted or not. RESET and NONE are not applicable if you are setting variable_values.
          type: string
          enum:
          - REPLACE
          - APPEND
          - NONE
          - RESET
        filter_rules:
          description: Filter rules.
          type: array
          items:
            $ref: '#/components/schemas/FilterRules'
        parameter_values:
          description: 'Allows developers to assign parameter values for existing parameters to a user at login. Note: Using parameter values for row level security use cases will ultimately be deprecated. Developers can still pass data security values via the Custom Access token via the variable_values field and create RLS rules based on custom variables. Please refer to the [ABAC via RLS documentation](https://developers.thoughtspot.com/docs/abac-user-parameters) for more details.'
          type: array
          items:
            $ref: '#/components/schemas/ParameterValues'
        variable_values:
          description: 'List of variable values where `name` references an existing formula variable and `values` is any value from the corresponding column. <br/>  <span class="since-beta-tag">Version: 10.14.0.cl or later</span>'
          type: array
          items:
            $ref: '#/components/schemas/VariableValues'
        objects:
          description: Objects on which the parameter and variable values should be applied to
          type: array
          items:
            $ref: '#/components/schemas/TokenAccessScopeObject'
        email:
          description: (just-in-time (JIT) provisioning)Email address of the user. Specify this attribute when creating a new user.
          type: string
        display_name:
          description: (just-in-time (JIT) provisioning) Indicates display name of the user. Specify this attribute when creating a new user.
          type: string
        groups:
          description: (just-in-time (JIT) provisioning) ID or name of the groups to which the newly created user belongs. Specify this attribute when creating a new user.
          type: array
          items:
            $ref: '#/components/schemas/Group_Object'
        auto_create:
          description: "   Creates a new user if the specified username does not exist in ThoughtSpot. To provision a user just-in-time (JIT), set this attribute to true.\n   \n\nNote: For JIT provisioning of a user, the secret_key is required. New formula variables won't be created.  <br/>  <span class=\"since-beta-tag\">Version: 10.5.0.cl or later</span>"
          default: true
          type:
          - boolean
          - 'null'
      required:
      - username
      - persist_option
    VariableValues:
      type: object
      required:
      - name
      - values
      properties:
        name:
          type: string
          description: The name of the existing formula variable.
        values:
          type: array
          items:
            anyOf:
            - type: string
            - type: boolean
            - type: number
          description: The values to filter on.
      description: Variable values.
    User_Parameter_Options:
      type: object
      properties:
        objects:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/User_Object'
        runtime_filters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Runtime_Filters'
          description: 'Objects to apply the User_Runtime_Filters.


            Examples to set the `runtime_filters` :

            ```json

            { "column_name": "Color", "operator": "EQ", "values": ["red"], "persist": false }

            ```'
        runtime_sorts:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Runtime_Sorts'
          description: 'Objects to apply the User_Runtime_Sorts.


            Examples to set the `runtime_sorts` :

            ```json

            { "column_name": "Color", "order": "ASC", "persist": false }

            ```'
        parameters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Runtime_Parameters'
          description: 'Objects to apply the Runtime_Parameters.


            Examples to set the `parameters` :

            ```json

            { "name": "Color", "values": ["Blue"], "persist": false }

            ```'
      description: 'Define attributes such as Runtime filters and Runtime parameters to send security entitlements to a user session. For more information, see [Documentation](https://developers.thoughtspot.com/docs/abac-user-parameters).

        '
    AuthClusterPreferences:
      type: object
      properties:
        auth_status:
          type:
          - string
          - 'null'
          enum:
          - ENABLED
          - DISABLED
          description: Whether authentication is enabled or disabled at the cluster level.
        access_tokens:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AuthSettingsAccessToken'
          description: Cluster-level access tokens. Absent when no token is configured.
      description: Cluster-level authentication preferences.
    User_Object:
      type: object
      required:
      - identifier
      properties:
        type:
          type:
          - string
          - 'null'
          enum:
          - LOGICAL_TABLE
          description: "  Type of object.\n  \n\nRequired if the name of the object is set as the identifier. This attribute is optional when the object GUID is specified as the identifier.\n  \n\n Specify the object type as `LOGICAL_TABLE`."
        identifier:
          type: string
          description: Unique name/id of the object.
      description: Objects to apply the User_Object.
    ValidateTokenRequest:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    Org:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
          format: int32
          description: The ID of the object.
        name:
          type: string
