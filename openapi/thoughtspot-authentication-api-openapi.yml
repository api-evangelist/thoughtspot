                      auth_status: ENABLED
                      access_tokens:
                      - key: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    org_preferences:
                    - org:
                        id: 583464508
                        name: sales_org
                      auth_status: ENABLED
                      access_tokens:
