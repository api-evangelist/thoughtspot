  /api/rest/2.0/metadata/headers/update:
    post:
      operationId: updateMetadataHeader
      description: "\nUpdate header attributes for a given list of header objects. <br/> <span class=\"since-beta-tag\">Beta</span> <span class=\"since-beta-tag\">Version: 10.6.0.cl or later</span>\n\n## Prerequisites\n- **Privileges Required:**\n  - `DATAMANAGEMENT` (Can manage data) or `ADMINISTRATION` (Can administer ThoughtSpot).\n- **Additional Privileges (if RBAC is enabled):**\n  - `ORG_ADMINISTRATION` (Can manage orgs).\n\n---\n\n## Usage Guidelines\n\n### Parameters\n\n1. **headers_update**  \n   - **Description:** List of header objects with their attributes to be updated. Each object contains a list of attributes to be updated in the header.\n   - **Usage:**\n      - You must provide either `identifier` or `obj_identifier`, but not both. Both fields cannot be empty.\n      - When `org_identifier` is set to `-1`, only the `identifier` value is accepted; `obj_identifier` is not allowed.\n\n2. **org_identifier**  \n   - **Description:** GUID (Globally Unique Identifier) or name of the organization.  \n   - **Usage:**\n     - Leaving this field empty assumes that the changes should be applied to the current organization \n     - Provide `org_guid` or `org_name` to uniquely identify the organization where changes need to be applied. .\n     - Provide `-1` if changes have to be applied across all the org.\n\n---\n\n## Note\nCurrently, this API is enabled only for updating the `obj_identifier` attribute. Only `text` will be allowed in attribute's value.\n\n## Best Practices\n\n1. **Backup Before Conversion:**  \n   Always export metadata as a backup before initiating the update process\n\n---\n\n## Examples\n\n### Only `identifier` is given \n```json\n{\n  \"headers_update\":\n  [\n    {\n      \"identifier\": \"guid_1\",\n      \"obj_identifier\": \"\",\n      \"type\": \"LOGICAL_COLUMN\",\n      \"attributes\":\n      [\n        {\n          \"name\": \"obj_id\",\n          \"value\": \"custom_object_id\"\n        }\n      ]\n    }\n  ],\n  \"org_identifier\": \"orgGuid\"\n}\n```\n\n### Only `obj_identifier` is given\n```json\n{\n  \"headers_update\":\n  [\n    {\n      \"obj_identifier\": \"custom_object_id\",\n      \"type\": \"ANSWER\",\n      \"attributes\":\n      [\n        {\n          \"name\": \"obj_id\",\n          \"value\": \"custom_object_id\"\n        }\n      ]\n    }\n  ],\n  \"org_identifier\": \"orgName\"\n}\n```\n\n### Executing update for all org `-1`\n```json\n{\n  \"headers_update\":\n  [\n    {\n      \"identifier\": \"guid_1\",\n      \"type\": \"ANSWER\",\n      \"attributes\":\n      [\n        {\n          \"name\": \"obj_id\",\n          \"value\": \"custom_object_id\"\n        }\n      ]\n    }\n  ],\n  \"org_identifier\": -1\n}\n```\n\n### Optional `type` is not provided\n```json\n{\n  \"headers_update\":\n  [\n    {\n      \"identifier\": \"guid_1\",\n      \"attributes\":\n      [\n        {\n          \"name\": \"obj_id\",\n          \"value\": \"custom_object_id\"\n        }\n      ]\n    }\n  ],\n  \"org_identifier\": -1\n}\n```\n\n\n\n#### Endpoint URL\n"
      tags:
      - Metadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMetadataHeaderRequest'
        required: true
      parameters: []
      responses:
        '204':
          description: Headers update was successful.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rest/2.0/metadata/update-obj-id:
    post:
      operationId: updateMetadataObjId
      description: "\nUpdate object IDs for given metadata objects. <br/> <span class=\"since-beta-tag\">Beta</span> <span class=\"since-beta-tag\">Version: 10.8.0.cl or later</span>\n\n## Prerequisites\n- **Privileges Required:**\n  - `DATAMANAGEMENT` (Can manage data) or `ADMINISTRATION` (Can administer ThoughtSpot).\n- **Additional Privileges (if RBAC is enabled):**\n  - `ORG_ADMINISTRATION` (Can manage orgs).\n\n---\n\n## Usage Guidelines\n\n### Parameters\n\n1. **metadata**  \n   - **Description:** List of metadata objects to update their object IDs.\n   - **Usage:**\n      - Use either `current_obj_id` alone OR use `metadata_identifier` with `type` (when needed).\n      - When using `metadata_identifier`, the `type` field is required if using a name instead of a GUID.\n      - The `new_obj_id` field is always required.\n\n---\n\n## Note\nThis API is specifically designed for updating object IDs of metadata objects. It internally uses the header update mechanism to perform the changes.\n\n## Best Practices\n\n1. **Backup Before Update:**  \n   Always export metadata as a backup before initiating the update process.\n\n2. **Validation:**\n   - When using `current_obj_id`, ensure it matches the existing object ID exactly.\n   - When using `metadata_identifier` with a name, ensure the `type` is specified correctly.\n   - Verify that the `new_obj_id` follows your naming conventions and is unique within your system.\n\n---\n\n## Examples\n\n### Using current_obj_id\n```json\n{\n  \"metadata\": [\n    {\n      \"current_obj_id\": \"existing_object_id\",\n      \"new_obj_id\": \"new_object_id\"\n    }\n  ]\n}\n```\n\n### Using metadata_identifier with GUID\n```json\n{\n  \"metadata\": [\n    {\n      \"metadata_identifier\": \"01234567-89ab-cdef-0123-456789abcdef\",\n      \"new_obj_id\": \"new_object_id\"\n    }\n  ]\n}\n```\n\n### Using metadata_identifier with name and type\n```json\n{\n  \"metadata\": [\n    {\n      \"metadata_identifier\": \"My Answer\",\n      \"type\": \"ANSWER\",\n      \"new_obj_id\": \"new_object_id\"\n    }\n  ]\n}\n```\n\n### Multiple objects update\n```json\n{\n  \"metadata\": [\n    {\n      \"current_obj_id\": \"existing_object_id_1\",\n      \"new_obj_id\": \"new_object_id_1\"\n    },\n    {\n      \"metadata_identifier\": \"My Worksheet\",\n      \"type\": \"LOGICAL_TABLE\",\n      \"new_obj_id\": \"new_object_id_2\"\n    }\n  ]\n}\n```\n\n\n\n\n#### Endpoint URL\n"
      tags:
      - Metadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMetadataObjIdRequest'
        required: true
      parameters: []
      responses:
        '204':
          description: Headers update was successful.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Export_Options:
      type: object
      properties:
        include_obj_id_ref:
          type: boolean
          default: false
          description: Boolean Flag to export Object ID of referenced object. This flag will work only after the Object ID feature has been enabled. Please contact support to enable the feature.
          nullable: true
        include_guid:
          type: boolean
          default: true
          description: Boolean flag to export guid of the object. This flag will work only after the Object ID feature has been enabled. Please contact support to enable the feature.
          nullable: true
        include_obj_id:
          type: boolean
          default: false
          description: Boolean flag to export Object ID of the object. This flag will work only after the Object ID feature has been enabled. Please contact support to enable the feature.
          nullable: true
        export_with_associated_feedbacks:
          type: boolean
          default: false
          description: 'Boolean flag indicating whether to export associated feedbacks of the object. This will only be respected when the object can have feedbacks. <br/>  <span class="since-beta-tag">Version: 10.7.0.cl or later</span>'
          nullable: true
        export_column_security_rules:
          type: boolean
          default: false
          description: 'Boolean flag indicating whether to export column security rules of the object. This will only be respected when the object can have column security rules and export_associated is true. <br/> <span class="since-beta-tag">Beta</span> <span class="since-beta-tag">Version: 10.12.0.cl or later</span>'
          nullable: true
        export_with_column_aliases:
          type: boolean
          default: false
          description: 'Boolean flag indicating whether to export column aliases of the model. This will only be respected when the object can have column aliases. <br/> <span class="since-beta-tag">Beta</span> <span class="since-beta-tag">Version: 10.13.0.cl or later</span>'
          nullable: true
      description: Flags to specify additional options for export. This will only be active when UserDefinedId in TML is enabled.
    GetAsyncImportStatusResponse:
      type: object
      properties:
        status_list:
          type: array
          items:
            $ref: '#/components/schemas/ImportEPackAsyncTaskStatus'
          description: List of task statuses.
          nullable: true
        last_batch:
          type: boolean
          description: Indicates whether there are more task statuses to fetch.
          nullable: true
    ResponseFailedEntity:
      type: object
      required:
      - id
      - name
      - error
      properties:
        id:
          type: string
        name:
          type: string
          description: Name of the worksheet that failed to convert.
        error:
          type: string
          description: Error details related to the failed conversion.
      description: Unique ID of the failed worksheet.
    ParameterizeMetadataRequest:
      type: object
      properties:
        metadata_type:
          description: Type of metadata object to parameterize.
          type: string
          enum:
          - LOGICAL_TABLE
          - CONNECTION
          - CONNECTION_CONFIG
        metadata_identifier:
          description: Unique ID or name of the metadata object to parameterize.
          type: string
        field_type:
          description: Type of field in the metadata to parameterize.
          type: string
          enum:
          - ATTRIBUTE
          - CONNECTION_PROPERTY
        field_name:
          description: Name of the field which needs to be parameterized.
          type: string
        variable_identifier:
          description: Unique ID or name of the variable to use for parameterization
          type: string
      required:
      - metadata_identifier
      - field_type
      - field_name
      - variable_identifier
    PrincipalsInput:
      type: object
      required:
      - identifier
      properties:
        identifier:
          type: string
          description: Unique ID or name of the principal object such as a user or group.
        type:
          type: string
          enum:
          - USER
          - USER_GROUP
          description: Principal type.
          nullable: true
    ResponseSuccessfulEntities:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResponseSuccessfulEntity'
      description: Wrapper for the successful entities, as they are inside a 'data' field in the response.
    ResponseCopyObject:
      type: object
      properties:
        metadata_id:
          type: string
          description: The unique identifier of the object.
          nullable: true
    MetadataSearchSortOptions:
      type: object
      properties:
        field_name:
          type: string
          enum:
          - NAME
          - DISPLAY_NAME
          - AUTHOR
          - CREATED
          - MODIFIED
          - VIEWS
          - FAVORITES
          - LAST_ACCESSED
          description: Name of the field to apply the sort on.
          nullable: true
        order:
          type: string
          enum:
          - ASC
          - DESC
          description: 'Sort order : ASC(Ascending) or DESC(Descending).'
          nullable: true
      description: Sort options.
    UpdateMetadataHeaderRequest:
      type: object
      properties:
        headers_update:
          description: List of header objects to update.
          type: array
          items:
            $ref: '#/components/schemas/HeaderUpdateInput'
        org_identifier:
          description: Unique ID or name of the organization.
          type: string
      required:
      - headers_update
    ConvertWorksheetToModelRequest:
      type: object
      properties:
        worksheet_ids:
          description: List of Worksheet IDs.
          type: array
          items:
            type: string
        exclude_worksheet_ids:
          description: List of Worksheet IDs to be excluded.
          type: array
          items:
            type: string
        convert_all:
          description: Indicates whether all the worksheet needs to be converted to models.
          default: false
          type: boolean
          nullable: true
        apply_changes:
          description: Indicates whether the changes should be applied to database.
          default: false
          type: boolean
          nullable: true
    ParameterizeMetadataFieldsRequest:
      type: object
      properties:
        metadata_type:
          description: Type of metadata object to parameterize.
          type: string
          enum:
          - LOGICAL_TABLE
          - CONNECTION
          - CONNECTION_CONFIG
        metadata_identifier:
          description: Unique ID or name of the metadata object to parameterize.
          type: string
        field_type:
          description: Type of field in the metadata to parameterize.
          type: string
          enum:
          - ATTRIBUTE
          - CONNECTION_PROPERTY
        field_names:
          description: 'JSON array of field names to parameterize. Example: [schemaName, databaseName, tableName]'
          type: array
          items:
            type: string
        variable_identifier:
          description: Unique ID or name of the variable to use for parameterization of these fields.
          type: string
      required:
      - metadata_identifier
      - field_type
      - field_names
      - variable_identifier
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          nullable: true
    ExportMetadataTMLRequest:
      type: object
      properties:
        metadata:
          description: Metadata objects.
          type: array
          items:
            $ref: '#/components/schemas/ExportMetadataTypeInput'
        export_associated:
          description: Indicates whether to export associated metadata objects of specified metadata objects.
          default: false
          type: boolean
          nullable: true
        export_fqn:
          description: 'Adds FQNs of the referenced objects. For example, if you are exporting a Liveboard and its associated objects,

            the API returns the Liveboard TML data with the FQNs of the referenced worksheet.

            If the exported TML data includes FQNs, you don''t need to manually add FQNs of the referenced objects during TML import.'
          default: false
          type: boolean
          nullable: true
        edoc_format:
          description: 'TML EDOC content format.


            **Note: exporting in YAML format currently requires manual formatting of the output. For more details on the workaround, please click [here](https://developers.thoughtspot.com/docs/known-issues#_version_9_12_0_cl)**'
          default: JSON
          type: string
          enum:
          - JSON
          - YAML
        export_schema_version:
          description: Indicates whether to export worksheet TML in DEFAULT or V1 or V2 version.
          default: DEFAULT
          type: string
          enum:
          - DEFAULT
          - V1
          - V2
        export_dependent:
          description: Indicates whether to export table while exporting connection.
          default: false
          type: boolean
          nullable: true
        export_connection_as_dependent:
          description: 'Indicates whether to export connection as dependent while exporting table/worksheet/answer/liveboard.

            This will only be active when export_associated is true.'
          default: false
          type: boolean
          nullable: true
        all_orgs_override:
          description: Indicates whether to export is happening from all orgs context.
          default: false
          type: boolean
          nullable: true
        export_options:
          description: 'Flags to specify additional options for export. <br/>  <span class="since-beta-tag">Version: 10.6.0.cl or later</span>'
          allOf:
          - $ref: '#/components/schemas/Export_Options'
      required:
      - metadata
    ExportMetadataTypeInput:
      type: object
      properties:
        type:
          type: string
          enum:
          - LIVEBOARD
          - ANSWER
          - LOGICAL_TABLE
          - CONNECTION
          - CUSTOM_ACTION
          - USER
          - USER_GROUP
          - ROLE
          - FEEDBACK
          - COLLECTION
          description: "  Type of metadata.\n  \n\nRequired if the name of the object is set as the identifier. This attribute is optional when the object GUID is specified as the identifier."
          nullable: true
        identifier:
          type: string
          description: Unique ID or name of the metadata object. Not required if the metadata type is ANSWER when session_id and generation_number is set.
          nullable: true
        session_identifier:
          type: string
          description: Unique ID of the Answer session. Required if the metadata type is ANSWER and identifier is not set.
          nullable: true
        generation_number:
          type: integer
          format: int32
          description: Generation Number of the Answer session. Required if the metadata type is ANSWER and identifier is not set.
          nullable: true
      description: MetadataType InputType used in Export MetadataType API
    ResponseWorksheetToModelConversion:
      type: object
      required:
      - name
      - success_count
      - failure_count
      - incomplete_count
      - post_upgrade_failed_count
      - total_time_in_millis
      - successful_entities
      - failed_entities
      - incomplete_entities
      - post_upgrade_failed_entities
      properties:
        name:
          type: string
        success_count:
          type: integer
          format: int32
          description: The number of worksheets successfully converted to models.
        failure_count:
          type: integer
          format: int32
          description: The number of worksheets that failed to convert.
        incomplete_count:
          type: integer
          format: int32
          description: The number of worksheets that were incomplete during the conversion process.
        post_upgrade_failed_count:
          type: integer
          format: int32
          description: The number of worksheets that failed after an upgrade during the conversion process.
        total_time_in_millis:
          type: integer
          format: int32
          description: The total time taken to complete the conversion process in milliseconds.
        successful_entities:
          $ref: '#/components/schemas/ResponseSuccessfulEntities'
