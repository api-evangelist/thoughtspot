openapi: 3.2.0
info:
  title: ThoughtSpot Public REST Metadata API
  version: '2.0'
servers:
- url: '{base-url}'
  variables:
    base-url:
      default: https://localhost:443
security:
- bearerAuth: []
tags:
- name: Metadata
paths:
  /api/rest/2.0/metadata/worksheets/convert:
    post:
      operationId: convertWorksheetToModel
      description: 'Convert worksheets to models

        Version: 10.6.0.cl or later


        ## Prerequisites

        - **Privileges Required:**

        - `DATAMANAGEMENT` (Can manage data) or `ADMINISTRATION` (Can administer ThoughtSpot).

        - **Additional Privileges (if RBAC is enabled):**

        - `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (Can manage data models).


        ---


        ## Usage Guidelines


        ### Parameters


        1. **worksheet_ids**

        - **Description:** A comma-separated list of GUIDs (Globally Unique Identifiers) specifying the Worksheets to be converted.

        - **Usage:**

        - Used only when `convert_all` is set to `false`.

        - Leave empty or omit when `convert_all` is set to `true`.


        2. **exclude_worksheet_ids**

        - **Description:** A comma-separated list of GUIDs specifying Worksheets to be excluded from conversion.

        - **Usage:**

        - Useful when `convert_all` is set to `true` and specific Worksheets should not be converted.


        3. **convert_all**

        - **Description:** Sets the scope of conversion.

        - **Options:**

        - `true`: Converts all Worksheets in the system, except those specified in `exclude_worksheet_ids`.

        - `false`: Converts only the Worksheets listed in `worksheet_ids`.


        4. **apply_changes**

        - **Description:** Specifies whether to apply changes directly to ThoughtSpot or to generate a preview before applying any changes.Used for validation of conversion.

        - **Options:**

        - `true`: Applies conversion changes directly to ThoughtSpot.

        - `false`: Generates only a preview of the changes and does not apply any changes to ThoughtSpot


        ---


        ## Best Practices


        1. **Backup Before Conversion:**

        Always export metadata as a backup before initiating the conversion process


        2. **Partial Conversion for Testing:**

        Test the conversion process by setting `convert_all` to `false` and specifying a small number of `worksheet_ids`.


        3. **Verify Dependencies:**

        Check for dependent objects, such as Tables and Connections, to avoid invalid references.


        4. **Review Changes:**

        Use `apply_changes: false` to preview the impact of the conversion before applying changes.


        ---


        ## Examples


        ### Convert Specific Worksheets

        ```json

        {

        "worksheet_ids": ["guid1", "guid2", "guid3"],

        "exclude_worksheet_ids": [],

        "convert_all": false,

        "apply_changes": true

        }

        ```


        ### Convert All Accessible Worksheets

        ```json

        {

        "worksheet_ids": [],

        "exclude_worksheet_ids": [],

        "convert_all": true,

        "apply_changes": true

        }

        ```


        ### Exclude Specific Worksheets While Converting All Accessible Worksheets

        ```json

        {

        "worksheet_ids": [],

        "exclude_worksheet_ids": ["abc"],

        "convert_all": true,

        "apply_changes": true

        }

        ```


        #### Endpoint URL'
      tags:
      - Metadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertWorksheetToModelRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Conversion of worksheets to model done successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseWorksheetToModelConversion'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
