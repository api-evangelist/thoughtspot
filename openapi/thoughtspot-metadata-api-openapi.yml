  /api/rest/2.0/metadata/headers/update:
    post:
      operationId: updateMetadataHeader
      description: 'Update header attributes for a given list of header objects.

        Beta Version: 10.6.0.cl or later


        ## Prerequisites

        - **Privileges Required:**

        - `DATAMANAGEMENT` (Can manage data) or `ADMINISTRATION` (Can administer ThoughtSpot).

        - **Additional Privileges (if RBAC is enabled):**

        - `ORG_ADMINISTRATION` (Can manage orgs).


        ---


        ## Usage Guidelines


        ### Parameters


        1. **headers_update**

        - **Description:** List of header objects with their attributes to be updated. Each object contains a list of attributes to be updated in the header.

        - **Usage:**

        - You must provide either `identifier` or `obj_identifier`, but not both. Both fields cannot be empty.

        - When `org_identifier` is set to `-1`, only the `identifier` value is accepted; `obj_identifier` is not allowed.


        2. **org_identifier**

        - **Description:** GUID (Globally Unique Identifier) or name of the organization.

        - **Usage:**

        - Leaving this field empty assumes that the changes should be applied to the current organization

        - Provide `org_guid` or `org_name` to uniquely identify the organization where changes need to be applied. .

        - Provide `-1` if changes have to be applied across all the org.


        ---


        ## Note

        Currently, this API is enabled only for updating the `obj_identifier` attribute. Only `text` will be allowed in attribute''s value.


        ## Best Practices


        1. **Backup Before Conversion:**

        Always export metadata as a backup before initiating the update process


        ---


        ## Examples


        ### Only `identifier` is given

        ```json

        {

        "headers_update":

        [

        {

        "identifier": "guid_1",

        "obj_identifier": "",

        "type": "LOGICAL_COLUMN",

        "attributes":

        [

        {

        "name": "obj_id",

        "value": "custom_object_id"

        }

        ]

        }

        ],

        "org_identifier": "orgGuid"

        }

        ```


        ### Only `obj_identifier` is given

        ```json

        {

        "headers_update":

        [

        {

        "obj_identifier": "custom_object_id",

        "type": "ANSWER",

        "attributes":

        [

        {

        "name": "obj_id",

        "value": "custom_object_id"

        }

        ]

        }

        ],

        "org_identifier": "orgName"

        }

        ```


        ### Executing update for all org `-1`

        ```json

        {

        "headers_update":

        [

        {

        "identifier": "guid_1",

        "type": "ANSWER",

        "attributes":

        [

        {

        "name": "obj_id",

        "value": "custom_object_id"

        }

        ]

        }

        ],

        "org_identifier": -1

        }

        ```


        ### Optional `type` is not provided

        ```json

        {

        "headers_update":

        [

        {

        "identifier": "guid_1",

        "attributes":

        [

        {

        "name": "obj_id",

        "value": "custom_object_id"

        }

        ]

        }

        ],

        "org_identifier": -1

        }

        ```


        #### Endpoint URL'
      tags:
      - Metadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMetadataHeaderRequest'
        required: true
      parameters: []
      responses:
        '204':
          description: Headers update was successful.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
