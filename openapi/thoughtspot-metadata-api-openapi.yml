  /api/rest/2.0/metadata/update-obj-id:
    post:
      operationId: updateMetadataObjId
      description: 'Update object IDs for given metadata objects.

        Beta Version: 10.8.0.cl or later


        ## Prerequisites

        - **Privileges Required:**

        - `DATAMANAGEMENT` (Can manage data) or `ADMINISTRATION` (Can administer ThoughtSpot).

        - **Additional Privileges (if RBAC is enabled):**

        - `ORG_ADMINISTRATION` (Can manage orgs).


        ---


        ## Usage Guidelines


        ### Parameters


        1. **metadata**

        - **Description:** List of metadata objects to update their object IDs.

        - **Usage:**

        - Use either `current_obj_id` alone OR use `metadata_identifier` with `type` (when needed).

        - When using `metadata_identifier`, the `type` field is required if using a name instead of a GUID.

        - The `new_obj_id` field is always required.


        ---


        ## Note

        This API is specifically designed for updating object IDs of metadata objects. It internally uses the header update mechanism to perform the changes.


        ## Best Practices


        1. **Backup Before Update:**

        Always export metadata as a backup before initiating the update process.


        2. **Validation:**

        - When using `current_obj_id`, ensure it matches the existing object ID exactly.

        - When using `metadata_identifier` with a name, ensure the `type` is specified correctly.

        - Verify that the `new_obj_id` follows your naming conventions and is unique within your system.


        ---


        ## Examples


        ### Using current_obj_id

        ```json

        {

        "metadata": [

        {

        "current_obj_id": "existing_object_id",

        "new_obj_id": "new_object_id"

        }

        ]

        }

        ```


        ### Using metadata_identifier with GUID

        ```json

        {

        "metadata": [

        {

        "metadata_identifier": "01234567-89ab-cdef-0123-456789abcdef",

        "new_obj_id": "new_object_id"

        }

        ]

        }

        ```


        ### Using metadata_identifier with name and type

        ```json

        {

        "metadata": [

        {

        "metadata_identifier": "My Answer",

        "type": "ANSWER",

        "new_obj_id": "new_object_id"

        }

        ]

        }

        ```


        ### Multiple objects update

        ```json

        {

        "metadata": [

        {

        "current_obj_id": "existing_object_id_1",

        "new_obj_id": "new_object_id_1"

        },

        {

        "metadata_identifier": "My Worksheet",

        "type": "LOGICAL_TABLE",

        "new_obj_id": "new_object_id_2"

        }

        ]

        }

        ```


        #### Endpoint URL'
      tags:
      - Metadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMetadataObjIdRequest'
        required: true
      parameters: []
      responses:
        '204':
          description: Headers update was successful.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Update metadata obj id
