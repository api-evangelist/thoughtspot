      - modification_time_in_millis
      properties:
        id:
          type: string
          description: Unique identifier of the webhook configuration.
        name:
          type: string
          description: Name of the webhook configuration.
        description:
          type: string
          description: Description of the webhook configuration.
          nullable: true
        org:
          $ref: '#/components/schemas/WebhookOrg'
          description: Org details.
          nullable: true
        url:
          type: string
          description: The webhook endpoint URL.
        url_params:
          type: object
          description: Additional URL parameters as key-value pairs.
          nullable: true
        events:
          type: array
          items:
            type: string
            enum:
            - LIVEBOARD_SCHEDULE
          description: List of events this webhook subscribes to.
        authentication:
          $ref: '#/components/schemas/WebhookAuthentication'
          description: Redacted authorization configuration for the webhook.
          nullable: true
        signature_verification:
          $ref: '#/components/schemas/WebhookSignatureVerification'
          description: Redacted configuration for webhook signature verification.
          nullable: true
        additional_headers:
          type: array
          items:
            $ref: '#/components/schemas/WebhookKeyValuePair'
          description: 'Additional headers as an array of key-value pairs. <br/>  <span class="since-beta-tag">Version: 26.4.0.cl or later</span>'
          nullable: true
        creation_time_in_millis:
          type: number
          format: float
          description: Creation time of the webhook configuration in milliseconds.
        modification_time_in_millis:
          type: number
          format: float
          description: Last modified time of the webhook configuration in milliseconds.
        created_by:
          $ref: '#/components/schemas/WebhookUser'
          description: User who created the webhook.
          nullable: true
        last_modified_by:
          $ref: '#/components/schemas/WebhookUser'
          description: User who last modified the webhook.
          nullable: true
        storage_destination:
          $ref: '#/components/schemas/StorageDestination'
          description: Storage destination configuration for webhook payload delivery.
          nullable: true
        status:
          type: string
          enum:
          - ENABLED
          - DISABLED
          description: 'Status of the webhook (ENABLED or DISABLED).

            Only present when explicitly set. <br/>  <span class="since-beta-tag">Version: 26.7.0.cl or later</span>'
          nullable: true
    VariableUpdateScopeInput:
      type: object
      required:
      - org_identifier
      properties:
        org_identifier:
          type: string
          description: The unique name of the org
        principal_type:
          type: string
          enum:
          - USER
          - USER_GROUP
          description: Type of principal to which the variable value applies. Use USER to assign values to a specific user, or USER_GROUP to assign values to a group.
          nullable: true
        principal_identifier:
          type: string
          description: Unique ID or name of the principal
          nullable: true
        model_identifier:
          type: string
          description: Unique ID or name of the model. Required for FORMULA_VARIABLE type to scope the variable value to a specific worksheet.
          nullable: true
        priority:
          type: integer
          format: int32
          description: The priority level for this scope assignment, used for conflict resolution when multiple values match. Higher priority values (larger numbers) take precedence.
          nullable: true
      description: Input for defining the scope of variable value assignments in batch update operations
    StorageDestination:
      type: object
      required:
      - storage_type
      - storage_config
      properties:
        storage_type:
          type: string
          enum:
          - AWS_S3
          - GCP_GCS
          description: Type of storage destination (e.g., AWS_S3).
        storage_config:
          $ref: '#/components/schemas/StorageConfig'
          description: Storage-specific configuration settings.
      description: Storage destination configuration for webhook payload delivery.
    GcpGcsConfigInput:
      type: object
      required:
      - bucket_name
      - service_account_email
      properties:
        bucket_name:
          type: string
          description: 'Name of the GCS bucket where webhook payloads will be stored.

            Example: "my-webhook-files"'
        service_account_email:
          type: string
          description: 'Email of the GCP service account to impersonate for bucket access.

            The platform''s service account must be granted roles/iam.serviceAccountTokenCreator on this SA.

            Example: "my-sa@my-project.iam.gserviceaccount.com"'
        path_prefix:
          type: string
          description: 'Optional path prefix for organizing objects within the bucket.

            Example: "webhooks/"'
          nullable: true
      description: Input type for GCP GCS storage configuration.
    StorageConfigInput:
      type: object
      properties:
        aws_s3_config:
          $ref: '#/components/schemas/AwsS3ConfigInput'
          description: 'AWS S3 storage configuration.

            Example: {"bucket_name": "my-webhook-files", "region": "us-west-2", "role_arn": "arn:aws:iam::123456789012:role/WebhookDeliveryRole", "external_id": "ts-webhook-a1b2c3d4-7890", "path_prefix": "webhook-deliveries/"}'
          nullable: true
        gcp_gcs_config:
          $ref: '#/components/schemas/GcpGcsConfigInput'
          description: 'GCP GCS storage configuration.

            Example: {"bucket_name": "my-webhook-files", "service_account_email": "my-sa@my-project.iam.gserviceaccount.com", "path_prefix": "webhooks/"} <br/>  <span class="since-beta-tag">Version: 26.7.0.cl or later</span>'
          nullable: true
      description: Input type for storage configuration.
    WebhookSortOptionsInput:
      type: object
      properties:
        field_name:
          type: string
          enum:
          - CREATED
          - MODIFIED
          - NAME
          default: CREATED
          description: Name of the field to apply the sort on.
          nullable: true
        order:
          type: string
          enum:
          - ASC
          - DESC
          default: DESC
          description: 'Sort order: ASC (Ascending) or DESC (Descending).'
          nullable: true
    StorageConfig:
      type: object
      properties:
        aws_s3_config:
          $ref: '#/components/schemas/AwsS3Config'
          description: AWS S3 storage configuration.
          nullable: true
        gcp_gcs_config:
          $ref: '#/components/schemas/GcpGcsConfig'
          description: 'GCP GCS storage configuration. <br/>  <span class="since-beta-tag">Version: 26.7.0.cl or later</span>'
          nullable: true
      description: Storage configuration containing provider-specific settings.
    WebhookAuthApiKeyInput:
      type: object
      required:
      - key
      - value
      properties:
        key:
          type: string
          description: The header or query parameter name for the API key.
        value:
          type: string
          description: The API key value.
    CreateWebhookConfigurationRequest:
      type: object
      properties:
        name:
          description: Name of the webhook configuration.
          type: string
        description:
          description: Description of the webhook configuration.
          type: string
        url:
          description: The webhook endpoint URL.
          type: string
        url_params:
          description: Additional URL parameters as key-value pairs.
          type: object
        events:
          description: List of events to subscribe to.
          type: array
          items:
            type: string
            enum:
            - LIVEBOARD_SCHEDULE
        authentication:
          description: Authorization configuration for the webhook.
          allOf:
          - $ref: '#/components/schemas/WebhookAuthenticationInput'
        signature_verification:
          description: Configuration for webhook signature verification.
          allOf:
          - $ref: '#/components/schemas/WebhookSignatureVerificationInput'
        storage_destination:
          description: 'Configuration for storage destination.

            AWS S3 example: {"storage_type": "AWS_S3", "storage_config": {"aws_s3_config": {"bucket_name": "my-webhook-files", "region": "us-west-2", "role_arn": "arn:aws:iam::123456789012:role/ThoughtSpotDeliveryRole", "external_id": "ts-webhook-a1b2c3d4-7890", "path_prefix": "thoughtspot-webhooks/"}}}

            GCP GCS example: {"storage_type": "GCP_GCS", "storage_config": {"gcp_gcs_config": {"bucket_name": "my-webhook-files", "service_account_email": "my-sa@my-project.iam.gserviceaccount.com", "path_prefix": "webhooks/"}}} <br/>  <span class="since-beta-tag">Version: 26.3.0.cl or later</span>'
          allOf:
          - $ref: '#/components/schemas/StorageDestinationInput'
        additional_headers:
          description: 'Additional headers as an array of key-value pairs.

            Example: [{"key": "X-Custom-Header", "value": "custom_value"}] <br/>  <span class="since-beta-tag">Version: 26.4.0.cl or later</span>'
          type: array
          items:
            $ref: '#/components/schemas/WebhookKeyValuePairInput'
        status:
          description: 'Status of the webhook (ENABLED or DISABLED). Optional — when omitted,

            status is not stored and will be absent from the response. <br/>  <span class="since-beta-tag">Version: 26.7.0.cl or later</span>'
          type: string
          enum:
          - ENABLED
          - DISABLED
      required:
      - name
      - url
      - events
    UpdateWebhookConfigurationRequest:
      type: object
      properties:
        name:
          description: Name of the webhook configuration.
          type: string
        description:
          description: Description of the webhook configuration.
          type: string
        url:
          description: The webhook endpoint URL.
          type: string
        url_params:
          description: Additional URL parameters as key-value pairs.
          type: object
        events:
          description: List of events to subscribe to.
          type: array
          items:
            type: string
            enum:
            - LIVEBOARD_SCHEDULE
        authentication:
          description: Authorization configuration for the webhook.
          allOf:
          - $ref: '#/components/schemas/WebhookAuthenticationInput'
        signature_verification:
          description: Configuration for webhook signature verification.
          allOf:
          - $ref: '#/components/schemas/WebhookSignatureVerificationInput'
        storage_destination:
          description: 'Configuration for storage destination.

            AWS S3 example: {"storage_type": "AWS_S3", "storage_config": {"aws_s3_config": {"bucket_name": "my-webhook-files", "region": "us-west-2", "role_arn": "arn:aws:iam::123456789012:role/ThoughtSpotDeliveryRole", "external_id": "ts-webhook-a1b2c3d4-7890", "path_prefix": "thoughtspot-webhooks/"}}}

            GCP GCS example: {"storage_type": "GCP_GCS", "storage_config": {"gcp_gcs_config": {"bucket_name": "my-webhook-files", "service_account_email": "my-sa@my-project.iam.gserviceaccount.com", "path_prefix": "webhooks/"}}} <br/>  <span class="since-beta-tag">Version: 26.3.0.cl or later</span>'
          allOf:
          - $ref: '#/components/schemas/StorageDestinationInput'
        additional_headers:
          description: 'Additional headers as an array of key-value pairs.

            Example: [{"key": "X-Custom-Header", "value": "custom_value"}] <br/>  <span class="since-beta-tag">Version: 26.4.0.cl or later</span>'
          type: array
          items:
            $ref: '#/components/schemas/WebhookKeyValuePairInput'
        status:
          description: 'Status of the webhook (ENABLED or DISABLED). <br/>  <span class="since-beta-tag">Version: 26.7.0.cl or later</span>'
          type: string
          enum:
          - ENABLED
          - DISABLED
        reset_options:
          description: 'List of optional configuration sections to clear. Each value removes the

            corresponding configuration entirely from the webhook: AUTHENTICATION

            removes the authentication config, SIGNATURE_VERIFICATION removes the

            signature verification config, STORAGE_DESTINATION removes the storage

            destination config. <br/>  <span class="since-beta-tag">Version: 26.7.0.cl or later</span>'
          type: array
          items:
            type: string
            enum:
            - AUTHENTICATION
            - SIGNATURE_VERIFICATION
            - STORAGE_DESTINATION
    WebhookAuthBasicAuthInput:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          description: Username for basic authentication.
        password:
          type: string
          description: Password for basic authentication.
    EventChannelConfigInput:
      type: object
      required:
      - event_type
      - channels
      properties:
        event_type:
          type: string
          enum:
          - LIVEBOARD_SCHEDULE
          description: Type of event for which communication channels are configured
        channels:
          type: array
          items:
            type: string
            enum:
            - EMAIL
            - WEBHOOK
          description: Communication channels enabled for this event type. Empty array disables all channels for this event.
    WebhookAuthentication:
      type: object
      properties:
        API_KEY:
          $ref: '#/components/schemas/WebhookAuthApiKey'
          description: Redacted API key authentication configuration.
          nullable: true
        BASIC_AUTH:
          $ref: '#/components/schemas/WebhookAuthBasicAuth'
          description: Redacted Basic authentication configuration.
          nullable: true
        BEARER_TOKEN:
          type: string
          description: Redacted Bearer token authentication configuration.
          nullable: true
        OAUTH2:
          $ref: '#/components/schemas/WebhookAuthOAuth2'
          description: Redacted OAuth2 authentication configuration.
          nullable: true
    SearchWebhookConfigurationsRequest:
      type: object
      properties:
        org_identifier:
          description: Unique ID or name of the org.
          type: string
        webhook_identifier:
          description: Unique ID or name of the webhook.
          type: string
        event_type:
          description: Type of webhook event to filter by.
          type: string
          enum:
          - LIVEBOARD_SCHEDULE
        record_offset:
          description: The offset point, starting from where the webhooks should be included in the response.
          default: 0
          type: integer
          format: int32
        record_size:
          description: The number of webhooks that should be included in the response starting from offset position.
          default: 50
          type: integer
          format: int32
        sort_options:
          description: Sort option includes sort field and sort order.
          allOf:
          - $ref: '#/components/schemas/WebhookSortOptionsInput'
        status:
          description: 'Filter webhooks by status (ENABLED or DISABLED). <br/>  <span class="since-beta-tag">Version: 26.7.0.cl or later</span>'
          type: string
          enum:
          - ENABLED
          - DISABLED
    SearchCommunicationChannelPreferencesRequest:
      type: object
      properties:
        cluster_preferences:
          description: Event types to search for in cluster-level preferences.
          type: array
          items:
            type: string
            enum:
            - LIVEBOARD_SCHEDULE
        org_preferences:
          description: Org-specific search criteria.
          type: array
          items:
            $ref: '#/components/schemas/OrgPreferenceSearchCriteriaInput'
    CommunicationChannelPreferencesResponse:
      type: object
      properties:
        cluster_preferences:
          type: array
          items:
            $ref: '#/components/schemas/EventChannelConfig'
          description: Cluster-level default configurations.
          nullable: true
        org_preferences:
          type: array
          items:
            $ref: '#/components/schemas/OrgChannelConfigResponse'
          description: Org-specific configurations.
          nullable: true
    OrgChannelConfigInput:
      type: object
      required:
      - org_identifier
      properties:
        org_identifier:
          type: string
          description: Unique identifier or name of the org
        operation:
          type: string
          enum:
          - REPLACE
          - RESET
          default: REPLACE
          description: 'Operation to perform. REPLACE: Update preferences (default). RESET: Remove org-specific configurations, causing fallback to cluster-level preferences.'
          nullable: true
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/EventChannelConfigInput'
          description: Event-specific configurations. Required for REPLACE operation.
          nullable: true
        reset_events:
          type: array
          items:
            type: string
            enum:
            - LIVEBOARD_SCHEDULE
          description: Event types to reset. Required for RESET operation. Org-specific configurations for these events will be removed, causing fallback to cluster-level preferences.
          nullable: true
    VariableUpdateAssignmentInput:
      type: object
      required:
      - variable_identifier
      - variable_values
      - operation
      properties:
        variable_identifier:
          type: string
          description: ID or Name of the variable
        variable_values:
          type: array
          items:
            type: string
          description: Values of the variable
        operation:
          type: string
          enum:
          - ADD
          - REMOVE
          - REPLACE
          - RESET
          description: Operation to perform
      description: Input for variable value update in batch operations
    WebhookAuthBasicAuth:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          description: Username for basic authentication.
        password:
          type: string
          description: Password for basic authentication.
    WebhookSearchResponse:
      type: object
      required:
      - webhooks
      - pagination
      properties:
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/WebhookResponse'
          description: List of webhook configurations matching the search criteria.
        pagination:
          $ref: '#/components/schemas/WebhookPagination'
          description: Pagination information.
    WebhookDeleteResponse:
      type: object
      required:
      - deleted_count
      - failed_count
      - deleted_webhooks
      - failed_webhooks
      properties:
        deleted_count:
          type: integer
          format: int32
          description: Number of webhooks successfully deleted.
        failed_count:
          type: integer
          format: int32
          description: Number of webhooks that failed to delete.
        deleted_webhooks:
          type: array
          items:
            $ref: '#/components/schemas/WebhookResponse'
          description: List of successfully deleted webhooks.
        failed_webhooks:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeleteFailure'
          description: List of webhooks that failed to delete with error details.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
