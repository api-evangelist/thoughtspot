        has_more:
          type: boolean
          description: Indicates whether more records are available beyond the current response.
    WebhookKeyValuePair:
      type: object
      required:
      - key
      - value
      properties:
        key:
          type: string
          description: Header name.
        value:
          type: string
          description: Header value.
