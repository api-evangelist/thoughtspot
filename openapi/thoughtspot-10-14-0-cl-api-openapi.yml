components:
  schemas:
    WebhookUser:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: Unique identifier of the user.
        name:
          type: string
          description: Name of the user.
    WebhookAuthenticationInput:
      type: object
      properties:
        API_KEY:
          $ref: '#/components/schemas/WebhookAuthApiKeyInput'
          description: API key authentication configuration.
          nullable: true
        BASIC_AUTH:
          $ref: '#/components/schemas/WebhookAuthBasicAuthInput'
          description: Basic authentication configuration.
          nullable: true
        BEARER_TOKEN:
          type: string
          description: Bearer token authentication configuration.
          nullable: true
        OAUTH2:
          $ref: '#/components/schemas/WebhookAuthOAuth2Input'
          description: OAuth2 authentication configuration.
          nullable: true
    StorageDestinationInput:
      type: object
      required:
      - storage_type
      - storage_config
      properties:
        storage_type:
          type: string
          enum:
          - AWS_S3
          - GCP_GCS
          description: 'Type of storage destination.

            Example: "AWS_S3"'
        storage_config:
          $ref: '#/components/schemas/StorageConfigInput'
          description: 'Storage-specific configuration settings.

            Example: {"aws_s3_config": {"bucket_name": "my-webhook-files", "region": "us-west-2", "role_arn": "arn:aws:iam::123456789012:role/WebhookDeliveryRole", "external_id": "ts-webhook-a1b2c3d4-7890", "path_prefix": "webhook-deliveries/"}}'
      description: Input type for storage destination configuration.
    WebhookDeleteFailure:
      type: object
      required:
      - id
      - name
      - error
      properties:
        id:
          type: string
          description: Unique identifier of the webhook that failed to delete.
        name:
          type: string
          description: Name of the webhook that failed to delete.
        error:
          type: string
          description: Error message describing why the deletion failed.
    WebhookAuthApiKey:
      type: object
      required:
      - key
      - value
      properties:
        key:
          type: string
          description: The header or query parameter name for the API key.
        value:
          type: string
          description: The API key value.
    GcpGcsConfig:
      type: object
      required:
      - bucket_name
      - service_account_email
      properties:
        bucket_name:
          type: string
          description: Name of the GCS bucket where webhook payloads are stored.
        service_account_email:
          type: string
          description: Email of the GCP service account to impersonate for bucket access.
        path_prefix:
          type: string
          description: Path prefix for organizing objects within the bucket.
          nullable: true
      description: GCP GCS storage configuration details.
    OrgChannelConfigResponse:
      type: object
      required:
      - org
      - preferences
      properties:
        org:
          $ref: '#/components/schemas/OrgDetails'
          description: Org details
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/EventChannelConfig'
          description: Event-specific communication channel configurations for this org
    ConfigureCommunicationChannelPreferencesRequest:
      type: object
      properties:
        cluster_preferences:
          description: Cluster-level default configurations.
          type: array
          items:
            $ref: '#/components/schemas/EventChannelConfigInput'
        org_preferences:
          description: Org-specific configurations.
          type: array
          items:
            $ref: '#/components/schemas/OrgChannelConfigInput'
    AwsS3ConfigInput:
      type: object
      required:
      - bucket_name
      - region
      - role_arn
      properties:
        bucket_name:
          type: string
          description: 'Name of the S3 bucket where webhook payloads will be stored.

            Example: "my-webhook-files"'
        region:
          type: string
          description: 'AWS region where the S3 bucket is located.

            Example: "us-west-2"'
        role_arn:
          type: string
          description: 'ARN of the IAM role to assume for S3 access.

            Example: "arn:aws:iam::123456789012:role/WebhookDeliveryRole"'
        external_id:
          type: string
          description: 'External ID for secure cross-account role assumption.

            Example: "ts-webhook-a1b2c3d4-7890"'
          nullable: true
        path_prefix:
          type: string
          description: 'Optional path prefix for organizing objects within the bucket.

            Example: "webhook-deliveries/"'
          nullable: true
      description: Input type for AWS S3 storage configuration.
    UpdateVariableValuesRequest:
      type: object
      properties:
        variable_assignment:
          description: Array of variable assignment objects specifying the variable identifier, values to assign, and the operation type (ADD, REMOVE, REPLACE, or RESET) to perform on each variable.
          type: array
          items:
            $ref: '#/components/schemas/VariableUpdateAssignmentInput'
        variable_value_scope:
          description: Array of scope objects defining where the variable values apply, including organization context, optional principal constraints (user or group), model reference for formula variables, and priority for conflict resolution.
          type: array
          items:
            $ref: '#/components/schemas/VariableUpdateScopeInput'
      required:
      - variable_assignment
      - variable_value_scope
    WebhookSignatureVerification:
      type: object
      required:
      - type
      - header
      - algorithm
      - secret
      properties:
        type:
          type: string
          enum:
          - HMAC_SHA256
          description: Signature verification method type.
        header:
          type: string
          description: HTTP header where the signature is sent.
        algorithm:
          type: string
          enum:
          - SHA256
          description: Hash algorithm used for signature verification.
        secret:
          type: string
          description: Shared secret used for HMAC signature generation.
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          nullable: true
    AwsS3Config:
      type: object
      required:
      - bucket_name
      - region
      - role_arn
      properties:
        bucket_name:
          type: string
          description: Name of the S3 bucket where webhook payloads are stored.
        region:
          type: string
          description: AWS region where the S3 bucket is located.
        role_arn:
          type: string
          description: ARN of the IAM role used for S3 access.
        external_id:
          type: string
          description: External ID for secure cross-account role assumption.
          nullable: true
        path_prefix:
          type: string
          description: Path prefix for organizing objects within the bucket.
          nullable: true
      description: AWS S3 storage configuration details.
    WebhookAuthOAuth2:
      type: object
      required:
      - authorization_url
      - client_id
      - client_secret
      properties:
        authorization_url:
          type: string
          description: OAuth2 authorization server URL.
        client_id:
          type: string
          description: OAuth2 client identifier.
        client_secret:
          type: string
          description: OAuth2 client secret key.
    WebhookOrg:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: Unique identifier of the org.
        name:
          type: string
          description: Name of the org.
    EventChannelConfig:
      type: object
      required:
      - event_type
      - channels
      properties:
        event_type:
          type: string
          enum:
          - LIVEBOARD_SCHEDULE
          description: Type of event for which communication channels are configured
        channels:
          type: array
          items:
            type: string
            enum:
            - EMAIL
            - WEBHOOK
          description: Communication channels enabled for this event type. Empty array indicates no channels are enabled.
    WebhookSignatureVerificationInput:
      type: object
      required:
      - type
      - header
      - algorithm
      - secret
      properties:
        type:
          type: string
          enum:
          - HMAC_SHA256
          description: Signature verification method type.
        header:
          type: string
          description: HTTP header where the signature is sent.
        algorithm:
          type: string
          enum:
          - SHA256
          description: Hash algorithm used for signature verification.
        secret:
          type: string
          description: Shared secret used for HMAC signature generation.
    OrgPreferenceSearchCriteriaInput:
      type: object
      required:
      - org_identifier
      properties:
