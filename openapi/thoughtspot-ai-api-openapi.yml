      description: 'Updates attributes of an existing agent conversation. Currently only the

        display title can be updated; additional conversation attributes may be

        supported in future versions. At least one updatable attribute must be

        provided in the request body.

        Version: 26.7.0.cl or later


        Updates attributes of an existing saved agent conversation. Currently only the conversation''s display `title` can be updated; additional updatable attributes may be supported in future versions. At least one updatable attribute must be supplied in the request body.


        Requires `CAN_USE_SPOTTER` privilege and ownership of the conversation being updated.


