  /api/rest/2.0/ai/agent/conversations:
    get:
      operationId: getConversationList
      description: 'Retrieves the list of saved agent conversations for the currently authenticated user.

        Only conversations created with `enable_save_chat: true` are returned.

        Version: 26.7.0.cl or later


        Retrieves a paginated list of saved agent conversations for the currently authenticated user. Only conversations that were created with `enable_save_chat: true` in `createAgentConversation` are returned.


        Requires `CAN_USE_SPOTTER` privilege.


        #### Usage guidelines


        The request supports the following optional query parameters:


        - `limit`: maximum number of conversations to return. Use this together with `offset` for pagination.

        - `offset`: number of conversations to skip before returning results. Defaults to `0`.

        - `skip_empty`: when `true` (default), conversations with no messages are excluded from the results. Set to `false` to include empty conversations.


        If the request is successful, the response includes a `conversations` array. Each entry contains:


        - `conversation_identifier`: the unique ID of the conversation, used as input to `sendAgentConversationMessage`, `updateConversation`, `deleteConversation`, `stopConversation`, and `loadAnswer`

        - `conversation_title`: the display name of the conversation

        - `created_at`: ISO 8601 timestamp of when the conversation was created

        - `updated_at`: ISO 8601 timestamp of the most recent update to the conversation

        - `data_source_identifiers`: list of unique IDs of the data sources associated with the conversation

        - `data_source_names`: array of `{ id, name }` objects for the data sources associated with the conversation


        #### Pagination


        Use `limit` and `offset` to page through large result sets:


        ```

        GET /api/rest/2.0/ai/agent/conversations?limit=20&offset=0 → first page

        GET /api/rest/2.0/ai/agent/conversations?limit=20&offset=20 → second page

        ```


        #### Pagination and `has_more`


        The response includes a `has_more: Boolean` field. When `true`, there are additional conversations beyond the current page — increment `offset` by `limit` to fetch the next page. When `has_more` is `false`, the current page is the last. Note that `total_count` is not returned; use `has_more` to drive paging controls.


        #### Example response


        ```json

        {

        "conversations": [

        {

        "conversation_identifier": "abc123",

        "conversation_title": "Sales by Region Q1",

        "created_at": "2026-03-01T10:00:00Z",

        "updated_at": "2026-03-05T14:23:00Z",

        "data_source_identifiers": ["ds-001"],

        "data_source_names": [{ "id": "ds-001", "name": "Retail Sales" }]

        }

        ],

        "has_more": false

        }

        ```


        #### Error responses


        | Code | Description |

        |------|-------------|

        | 401 | Unauthorized — authentication token is missing, expired, or invalid. |

        | 403 | Forbidden — the authenticated user does not have `CAN_USE_SPOTTER` privilege. |


        > ###### Note:

        >

        > - Only conversations created with `enable_save_chat: true` appear in this list. Conversations created with `enable_save_chat: false` (the default) are not persisted and cannot be retrieved.

        > - Available from version 26.7.0.cl and later.

        > - This endpoint requires Spotter — please contact ThoughtSpot Support to enable Spotter on your cluster.


        #### Endpoint URL'
      tags:
      - AI
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 30
        description: Maximum number of conversations to return. Used for pagination.
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        description: Number of conversations to skip before returning results. Used for pagination.
      - in: query
        name: skip_empty
        required: false
        schema:
          type: boolean
          default: true
        description: When true, excludes conversations with no messages. Defaults to true.
      responses:
        '200':
          description: Common successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConversationHistoryResponse'
        '201':
          description: Common error response
