  /api/rest/2.0/ai/agent/conversations/{conversation_identifier}/get-share-info:
    get:
      operationId: getShareInfo
      description: 'Returns the current share state for a conversation the caller owns: whether

        the shared view is outdated relative to the latest conversation content, and

        the list of principals that currently have access.

        Requires `CAN_USE_SPOTTER` privilege and ownership of the specified conversation.

        Version: 26.9.0.cl or later


        Returns the current share state for a conversation the caller owns: whether the shared view reflects the latest conversation content, and the list of principals that currently have access.


        Use this endpoint to render a share management UI, audit who has access to a conversation, or determine whether the shared view needs to be refreshed before sending a link.


        Requires ownership of the specified conversation.


        #### Usage guidelines


        The request must include:


        - `conversation_identifier` _(query parameter)_: the unique ID of the conversation, as returned by `createAgentConversation` or `getConversationList`.


        #### Response fields


        | Field | Type | Description |

        | --- | --- | --- |

        | `conversation_id` | `String` | Echoes the request parameter. |

        | `is_shared_content_outdated` | `Boolean` | `true` when the shared view was generated before the last edit to the conversation and does not reflect the latest content. `false` when the shared view is current. `null` when the conversation has never been shared. |

        | `principals` | `ConversationPrincipalInfo[]` | List of principals with access. Empty when no access has been granted. The conversation owner is never included. |


        #### ConversationPrincipalInfo fields


        | Field | Type | Description |

        | --- | --- | --- |

        | `id` | `String` | Unique identifier of the user or group. |

        | `type` | `Principals` | `USER` for individual users, `USER_GROUP` for groups. |

        | `display_name` | `String` | Display name as shown in the ThoughtSpot UI. |

        | `name` | `String` | Internal name of the user or group. |

        | `permission` | `String` | Access level. Always `READ_ONLY` for shared conversations. |


        #### Example request


        ```bash

        GET /api/rest/2.0/ai/agent/conversations/{conversation_identifier}/get-share-info

        ```


        #### Example response — conversation shared and current


        ```json

        {

        "conversation_id": "conv-abc-123",

        "is_shared_content_outdated": false,

        "principals": [

        {

        "id": "user-001",

        "type": "USER",

        "display_name": "Alice Example",

        "name": "alice.example",

        "permission": "READ_ONLY"

        },

        {

        "id": "group-001",

        "type": "USER_GROUP",

        "display_name": "Sales Team",

        "name": "sales-team",

        "permission": "READ_ONLY"

        }

        ]

        }

        ```


        #### Example response — conversation never shared


        ```json

        {

        "conversation_id": "conv-abc-123",

        "is_shared_content_outdated": null,

        "principals": []

        }

        ```


        #### Example response — shared view outdated


        ```json

        {

        "conversation_id": "conv-abc-123",

        "is_shared_content_outdated": true,

        "principals": [

        {

        "id": "user-001",

        "type": "USER",

        "display_name": "Alice Example",

        "name": "alice.example",

        "permission": "READ_ONLY"

        }

        ]

        }

        ```


        When `is_shared_content_outdated` is `true`, call `shareConversation` with `refresh_shared_content: true` to update the shared view with the latest conversation content.


        #### Error responses


        | Code | Description |

        | --- | --- |

        | 401 | Unauthorized — authentication token is missing, expired, or invalid. |

        | 403 | Forbidden — the caller does not own the specified conversation, or does not have `CAN_USE_SPOTTER` privilege. |

        | 404 | Not Found — no conversation exists with the given identifier for the authenticated user. |


        > ###### Note:

        >

        > - This endpoint requires Spotter — please contact ThoughtSpot Support to enable Spotter on your cluster.

        Version: 26.9.0.cl or later


        #### Endpoint URL'
      tags:
      - AI
      parameters:
      - in: path
        name: conversation_identifier
        required: true
        schema:
          type: string
        description: Unique identifier of the conversation.
      responses:
        '200':
          description: Common successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationShareStatusResponse'
              examples:
                example_1:
                  summary: Conversation shared with two principals, content is current
                  value:
                    conversation_id: conv-abc-123
                    is_shared_content_outdated: false
                    principals:
                    - id: user-001
                      type: USER
                      display_name: Alice Example
                      name: alice.example
