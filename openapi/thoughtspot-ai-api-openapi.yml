        The request must include:


        - `conversation_identifier` *(path parameter)*: the unique ID of the conversation to update, as returned by `createAgentConversation` or `getConversationList`

        - At least one updatable attribute in the request body:

        - `title` *(optional)*: the new display name for the conversation. When provided, must be a non-empty string.


        A successful request returns an empty `204 No Content` response. Updated attributes are reflected immediately in subsequent calls to `getConversationList`.


        #### Example request


        ```bash

        POST /api/rest/2.0/ai/agent/conversations/{conversation_identifier}/update

        Content-Type: application/json


