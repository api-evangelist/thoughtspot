        "title": "Revenue Breakdown by Product Line"

        }

        ```


        #### Error responses


        | Code | Description |

        |------|-------------|

        | 400 | Bad Request — the request body is empty or `title` is provided as an empty string. |

        | 401 | Unauthorized — authentication token is missing, expired, or invalid. |

        | 403 | Forbidden — the authenticated user does not have `CAN_USE_SPOTTER` privilege or does not own the specified conversation. |

        | 404 | Not Found — no conversation exists with the given `conversation_identifier` for the authenticated user. |

        | 422 | Unprocessable Entity — the request body is malformed or contains an invalid field value. |


        > ###### Note:

