openapi: 3.2.0
info:
  title: ThoughtSpot Public REST Email Customization API
  version: '2.0'
servers:
- url: '{base-url}'
  variables:
    base-url:
      default: https://localhost:443
security:
- bearerAuth: []
tags:
- name: Email Customization
paths:
  /api/rest/2.0/customization/email:
    post:
      operationId: createEmailCustomization
      description: 'Beta Version: 10.10.0.cl or later


        Creates a customization configuration for the notification email.


        #### Pre-requisites


        Requires `DEVELOPER` (**has developer privilege**) or `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the `DEVELOPER` (**Has developer privilege**) privilege is required.


        **NOTE**:This endpoint in currently in beta. Contact ThoughtSpot support to enable this on your instance.


        #### Usage guidelines


        To create a custom configuration pass these parameters in your API request:


        - A JSON map of configuration attributes `template_properties`. The following example shows a sample set of customization configuration:


        ```

        {

        {

        "cta_button_bg_color": "#444DEA",

        "cta_text_font_color": "#FFFFFF",

        "primary_bg_color": "#D3DEF0",

        "logo_url": "https://storage.pardot.com/710713/1642089901EbkRibJq/TS_fullworkmark_darkmode.png",

        "font_family": "",

        "product_name": "ThoughtSpot",

        "footer_address": "444 Castro St, Suite 1000 Mountain View, CA 94041",

        "footer_phone": "(800) 508-7008",

        "replacement_value_for_liveboard": "Dashboard",

        "replacement_value_for_answer": "Chart",

        "replacement_value_for_spot_iq": "AI Insights",

        "hide_footer_phone": false,

        "hide_footer_address": false,

        "hide_product_name": false,

        "hide_manage_notification": false,

        "hide_mobile_app_nudge": false,

        "hide_privacy_policy": false,

        "hide_ts_vocabulary_definitions": false,

        "hide_error_message": false,

        "hide_unsubscribe_link": false,

        "hide_notification_status": false,

        "hide_modify_alert": false,

        "company_website_url": "https://your-website.com/",

        "company_privacy_policy_url" : "https://link-to-privacy-policy.com/",

        "contact_support_url": "https://link-to-contact-support.com/",

        "hide_contact_support_url": false,

        "hide_logo_url" : false

        }

        }

        ```


        #### Endpoint URL'
      tags:
      - Email Customization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmailCustomizationRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEmailCustomizationResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Create email customization
      x-summary-source: derived
  /api/rest/2.0/customization/email/{template_identifier}/delete:
    post:
      operationId: deleteEmailCustomization
      description: 'Beta Version: 10.10.0.cl or later


        Deletes the configuration for the email customization.


        #### Pre-requisites


        Requires `DEVELOPER` (**has developer privilege**) or `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the `DEVELOPER` (**Has developer privilege**) privilege is required.


        **NOTE**:This endpoint in currently in beta. Contact ThoughtSpot support to enable this on your instance.


        #### Usage guidelines


        - Call the search API endpoint to get the `template_identifier` from the response.

        - Use that `template_identifier` as a parameter in this API request.


        #### Endpoint URL'
      deprecated: true
      tags:
      - Email Customization
      parameters:
      - in: path
        name: template_identifier
        required: true
        schema:
          type: string
        description: Unique ID or name of the email customization.
      responses:
        '204':
          description: Email Customization configuration successfully deleted.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Delete email customization
      x-summary-source: derived
  /api/rest/2.0/customization/email/delete:
    post:
      operationId: deleteOrgEmailCustomization
      description: 'Beta Version: 10.12.0.cl or later


        Deletes the configuration for the email customization.


        #### Pre-requisites


        Requires `DEVELOPER` (**has developer privilege**) or `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the `DEVELOPER` (**Has developer privilege**) privilege is required.


        **NOTE**:This endpoint in currently in beta. Contact ThoughtSpot support to enable this on your instance.


        #### Usage guidelines


        - Call the search API endpoint to get the `org_identifier` from the response.

        - Use that `org_identifier` as a parameter in this API request.


        #### Endpoint URL'
      tags:
      - Email Customization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteOrgEmailCustomizationRequest'
        required: true
      parameters: []
      responses:
        '204':
          description: Email Customization configuration successfully deleted.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Delete org email customization
      x-summary-source: derived
  /api/rest/2.0/customization/email/search:
    post:
      operationId: searchEmailCustomization
      description: 'Beta Version: 10.10.0.cl or later


        Search the email customization configuration if any set for the ThoughtSpot system.


        #### Pre-requisites


        Requires `DEVELOPER` (**has developer privilege**) or `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the `DEVELOPER` (**Has developer privilege**) privilege is required.


        **NOTE**:This endpoint in currently in beta. Contact ThoughtSpot support to enable this on your instance.


        #### Endpoint URL'
      tags:
      - Email Customization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchEmailCustomizationRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreateEmailCustomizationResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
