          description: Whether to hide notification status
          nullable: true
        hide_error_message:
          type: boolean
          description: Whether to hide error message
          nullable: true
        hide_unsubscribe_link:
          type: boolean
          description: Whether to hide unsubscribe link
          nullable: true
        hide_modify_alert:
          type: boolean
          description: Whether to hide modify alert
          nullable: true
        company_privacy_policy_url:
          type: string
          description: Company privacy policy URL (HTTP/HTTPS only)
          nullable: true
        company_website_url:
          type: string
          description: Company website URL (HTTP/HTTPS only)
          nullable: true
        contact_support_url:
          type: string
          description: 'Contact support url (HTTP/HTTPS only). <br/>  <span class="since-beta-tag">Version: 26.2.0.cl or later</span>'
          nullable: true
        hide_contact_support_url:
          type: boolean
          description: 'Whether to hide contact support url. <br/>  <span class="since-beta-tag">Version: 26.2.0.cl or later</span>'
          nullable: true
        hide_logo_url:
          type: boolean
          description: 'Whether to hide logo <br/>  <span class="since-beta-tag">Version: 26.4.0.cl or later</span>'
          nullable: true
      description: Email customization configuration properties
    FetchColumnSecurityRulesRequest:
      type: object
      properties:
        tables:
          description: Array of table identifier objects for which to fetch column security rules
          type: array
          items:
            $ref: '#/components/schemas/ColumnSecurityRuleTableInput'
      required:
      - tables
    UpdateEmailCustomizationRequest:
      type: object
      properties:
        template_properties:
          description: Email customization configuration as key value pair
          allOf:
          - $ref: '#/components/schemas/Template_Properties_Input_Create'
        org_identifier:
          description: Unique ID or name of org
          type: string
      required:
      - template_properties
    CreateCalendarRequest:
      type: object
      properties:
        name:
          description: Name of the custom calendar.
          type: string
        creation_method:
          description: Type of create operation.
          type: string
          enum:
          - FROM_INPUT_PARAMS
          - FROM_EXISTING_TABLE
        table_reference:
          description: 'Table reference containing connection identifier and table details in this format: `{"connection_identifier":"conn1", "database_name":"db1", "schema_name":"sc1", "table_name":"tb1"}`. The given table will be created if `creation_method` is set as `FROM_INPUT_PARAMS`.'
          allOf:
          - $ref: '#/components/schemas/ExternalTableInput'
        start_date:
          description: Start date for the calendar in `MM/dd/yyyy` format. This parameter is mandatory if `creation_method` is set as `FROM_INPUT_PARAMS`.
          type: string
        end_date:
          description: End date for the calendar in `MM/dd/yyyy` format. This parameter is mandatory if `creation_method` is set as `FROM_INPUT_PARAMS`.
          type: string
        calendar_type:
          description: Type of the calendar.
          default: MONTH_OFFSET
          type: string
          enum:
          - MONTH_OFFSET
          - FOUR_FOUR_FIVE
          - FOUR_FIVE_FOUR
          - FIVE_FOUR_FOUR
        month_offset:
          description: Specify the month in which the fiscal or custom calendar year should start. For example, if you set `month_offset` to "April", the custom calendar will treat "April" as the first month of the year, and the related attributes such as quarters and start date will be based on this offset. The default value is `January`, which represents the standard calendar year (January to December).
          default: January
          type: string
          enum:
          - January
          - February
          - March
          - April
          - May
          - June
          - July
          - August
          - September
          - October
          - November
          - December
        start_day_of_week:
          description: Specify the starting day of the week.
          default: Sunday
          type: string
          enum:
          - Sunday
          - Monday
          - Tuesday
          - Wednesday
          - Thursday
          - Friday
          - Saturday
        quarter_name_prefix:
          description: Prefix to add before the quarter.
          default: ''
          type: string
        year_name_prefix:
          description: Prefix to add before the year.
          default: ''
          type: string
      required:
      - name
      - creation_method
      - table_reference
    UserPrincipal:
      type: object
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
    UpdateConnectionConfigurationRequest:
      type: object
      properties:
        connection_identifier:
          description: Unique ID or name of the connection.
          type: string
        name:
          description: Name of the configuration to update.
          type: string
        description:
          description: Description of the configuration.
          type: string
        same_as_parent:
          description: 'Specifies whether the connection configuration should inherit all properties and authentication

            type from its parent connection. This attribute is only applicable to parameterized connections.

            When set to true, the configuration uses only the connection properties and authentication type

            inherited from the parent. <br/>  <span class="since-beta-tag">Version: 26.2.0.cl or later</span>'
          default: false
          type: boolean
          nullable: true
        policy_process_options:
          description: 'This attribute is only applicable to parameterized connections. Ensure that the policy is

            set to Processes to allow the configuration to be used exclusively for system processes. <br/>  <span class="since-beta-tag">Version: 26.2.0.cl or later</span>'
          allOf:
          - $ref: '#/components/schemas/PolicyProcessOptionsInput'
        authentication_type:
          description: Type of authentication.
          type: string
          enum:
          - SERVICE_ACCOUNT
          - OAUTH
          - OAUTH_WITH_SERVICE_PRINCIPAL
          - EXTOAUTH
          - KEY_PAIR
          - EXTOAUTH_WITH_PKCE
          - OAUTH_WITH_PKCE
          - PERSONAL_ACCESS_TOKEN
          - OAUTH_CLIENT_CREDENTIALS
          - OAUTH_CLIENT_CREDENTIALS_WITH_X509
        configuration:
          description: Configuration properties in JSON.
          type: object
        policy_type:
          description: Type of policy.
          type: string
          enum:
          - NO_POLICY
          - PRINCIPALS
          - PROCESSES
        policy_principals:
          description: Unique ID or name of the User and User Groups.
          type: array
          items:
            type: string
        policy_processes:
          description: Action that the query performed on the data warehouse, such as SAGE_INDEXING, ROW_COUNT_STATS, and SCHEDULED_LIVEBOARDS.
          type: array
          items:
            type: string
            enum:
            - SAGE_INDEXING
            - ROW_COUNT_STATS
            - SCHEDULED_LIVEBOARDS
        disable:
          description: Indicates whether the configuration enable/disable.
          default: false
          type: boolean
          nullable: true
      required:
      - connection_identifier
    ColumnSecurityRuleResponse:
      type: object
      properties:
        table_guid:
          type: string
          description: GUID of the table for which the column security rules are fetched
          nullable: true
        obj_id:
          type: string
          description: Object ID of the table for which the column security rules are fetched
          nullable: true
        column_security_rules:
          type: array
          items:
            $ref: '#/components/schemas/ColumnSecurityRule'
          description: Array containing column security rule objects
          nullable: true
    DeleteOrgEmailCustomizationRequest:
      type: object
      properties:
        org_identifiers:
          description: Unique identifier of the organization.
          type: array
          items:
            type: string
    ColumnSecurityRuleSourceTable:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: The unique identifier of the source table
        name:
          type: string
          description: The name of the source table
    ColumnSecurityRule:
      type: object
      required:
      - column
      properties:
        column:
          $ref: '#/components/schemas/ColumnSecurityRuleColumn'
          description: Information about the column
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ColumnSecurityRuleGroup'
          description: Array of groups that have access to this column
          nullable: true
        source_table_details:
          $ref: '#/components/schemas/ColumnSecurityRuleSourceTable'
          description: Information about the source table
          nullable: true
    SortOption:
      type: object
      properties:
        field_name:
          type: string
          enum:
          - DEFAULT
          - NAME
          - DISPLAY_NAME
          - AUTHOR
          - CREATED
          - MODIFIED
          default: DEFAULT
          description: Name of the field to apply the sort on.
          nullable: true
        order:
          type: string
          enum:
          - ASC
          - DESC
          default: ASC
          description: 'Sort order : ASC(Ascending) or DESC(Descending).'
          nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
