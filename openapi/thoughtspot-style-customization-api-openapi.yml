  /api/rest/2.0/customization/styles/fonts/upload:
    post:
      operationId: uploadStyleFont
      description: 'Version: 26.7.0.cl or later


        Uploads a custom font to the cluster-level or org-level font library. Cluster-level fonts are available as defaults for all orgs. Org-level fonts are only available within that org.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) or `DEVELOPER` (**Has developer privilege**) privilege.


        #### Usage guidelines


        - Only **WOFF** and **WOFF2** font formats are accepted. TTF and OTF files are rejected with an error.

        - Set `scope` to `CLUSTER` to upload to the cluster-level library. Set `scope` to `ORG` (default) to upload to the authenticated user''s org library.

        - `weight` defaults to `NORMAL` if omitted. Supported values: `NORMAL`, `LIGHT`, `BOLD`.

        - `style` defaults to `NORMAL` if omitted. Supported values: `NORMAL`, `ITALIC`, `OBLIQUE`.

        - `color` defaults to `#000000` (black) if omitted. Provide as a 6-digit hex string (e.g. `#333333`).

        - The uploaded font can be assigned to visualization areas using the `updateStyleCustomization` endpoint.


        #### Endpoint URL'
      tags:
      - Style Customization
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                scope:
                  description: 'Scope of the font library to upload to. CLUSTER uploads to the

                    cluster-level library, making the font available as a default for all

                    orgs. ORG uploads to the authenticated user''s org library. Defaults to

                    ORG if omitted.'
                  default: ORG
                  type: string
                  enum:
                  - CLUSTER
                  - ORG
                name:
                  description: Display name for the font (e.g. "Acme Sans").
                  type: string
                weight:
                  description: 'Weight of the font. Supported values: NORMAL, LIGHT, BOLD. Defaults to

                    NORMAL if omitted.'
                  default: NORMAL
                  type: string
                  enum:
                  - NORMAL
                  - LIGHT
                  - BOLD
                style:
                  description: 'Style of the font. Supported values: NORMAL, ITALIC, OBLIQUE. Defaults

                    to NORMAL if omitted.'
                  default: NORMAL
                  type: string
                  enum:
                  - NORMAL
                  - ITALIC
                  - OBLIQUE
                color:
                  description: 'Color of the font as a 6-digit hex string (e.g. "#333333"). Defaults to

                    #000000 (black) if omitted. Returns an error if the value is malformed.'
                  type: string
                file_content:
                  description: 'Binary WOFF or WOFF2 font file to upload. Only WOFF and WOFF2 formats

                    are accepted; TTF and OTF are rejected. The file is validated on upload.'
                  type: string
                  format: binary
              required:
              - name
              - file_content
        required: true
      parameters: []
      responses:
        '200':
          description: Font uploaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleFontUploadData'
              examples:
                example_1:
                  value:
                    id: c3d4e5f6-1111-1111-1111-111111111111
                    name: Acme Sans
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_request:
                  summary: Invalid request
                  value:
                    error:
                      message:
                        code: 10002
                        incident_id_guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        trace_id_guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        debug: Unsupported font format. Only WOFF and WOFF2 are accepted.
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized_access:
                  summary: Unauthorized access
                  value:
                    error:
                      message:
                        code: 10097
                        incident_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        trace_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        debug: Authentication required to upload a custom font to the font library.
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden_access:
                  summary: Forbidden access
                  value:
                    error:
                      message:
                        code: 10023
                        incident_id_guid: c3d4e5f6-7890-1234-cdef-345678901234
                        trace_id_guid: c3d4e5f6-7890-1234-cdef-345678901234
                        debug: Cluster config can only be accessed from PRIMARY org.
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unexpected_error:
                  summary: Unexpected error
                  value:
                    error:
                      message:
                        code: 10038
                        incident_id_guid: d4e5f678-9012-3456-defa-456789012345
                        trace_id_guid: d4e5f678-9012-3456-defa-456789012345
                        debug: Unexpected server error while uploading the custom font.
      summary: Upload style font
