  /api/rest/2.0/customization/styles/update:
    post:
      operationId: updateStyleCustomization
      description: 'Version: 26.7.0.cl or later


        Updates style preferences at cluster level or for the authenticated user''s org, including navigation panel color, chart color palette, embedded footer text, logo, and font assignments per visualization area. Cluster-level preferences serve as defaults for all orgs. Org-level preferences override cluster defaults. Resetting an Org-level preference falls back to Cluster-level preference, which on reset falls back to system defaults.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) or `DEVELOPER` (**Has developer privilege**) privilege.


        #### Usage guidelines


        Two operations are supported via the `operation` field:


        - **REPLACE** (default): Applies the fields provided in the request. Omitted fields remain unchanged.

        - **RESET**: Reverts specific fields to defaults. Specify which fields to reset using `reset_options.style` (for style fields) and `reset_options.visualization_areas` (for font assignments). Fields not listed in `reset_options` are not affected.


        #### Logo upload


        Logo files are uploaded as binary fields using `multipart/form-data`:


        - `default_logo`: Square app icon and favicon. Recommended size: 140×140 px. Accepted formats: PNG, JPG.

        - `wide_logo`: Horizontal top nav bar logo. Recommended size: 230×45 px. Accepted formats: PNG, JPG.


        To reset a logo to the default, use `operation: RESET` with `reset_options.style` set to `DEFAULT_LOGO` or `WIDE_LOGO`.


        #### Navigation panel color


        Set `navigation_panel.theme` to one of:


        - `DARK`: Default dark theme.

        - `TWO_TONE`: Dual-tone panel style.

        - `CUSTOM`: User-defined color. Provide `navigation_panel.base_color` as a 6-digit hex string (e.g. `#2359B6`).


        #### Chart color palette


        Provide exactly 8 color entries in `chart_color_palette.colors`. Each entry requires a `primary` hex color. If `secondary` shades are omitted, the server auto-generates 4 shades from the primary color.


        #### Font assignments


        Specify `visualization_fonts.chart_visualization_fonts`, `visualization_fonts.table_visualization_fonts`, and `visualization_fonts.advanced_chart_visualization_fonts` to assign custom fonts to specific visualization areas. Only provide the areas you want to update; omitted areas remain unchanged.


        #### Endpoint URL'
      tags:
      - Style Customization
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                scope:
                  description: 'Scope at which to apply the preferences. CLUSTER sets cluster-level

                    defaults for all orgs. ORG applies to the authenticated user''s org.'
                  default: ORG
                  type: string
                  enum:
                  - CLUSTER
                  - ORG
                operation:
                  description: 'Operation to perform. REPLACE (default) applies the provided fields and

                    leaves omitted fields unchanged. RESET reverts fields listed in

                    reset_options to defaults.'
                  default: REPLACE
                  type: string
                  enum:
                  - REPLACE
                  - RESET
                reset_options:
                  description: 'Fields to reset when operation is RESET. Specify style fields and

                    visualization areas to revert to defaults.'
                  allOf:
                  - $ref: '#/components/schemas/StyleResetOptionsInput'
                navigation_panel:
                  description: 'Navigation panel color. Provide theme and, when theme is CUSTOM, also

                    provide base_color.'
                  allOf:
                  - $ref: '#/components/schemas/NavigationPanelInput'
                chart_color_palette:
                  description: 'Chart color palette. When provided with operation REPLACE, exactly 8

                    color entries must be specified in colors.'
                  allOf:
                  - $ref: '#/components/schemas/StyleColorPaletteInput'
                embedded_footer_text:
                  description: 'Custom footer text for the embedded application. An empty

                    string clears the footer.'
                  type: string
                visualization_fonts:
                  description: 'Font assignments per visualization area. Provide only the areas to

                    update; omitted areas remain unchanged.'
                  allOf:
                  - $ref: '#/components/schemas/VisualizationFontsInput'
                default_logo:
                  description: 'Binary image for the DEFAULT logo slot (square app icon and favicon;

                    recommended 140x140 px). Accepted formats: PNG, JPG.'
                  type: string
                  format: binary
                wide_logo:
                  description: 'Binary image for the WIDE logo slot (horizontal top nav bar logo;

                    recommended 230x45 px). Accepted formats: PNG, JPG.'
                  type: string
                  format: binary
              required:
              - scope
            encoding:
              reset_options:
                contentType: application/json
              navigation_panel:
                contentType: application/json
              chart_color_palette:
                contentType: application/json
              visualization_fonts:
                contentType: application/json
        required: true
      parameters: []
      responses:
        '204':
          description: Style preferences updated successfully.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_request:
                  summary: Invalid request
                  value:
                    error:
                      message:
                        code: 10002
                        incident_id_guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        trace_id_guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        debug: chart_color_palette must specify exactly 8 color entries when operation is REPLACE.
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized_access:
                  summary: Unauthorized access
                  value:
                    error:
                      message:
                        code: 10097
                        incident_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        trace_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        debug: Authentication required to update style customization preferences.
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden_access:
