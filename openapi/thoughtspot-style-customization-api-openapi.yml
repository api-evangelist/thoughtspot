  /api/rest/2.0/customization/styles/fonts/search:
    post:
      operationId: searchStyleFonts
      description: 'Version: 26.7.0.cl or later


        Returns custom fonts from the cluster-level or org-level font library. Omitting all filter fields returns all fonts in the target scope.


        When `include_font_assignments` is `true`, the response includes only the visualization areas explicitly assigned to each font. For cluster-scoped fonts, `org` is returned as `null`.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) or `DEVELOPER` (**Has developer privilege**) privilege.


        #### Usage guidelines


        - Set `scope` to `CLUSTER` to search the cluster-level library. Set `scope` to `ORG` (default) to search the authenticated user''s org library.

        - Use `font_identifier` to look up a specific font by UUID or name.

        - Use `name_pattern` for partial, case-insensitive name matching.

        - Set `include_font_assignments` to `true` to include visualization areas this font is currently assigned to. Defaults to `false`.


        #### Endpoint URL'
      tags:
      - Style Customization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchStyleFontsRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Custom fonts retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StyleFontRecord'
              examples:
                example_1:
                  value:
                  - id: c3d4e5f6-1111-1111-1111-111111111111
                    scope: ORG
                    org:
                      id: 1234567890
                      name: Sales
                    name: Acme Sans
                    weight: NORMAL
                    style: NORMAL
                    color: '#333333'
                    creation_time_in_millis: 1714000000000
                    assignments:
                    - org:
                        id: 1234567890
                        name: Sales
                      visualization_areas:
                      - CHART_X_AXIS_LABELS
                      - CHART_Y_AXIS_LABELS
                  - id: d4e5f6a7-2222-2222-2222-222222222222
                    scope: CLUSTER
                    name: Corporate Bold
                    weight: BOLD
                    style: NORMAL
                    color: '#000000'
                    creation_time_in_millis: 1713500000000
                    assignments: []
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_request:
                  summary: Invalid request
                  value:
                    error:
                      message:
                        code: 10002
                        incident_id_guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        trace_id_guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        debug: Only one of 'font_identifier' or 'name_pattern' may be provided.
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized_access:
                  summary: Unauthorized access
                  value:
                    error:
                      message:
                        code: 10097
                        incident_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        trace_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        debug: Authentication required to search the cluster-level or org-level font library.
        '403':
          description: Forbidden access.
          content:
