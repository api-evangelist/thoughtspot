          - CHART_X_AXIS_TITLE
          - CHART_Y_AXIS_LABELS
          - CHART_Y_AXIS_TITLE
          - CHART_TOOLTIP
          - CHART_SCATTER_DATA_LABELS
          - CHART_DONUT_DATA_LABELS
          - CHART_LINE_DATA_LABELS
          - CHART_COLUMN_DATA_LABELS
          - CHART_BAR_DATA_LABELS
          - CHART_AREA_DATA_LABELS
          description: Chart visualization area.
        font_id:
          type:
          - string
          - 'null'
          description: 'UUID of the font assigned to this area. Null when the system default font

            is active.'
        font_name:
          type:
          - string
          - 'null'
          description: 'Display name of the font assigned to this area. Null when the system

            default font is active.'
        is_overridden:
          type:
          - boolean
          - 'null'
          description: True if explicitly set at this scope, overriding any inherited value.
      description: Font assignment for a chart visualization area in the response.
    StyleLogoSlot:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: UUID of the active logo.
        is_overridden:
          type:
          - boolean
          - 'null'
          description: 'True if a custom logo is uploaded at this scope. False if the system

            default or cluster logo is active.'
      description: Status of a single logo slot.
    ErrorResponse:
      type: object
      properties:
        error:
          type:
          - object
          - 'null'
    StyleColorEntry:
      type: object
      properties:
        primary:
          type:
          - string
          - 'null'
          description: Primary color as a 6-digit hex string.
        secondary:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Array of 4 secondary shade hex strings.
      description: A single color entry in the chart color palette.
    AdvancedChartFontAssignmentInput:
      type: object
      required:
      - visualization_area
      - font_identifier
      properties:
        visualization_area:
          type: string
          enum:
          - ADVANCED_CHART_LABELS
          description: 'Advanced chart visualization area to assign the font to. <br/>  <span class="since-beta-tag">Version: 26.7.0.cl or later</span>'
        font_identifier:
          type: string
          description: 'UUID or name of the font to assign to this area. <br/>  <span class="since-beta-tag">Version: 26.7.0.cl or later</span>'
      description: Font assignment for a single advanced chart visualization area.
    StyleResetOptionsInput:
      type: object
      properties:
        style:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - CHART_COLOR_PALETTE
            - EMBEDDED_FOOTER_TEXT
            - NAV_PANEL_COLOR
            - DEFAULT_LOGO
            - WIDE_LOGO
          description: 'Style fields to reset. Supported values: CHART_COLOR_PALETTE,

            EMBEDDED_FOOTER_TEXT, NAV_PANEL_COLOR, DEFAULT_LOGO, WIDE_LOGO.'
        visualization_areas:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - CHART_X_AXIS_LABELS
            - CHART_X_AXIS_TITLE
            - CHART_Y_AXIS_LABELS
            - CHART_Y_AXIS_TITLE
            - CHART_TOOLTIP
            - CHART_SCATTER_DATA_LABELS
            - CHART_DONUT_DATA_LABELS
            - CHART_LINE_DATA_LABELS
            - CHART_COLUMN_DATA_LABELS
            - CHART_BAR_DATA_LABELS
            - CHART_AREA_DATA_LABELS
            - TABLE_VALUE_CELLS
            - ADVANCED_CHART_LABELS
          description: 'Visualization areas whose font assignments should revert to the system

            default font.'
      description: Fields to revert to defaults when operation is RESET.
    UpdateStyleFontRequest:
      type: object
      properties:
        scope:
          description: 'Scope of the font library containing this font. CLUSTER targets the

            cluster-level library. ORG targets the authenticated user''s org library.

            Defaults to ORG if omitted.'
          default: ORG
          type: string
          enum:
          - CLUSTER
          - ORG
        name:
          description: New display name for the font.
          type: string
        weight:
          description: 'New weight for the font. Supported values: NORMAL, LIGHT, BOLD.'
          type: string
          enum:
          - NORMAL
          - LIGHT
          - BOLD
        style:
          description: 'New style for the font. Supported values: NORMAL, ITALIC, OBLIQUE.'
          type: string
          enum:
          - NORMAL
          - ITALIC
          - OBLIQUE
        color:
          description: 'New color for the font as a 6-digit hex string (e.g. "#333333"). Returns

            an error if the value is malformed.'
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
