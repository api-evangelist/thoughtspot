  /api/rest/2.0/customization/styles/fonts/{font_identifier}/update:
    post:
      operationId: updateStyleFont
      description: 'Version: 26.7.0.cl or later


        Updates the metadata of an existing custom font in the cluster-level or org-level font library. Only the fields provided in the request are modified; omitted fields remain unchanged.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) or `DEVELOPER` (**Has developer privilege**) privilege.


        #### Usage guidelines


        - Identify the font using `font_identifier` (UUID or name).

        - Set `scope` to `CLUSTER` to target the cluster-level library. Set `scope` to `ORG` (default) to target the authenticated user''s org library.

        - To replace the font file itself (WOFF/WOFF2 binary), delete the existing font and re-upload using `uploadStyleFont`.

        - `color` must be a valid 6-digit hex string (e.g. `#333333`) if provided.


        #### Endpoint URL'
      tags:
      - Style Customization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStyleFontRequest'
        required: true
      parameters:
      - in: path
        name: font_identifier
        required: true
        schema:
          type: string
        description: UUID or name of the font to update.
      responses:
        '204':
          description: Font metadata updated successfully.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_request:
                  summary: Invalid request
                  value:
