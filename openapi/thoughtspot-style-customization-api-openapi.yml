openapi: 3.2.0
info:
  title: ThoughtSpot Public REST Style Customization API
  version: '2.0'
servers:
- url: '{base-url}'
  variables:
    base-url:
      default: https://localhost:443
security:
- bearerAuth: []
tags:
- name: Style Customization
paths:
  /api/rest/2.0/customization/styles/fonts/delete:
    post:
      operationId: deleteStyleFonts
      description: 'Version: 26.7.0.cl or later


        Deletes one or more custom fonts from the cluster-level or org-level font library. If a deleted font is assigned to visualization areas, those assignments automatically fallback to the cluster/system default font. The response lists all affected areas where the font was explicitly set. Note: dry_run defaults to true. To actually delete fonts, you must explicitly pass dry_run: false.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) or `DEVELOPER` (**Has developer privilege**) privilege.


        #### Usage guidelines


        - Provide one or more font UUIDs or names in `font_identifiers`.

        - Set `scope` to `CLUSTER` to delete from the cluster-level library. Set `scope` to `ORG` (default) to delete from the authenticated user''s org library.

        - Use `dry_run: true` to preview which visualization areas would be affected without actually deleting the font. The response lists affected assignments; no changes are applied.

        - Deletions cannot be undone. Re-upload the font file using `uploadStyleFont` if needed.


        #### Endpoint URL'
      tags:
      - Style Customization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteStyleFontsRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Font deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleFontDeleteData'
              examples:
                example_1:
                  summary: Font deleted with affected assignments
                  value:
                    affected_assignments:
                    - org:
                        id: 1234567890
                        name: Sales
                      visualization_areas:
                      - CHART_X_AXIS_LABELS
                      - CHART_Y_AXIS_LABELS
                example_2:
                  summary: Font deleted with no affected assignments
                  value:
                    affected_assignments: []
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_request:
                  summary: Invalid request
                  value:
                    error:
                      message:
                        code: 10002
                        incident_id_guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        trace_id_guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        debug: Field 'font_identifiers' must contain at least one identifier.
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized_access:
                  summary: Unauthorized access
                  value:
                    error:
                      message:
                        code: 10097
                        incident_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        trace_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        debug: Authentication required to delete custom fonts from the font library.
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden_access:
                  summary: Forbidden access
                  value:
                    error:
                      message:
                        code: 10023
                        incident_id_guid: c3d4e5f6-7890-1234-cdef-345678901234
                        trace_id_guid: c3d4e5f6-7890-1234-cdef-345678901234
                        debug: Only Tenant admin can delete cluster-level fonts.
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unexpected_error:
                  summary: Unexpected error
                  value:
                    error:
                      message:
                        code: 10038
                        incident_id_guid: d4e5f678-9012-3456-defa-456789012345
                        trace_id_guid: d4e5f678-9012-3456-defa-456789012345
                        debug: Unexpected server error while deleting fonts from the font library.
      summary: Delete style fonts
      x-summary-source: derived
  /api/rest/2.0/customization/styles/logos/export:
    post:
      operationId: exportStyleLogos
      description: 'Version: 26.7.0.cl or later


        Downloads the active logos (default and wide slots) at the requested scope as a single ZIP archive containing both logo image files. If no custom logo has been uploaded at the ORG scope, the archive contains the resolved logo falling through from the cluster. If no cluster logo has been uploaded, no file is returned.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) or `DEVELOPER` (**Has developer privilege**) privilege.


        #### Usage guidelines


        - Set `scope` to `CLUSTER` to download cluster-level logos.

        - Set `scope` to `ORG` (default) to download logos for the authenticated user''s org.

        - The response is a ZIP archive (`application/zip`). Save the response body directly to a `.zip` file.

        - The archive always contains two files — one for the DEFAULT slot and one for the WIDE slot — even if no custom logo is set at the requested scope.


        #### Endpoint URL'
      tags:
      - Style Customization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportStyleLogosRequest'
        required: true
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
          enum:
          - application/zip
          default: application/zip
      responses:
        '200':
          description: Logo ZIP archive retrieved successfully.
          content:
            application/zip: {}
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized_access:
                  summary: Unauthorized access
                  value:
                    error:
                      message:
                        code: 10097
                        incident_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        trace_id_guid: b2c3d4e5-f678-9012-bcde-f23456789012
                        debug: Authentication required to export style logos.
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden_access:
                  summary: Forbidden access
                  value:
                    error:
                      message:
                        code: 10023
                        incident_id_guid: c3d4e5f6-7890-1234-cdef-345678901234
                        trace_id_guid: c3d4e5f6-7890-1234-cdef-345678901234
                        debug: Cluster-level logos can only be exported from PRIMARY org.
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unexpected_error:
                  summary: Unexpected error
                  value:
                    error:
                      message:
                        code: 10038
                        incident_id_guid: d4e5f678-9012-3456-defa-456789012345
                        trace_id_guid: d4e5f678-9012-3456-defa-456789012345
                        debug: Unexpected server error while exporting style logos.
      summary: Export style logos
      x-summary-source: derived
