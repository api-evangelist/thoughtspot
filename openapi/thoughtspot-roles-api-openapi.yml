openapi: 3.2.0
info:
  title: ThoughtSpot Public REST Roles API
  version: '2.0'
servers:
- url: '{base-url}'
  variables:
    base-url:
      default: https://localhost:443
security:
- bearerAuth: []
tags:
- name: Roles
paths:
  /api/rest/2.0/roles/create:
    post:
      operationId: createRole
      description: 'Version: 9.5.0.cl or later


        Creates a Role object in ThoughtSpot.


        Available only if Role-Based Access Control (RBAC) is enabled on your instance. To create a Role, the `ROLE_ADMINISTRATION` (**Can manage roles**) privilege is required.


        #### Endpoint URL'
      tags:
      - Roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Role successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Create role
      x-summary-source: derived
  /api/rest/2.0/roles/{role_identifier}/delete:
    post:
      operationId: deleteRole
      description: 'Version: 9.5.0.cl or later


        Deletes a Role object from the ThoughtSpot system.


        Available only if Role-Based Access Control (RBAC) is enabled on your instance. To delete a Role, the `ROLE_ADMINISTRATION` (**Can manage roles**) privilege is required.


        #### Endpoint URL'
      tags:
      - Roles
      parameters:
      - in: path
        name: role_identifier
        required: true
        schema:
          type: string
        description: Unique ID or name of the Role. ReadOnly roles cannot be deleted.
      responses:
        '204':
          description: Role successfully deleted.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Delete role
      x-summary-source: derived
  /api/rest/2.0/roles/search:
    post:
      operationId: searchRoles
      description: 'Version: 9.5.0.cl or later


        Gets a list of Role objects from the ThoughtSpot system.


        Available if Role-Based Access Control (RBAC) is enabled on your instance. To search for Roles, the `ROLE_ADMINISTRATION` (**Can manage roles**) privilege is required.


        To get details of a specific Role object, specify the GUID or name. You can also filter the API response based on user group and Org identifiers, privileges assigned to the Role, and deprecation status.


        **NOTE**: In addition to the GUID and name, `role_identifiers` accepts a Custom object ID if one is configured for the role. The response also includes the `obj_id` field for each role that has one set.


        #### Endpoint URL'
      tags:
      - Roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRolesRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Roles search result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchRoleResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Search roles
      x-summary-source: derived
  /api/rest/2.0/roles/{role_identifier}/update:
    post:
      operationId: updateRole
      description: 'Version: 9.5.0.cl or later


        Updates the properties of a Role object.


        Available only if Role-Based Access Control (RBAC) is enabled on your instance. To update a Role, the `ROLE_ADMINISTRATION` (**Can manage roles**) privilege is required.


        #### Endpoint URL'
      tags:
      - Roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
        required: true
      parameters:
      - in: path
        name: role_identifier
        required: true
        schema:
          type: string
        description: Unique ID or name of the Role.
      responses:
        '200':
          description: Role successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Update role
      x-summary-source: derived
