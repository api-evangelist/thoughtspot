      type: object
      properties:
        status:
          description: Status to set for the connection. Use ACTIVATED to enable the connection or DEACTIVATED to disable it.
          default: ACTIVATED
          type: string
          enum:
          - ACTIVATED
          - DEACTIVATED
    FetchConnectionDiffStatusResponse:
      type: object
      properties:
        status:
          type:
          - boolean
          - 'null'
          description: Status of the connection diff.
    SortOptionInput:
      type: object
      properties:
        field_name:
          type:
          - string
          - 'null'
          enum:
          - NAME
          - DISPLAY_NAME
          - AUTHOR
          - CREATED
          - MODIFIED
          - LAST_ACCESSED
          - SYNCED
          - VIEWS
          - USER_STATE
          - ROW_COUNT
          description: Name of the field to apply the sort on.
        order:
          type:
          - string
          - 'null'
          enum:
          - ASC
          - DESC
          description: 'Sort order : ASC(Ascending) or DESC(Descending).'
