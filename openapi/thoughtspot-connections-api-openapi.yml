          description: Configuration of the data warehouse in JSON.
          type: object
        validate:
          description: Indicates whether to validate the connection details.
          default: true
          type:
          - boolean
          - 'null'
    ConnectionInput:
      type: object
      properties:
        identifier:
          type:
          - string
          - 'null'
          description: Unique ID or name of the connection.
