      properties:
        name:
          type: string
          description: Name of the schema.
        tables:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Table'
          description: Tables in the schema.
    Database:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the database.
        schemas:
          type:
          - array
          - 'null'
          items:
