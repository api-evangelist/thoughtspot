          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Delete connection V2
      x-summary-source: derived
  /api/rest/2.0/connections/download-connection-metadata-changes/{connection_identifier}:
    post:
      operationId: downloadConnectionMetadataChanges
      description: 'Version: 9.9.0.cl or later


        Exports the difference in connection metadata between CDW and ThoughtSpot


        Requires `DATAMANAGEMENT` (**Can manage data**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the following Data control privileges may be required:

        - `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)

        - `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)

        - `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)


        To download the connection metadata difference between ThoughtSpot and CDW, pass the connection GUID as `connection_identifier` in the API request.


        #### Endpoint URL'
      tags:
      - Connections
      parameters:
      - in: path
        name: connection_identifier
        required: true
        schema:
          type: string
        description: GUID of the connection
      responses:
        '200':
          description: Export metadata changes.
          content:
            application/octet-stream: {}
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Download connection metadata changes
      x-summary-source: derived
  /api/rest/2.0/connections/fetch-connection-diff-status/{connection_identifier}:
    post:
      operationId: fetchConnectionDiffStatus
      description: 'Version: 9.9.0.cl or later


        Validates the difference in connection metadata between CDW and ThoughtSpot.


        Requires `DATAMANAGEMENT` (**Can manage data**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the following Data control privileges may be required:


        - `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)

        - `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)

        - `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)


        Returns a boolean indicating whether there is any difference between the connection metadata at ThoughtSpot and CDW.


        To get the connection metadata difference status, pass the connection GUID as `connection_identifier` in the API request.


        #### Endpoint URL'
      tags:
      - Connections
      parameters:
      - in: path
        name: connection_identifier
        required: true
        schema:
          type: string
        description: GUID of the connection
      responses:
        '200':
          description: true/false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchConnectionDiffStatusResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Fetch connection diff status
      x-summary-source: derived
  /api/rest/2.0/connections/{connection_identifier}/revoke-refresh-tokens:
    post:
      operationId: revokeRefreshTokens
      description: 'Version: 26.2.0.cl or later


        Revokes OAuth refresh tokens for users who no longer require access to a data warehouse connection.

        When a token is revoked, the affected user''s session for that connection is terminated, and they must re-authenticate to regain access.


        Requires `ADMINISTRATION` (**Can administer ThoughtSpot**) or `DATAMANAGEMENT` (**Can manage data**) privileges.

        If Role-Based Access Control (RBAC) is enabled on the ThoughtSpot instance, users with `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**) privilege can also make API requests to revoke tokens for connection users.


        #### Usage guidelines


        You can specify different combinations of identifiers to control which refresh tokens are revoked.


        - **connection_identifier**: Revokes refresh tokens for all users of the connection, except the connection author.

        - **connection_identifier** and **user_identifiers**: Revokes refresh tokens only for the users specified in the request. If the name or ID of the connection author is included in the request, their token will also be revoked.

        - **connection_identifier** and **configuration_identifiers**: Revokes refresh tokens for all users on the specified configurations, except the configuration author.

        - **connection_identifier**, **configuration_identifiers**, and **user_identifiers**: Revokes refresh tokens for the specified users on the specified configurations.

        - **connection_identifier** and **org_identifiers**: Revokes refresh tokens for the specified Orgs. Applicable only for published connections.

        - **connection_identifier**, **org_identifiers**, and **user_identifiers**: Revokes refresh tokens for the specified users in the specified Orgs. Applicable only for published connections.


        **NOTE**: The `org_identifiers` parameter is only applicable for published connections. Using this parameter for unpublished connections will result in an error. Ensure that the connections are published before making the API request.


        #### Endpoint URL'
      tags:
      - Connections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRefreshTokensRequest'
        required: true
      parameters:
      - in: path
        name: connection_identifier
        required: true
        schema:
          type: string
        description: Unique ID or name of the connection whose refresh tokens need to be revoked. All the users associated with the connection will have their refresh tokens revoked except the author.
      responses:
        '200':
          description: Token(s) successfully revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeRefreshTokensResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Object not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Revoke refresh tokens
      x-summary-source: derived
  /api/rest/2.0/connection/search:
