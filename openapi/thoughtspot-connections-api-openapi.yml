      summary: Update connection V2
      x-summary-source: derived
components:
  schemas:
    SearchConnectionResponse:
      type: object
      required:
      - id
      - name
      - data_warehouse_type
      properties:
        id:
          type: string
          description: Unique ID of the connection.
        name:
          type: string
          description: Name of the connection.
        obj_id:
          type:
          - string
          - 'null'
          description: 'Custom object ID (obj_id) of the connection, if one is set. <br/>  <span class="since-beta-tag">Version: 26.9.0.cl or later</span>'
        description:
          type:
          - string
          - 'null'
          description: Description of the connection.
        data_warehouse_type:
          type: string
          enum:
          - SNOWFLAKE
          - AMAZON_REDSHIFT
          - GOOGLE_BIGQUERY
          - AZURE_SYNAPSE
          - TERADATA
          - SAP_HANA
          - STARBURST
          - ORACLE_ADW
          - DATABRICKS
          - DENODO
          - DREMIO
          - TRINO
          - PRESTO
          - POSTGRES
          - SQLSERVER
          - MYSQL
          - GENERIC_JDBC
          - AMAZON_RDS_POSTGRESQL
          - AMAZON_AURORA_POSTGRESQL
          - AMAZON_RDS_MYSQL
          - AMAZON_AURORA_MYSQL
          - LOOKER
          - AMAZON_ATHENA
          - SINGLESTORE
          - GCP_SQLSERVER
          - GCP_ALLOYDB_POSTGRESQL
          - GCP_POSTGRESQL
          - GCP_MYSQL
          - MODE
          - GOOGLE_SHEETS
          - FALCON
          - FALCON_ONPREM
          - CLICKHOUSE
          - IOMETE
          description: Type of data warehouse.
        data_warehouse_objects:
          $ref: '#/components/schemas/DataWarehouseObjects'
          description: List of Data warehouse objects
        details:
          type:
          - object
          - 'null'
          description: Details of the connection.
    SearchConnectionRequest:
      type: object
      properties:
        connections:
          description: List of connections and name pattern
          type: array
          items:
            $ref: '#/components/schemas/ConnectionInput'
        data_warehouse_types:
          description: Array of types of data warehouse defined for the connection.
          type: array
          items:
            type: string
            enum:
            - SNOWFLAKE
            - AMAZON_REDSHIFT
            - GOOGLE_BIGQUERY
            - AZURE_SYNAPSE
            - TERADATA
            - SAP_HANA
            - STARBURST
            - ORACLE_ADW
            - DATABRICKS
            - DENODO
            - DREMIO
            - TRINO
            - PRESTO
            - POSTGRES
            - SQLSERVER
            - MYSQL
            - GENERIC_JDBC
            - AMAZON_RDS_POSTGRESQL
            - AMAZON_AURORA_POSTGRESQL
            - AMAZON_RDS_MYSQL
            - AMAZON_AURORA_MYSQL
            - LOOKER
            - AMAZON_ATHENA
            - SINGLESTORE
            - GCP_SQLSERVER
            - GCP_ALLOYDB_POSTGRESQL
            - GCP_POSTGRESQL
            - GCP_MYSQL
            - MODE
            - GOOGLE_SHEETS
            - FALCON
            - FALCON_ONPREM
            - CLICKHOUSE
            - IOMETE
        record_offset:
          description: The starting record number from where the records should be included.
          default: 0
          type: integer
          format: int32
        record_size:
          description: The number of records that should be included.
          default: 10
          type: integer
          format: int32
        tag_identifiers:
          description: Unique ID or name of tags.
          type: array
          items:
            type: string
        data_warehouse_object_type:
          description: Data warehouse object type.
          type: string
          enum:
          - DATABASE
          - SCHEMA
          - TABLE
          - COLUMN
        sort_options:
          description: Sort options.
          allOf:
          - $ref: '#/components/schemas/SortOptionInput'
        include_details:
          description: Indicates whether to include complete details of the connection objects.
          type:
          - boolean
          - 'null'
        configuration:
          description: 'Configuration values. If empty we are fetching configuration from datasource based on given connection id. If required you can provide config details to fetch specific details. Example input: {}, {"warehouse":"SMALL_WH","database":"DEVELOPMENT"}. This is only applicable when data_warehouse_object_type is selected.'
          type: object
        authentication_type:
          description: List of authentication types to fetch data_ware_house_objects from external Data warehouse. This is only applicable when data_warehouse_object_type is selected.
          default: SERVICE_ACCOUNT
          type: string
          enum:
          - SERVICE_ACCOUNT
          - OAUTH
          - IAM
          - EXTOAUTH
          - OAUTH_WITH_SERVICE_PRINCIPAL
          - PERSONAL_ACCESS_TOKEN
          - KEY_PAIR
          - OAUTH_WITH_PKCE
          - EXTOAUTH_WITH_PKCE
          - OAUTH_WITH_PEZ
          - OAUTH_CLIENT_CREDENTIALS
          - OAUTH_CLIENT_CREDENTIALS_WITH_X509
        show_resolved_parameters:
          description: '<div><span class="since-beta-tag">Version: 10.9.0.cl or later</span></div>


            Indicates whether to show resolved parameterised values.'
          default: false
          type:
          - boolean
          - 'null'
    RevokeRefreshTokensRequest:
      type: object
      properties:
        configuration_identifiers:
          description: Unique ID or name of the configuration. When provided, the refresh tokens of the users associated with the connection configuration will be revoked.
          type: array
          items:
            type: string
        user_identifiers:
          description: Unique ID or name of the users. When provided, the refresh tokens of the specified users will be revoked. If the request includes the user ID or name of the connection author, their token will also be revoked.
          type: array
          items:
            type: string
        org_identifiers:
          description: Unique ID or name of the Org. When provided, the refresh tokens of all users associated with the published connection in the Org will be revoked. This parameter is valid only for published connections. Using it with unpublished connections will result in an error.
          type: array
          items:
            type: string
    DataWarehouseObjectInput:
      type: object
      properties:
        database:
          type:
          - string
          - 'null'
          description: Name of the database.
        schema:
          type:
          - string
          - 'null'
          description: Name of the schema within the database.
        table:
          type:
          - string
          - 'null'
          description: Name of the table within the schema.
        column:
          type:
          - string
          - 'null'
          description: Name of the column within the table.
    SyncMetadataRequest:
      type: object
      properties:
        tables:
          description: "Array of tables to sync. Each element can be:\n- String: Table identifier (GUID or name) to sync\n  all columns for that table.\n- Object: {tableId: [columnIds]} to sync specific\n  columns.\nIf not provided, syncs all tables in the connection."
          type: object
        sync_attributes:
          description: 'List of sync_attributes to sync from CDW.

            The default value is DESCRIPTION.'
          default:
          - DESCRIPTION
          type: array
          items:
            type: string
            enum:
            - DESCRIPTION
    CreateConnectionRequest:
      type: object
      properties:
        name:
          description: Unique name for the connection.
          type: string
        description:
          description: Description of the connection.
          type: string
        data_warehouse_type:
          description: Type of the data warehouse.
          type: string
          enum:
          - SNOWFLAKE
          - AMAZON_REDSHIFT
          - GOOGLE_BIGQUERY
          - AZURE_SYNAPSE
          - TERADATA
          - SAP_HANA
          - STARBURST
          - ORACLE_ADW
          - DATABRICKS
          - DENODO
          - DREMIO
          - TRINO
          - PRESTO
          - POSTGRES
          - SQLSERVER
          - MYSQL
          - GENERIC_JDBC
          - AMAZON_RDS_POSTGRESQL
          - AMAZON_AURORA_POSTGRESQL
          - AMAZON_RDS_MYSQL
          - AMAZON_AURORA_MYSQL
          - LOOKER
          - AMAZON_ATHENA
          - SINGLESTORE
          - GCP_SQLSERVER
          - GCP_ALLOYDB_POSTGRESQL
          - GCP_POSTGRESQL
          - GCP_MYSQL
          - MODE
          - GOOGLE_SHEETS
          - FALCON
          - FALCON_ONPREM
          - CLICKHOUSE
          - IOMETE
        data_warehouse_config:
          description: Connection configuration attributes in JSON format. To create a connection with tables, include table attributes. See the documentation above for sample JSON.
          type: object
        validate:
          description: Validates the connection metadata if tables are included. If you are creating a connection without tables, specify `false`.
          default: true
          type:
          - boolean
          - 'null'
      required:
      - name
      - data_warehouse_type
      - data_warehouse_config
    SyncMetadataResponse:
      type: object
      properties:
        status:
          type:
          - string
          - 'null'
          enum:
          - SUCCESS
          - PARTIAL_SUCCESS
          - NO_UPDATE
          description: Overall status of the sync operation.
        tables_updated:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of tables with metadata updates.
        columns_updated:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of columns with metadata updates.
        tables_failed:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of tables that failed to sync (for PARTIAL_SUCCESS).
        columns_failed:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of columns that failed to sync (for PARTIAL_SUCCESS).
        message:
          type:
          - string
          - 'null'
          description: Message describing the result.
      description: Response from sync metadata operation.
    Table:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the table.
        columns:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Column'
          description: Columns of the table.
        type:
          type:
          - string
          - 'null'
          description: Type of table. Either view or table
        description:
          type:
          - string
          - 'null'
          description: Description of the table
        selected:
          type:
          - boolean
          - 'null'
          description: Determines if the table is selected
        linked:
          type:
          - boolean
          - 'null'
          description: Determines if the table is linked
        relationships:
          type:
          - array
          - 'null'
          items:
            type: object
          description: List of relationships for the table
    SchemaObject:
      type: object
      required:
