openapi: 3.2.0
info:
  title: ThoughtSpot Public REST Connections API
  version: '2.0'
servers:
- url: '{base-url}'
  variables:
    base-url:
      default: https://localhost:443
security:
- bearerAuth: []
tags:
- name: Connections
paths:
  /api/rest/2.0/connection/create:
    post:
      operationId: createConnection
      description: 'Version: 9.2.0.cl or later


        Creates a connection to a data warehouse for live query services.


        Requires `DATAMANAGEMENT` (**Can manage data**) or `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**) privilege is required.


        #### Create a connection without tables


        To create a connection without tables:


        1. Pass these parameters in your API request.

        * Name of the connection.

        * Type of the data warehouse to connect to.

        * A JSON map of configuration attributes in `data_warehouse_config`. The following example shows the configuration attributes for a SnowFlake connection:

        ```

        {

        "configuration":{

        "accountName":"thoughtspot_partner",

        "user":"tsadmin",

        "password":"TestConn123",

        "role":"sysadmin",

        "warehouse":"MEDIUM_WH"

        },

        "authenticationType": "SERVICE_ACCOUNT",

        "databases": ["DB1", "DB2"],

        "externalDatabases":[


        ]

        }

        ```

        2. Set `validate` to `false`.


        **NOTE:** If the `authentication_type` is anything other than SERVICE_ACCOUNT, you must explicitly provide the authenticationType property in the payload. If you do not specify authenticationType, the API will default to SERVICE_ACCOUNT as the authentication type.


        #### Create a connection with tables


        If Role-Based Access Control (RBAC) is enabled on your instance, the `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**) and `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**) privilege is required.


        To create a connection with tables:


        1. Pass these parameters in your API request.

        * Name of the connection.

        * Type of the data warehouse to connect to.

        * A JSON map of configuration attributes, database details, and table properties in `data_warehouse_config` as shown in the following example:

        ```

        {

        "configuration":{

        "accountName":"thoughtspot_partner",

        "user":"tsadmin",

        "password":"TestConn123",

        "role":"sysadmin",

        "warehouse":"MEDIUM_WH"

        },

        "authenticationType": "SERVICE_ACCOUNT",

        "databases": ["DB1", "DB2", "AllDatatypes"],

        "externalDatabases":[

        {

        "name":"AllDatatypes",

        "isAutoCreated":false,

        "schemas":[

        {

        "name":"alldatatypes",

        "tables":[

        {

        "name":"allDatatypes",

        "type":"TABLE",

        "description":"",

        "selected":true,

        "linked":true,

        "columns":[

        {

        "name":"CNUMBER",

        "type":"INT64",

        "canImport":true,

        "selected":true,

        "isLinkedActive":true,

        "isImported":false,

        "tableName":"allDatatypes",

        "schemaName":"alldatatypes",

        "dbName":"AllDatatypes"

        },

        {

        "name":"CDECIMAL",

        "type":"INT64",

        "canImport":true,

        "selected":true,

        "isLinkedActive":true,

        "isImported":false,

        "tableName":"allDatatypes",

        "schemaName":"alldatatypes",

        "dbName":"AllDatatypes"

        }

        ]

        }

        ]

        }

        ]

        }

        ]

        }

        ```

        2. Set `validate` to `true`.


        **NOTE:** If the `authentication_type` is anything other than SERVICE_ACCOUNT, you must explicitly provide the authenticationType property in the payload. If you do not specify authenticationType, the API will default to SERVICE_ACCOUNT as the authentication type.


        The optional `databases` property in `data_warehouse_config` accepts a list of database names. When specified, ThoughtSpot persists this list on the connection and uses it to scope metadata fetching to only the specified databases in subsequent table add and remove operations. If omitted, all databases in the data warehouse are accessible for metadata operations.


        The `databases` and `externalDatabases` serve different purposes. `databases` is a flat list of database names that controls which databases are scanned during metadata operations. `externalDatabases` defines the full table hierarchy and determines which tables are linked into ThoughtSpot.


        #### Endpoint URL'
      tags:
      - Connections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectionRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Connection to the datasource successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateConnectionResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Create connection
      x-summary-source: derived
  /api/rest/2.0/connection/delete:
    post:
      operationId: deleteConnection
      description: 'Version: 9.2.0.cl or later


        **Important**: This endpoint is deprecated and will be removed from ThoughtSpot in September 2025. ThoughtSpot strongly recommends using the

        Delete Connection V2 endpoint to delete your connection objects.


        #### Usage guidelines


        Deletes a connection object.


        Requires `DATAMANAGEMENT` (**Can manage data**) and edit permissions to the connection object, or `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**) privilege is required.


        **Note**: If a connection has dependent objects, make sure you remove its associations before the delete operation.


        #### Endpoint URL'
      deprecated: true
      tags:
      - Connections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteConnectionRequest'
        required: true
      parameters: []
      responses:
        '204':
          description: Connection successfully deleted.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Delete connection
      x-summary-source: derived
  /api/rest/2.0/connections/{connection_identifier}/delete:
    post:
      operationId: deleteConnectionV2
      description: 'Version: 10.4.0.cl or later


        Deletes a connection object.


        **Note**: If a connection has dependent objects, make sure you remove its associations before the delete operation.


        Requires `DATAMANAGEMENT` (**Can manage data**) and edit permissions to the connection object, or `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**) privilege is required.


        #### Endpoint URL'
      tags:
      - Connections
      parameters:
      - in: path
        name: connection_identifier
        required: true
        schema:
          type: string
        description: Unique ID or name of the connection.
      responses:
        '204':
          description: Connection successfully deleted.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
