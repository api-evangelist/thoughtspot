  /api/rest/2.0/connections/{connection_identifier}/resync-metadata:
    post:
      operationId: syncMetadata
      description: 'Version: 26.5.0.cl or later


        Synchronizes connection metadata attributes from your Cloud Data Warehouse (CDW) with ThoughtSpot.


        Requires the `DATAMANAGEMENT` (**Can manage data**) privilege. If Role-Based Access Control (RBAC) is enabled on your instance, the `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**) privilege is required.


        #### Usage guidelines


        To synchronize attributes from a CDW, specify the connection GUID or name in the `connection_identifier` path parameter and `sync_attributes` in the request body. Default attribute is `["DESCRIPTION"]`.


        ##### Hierarchical schema


        * Connection: The connection object for the sync operation.

        * Tables: Tables for the sync operation. When no table is specified, all tables are synchronized.

        * Columns: If the table is specified, you can add the columns for the sync operation. If no columns are specified, all columns in the specified table are considered for the sync operation.


        To set the scope for the sync operation:


        * Connection-level: To sync all tables and columns, pass an empty request body, or only the attributes in the request body.

        * Table-level: To synchronize specific tables and their columns, specify the table identifiers in the `tables` array.

        * Column-level: To synchronize specific columns, specify the table identifier as the key and column identifiers as the value in the `tables` array.


        ```

        {

        "tables": [

        {"table-guid-1": ["column-guid-1", "column-guid-2"]},

        "table-guid-2"

        ],

        "sync_attributes": ["DESCRIPTION"]

        }

        ```


        ##### API response


        If the sync operation is successful, the API returns the following information:


        * Status of the sync operation. For example, `SUCCESS`, `PARTIAL_SUCCESS`, or `NO_UPDATE`.

        * Number of tables and columns that were updated.

        * Number of tables and columns with the sync failed status when the overall sync status is `PARTIAL_SUCCESS`.

        * Message text indicating the sync results.


        #### Endpoint URL'
      tags:
      - Connections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncMetadataRequest'
        required: true
      parameters:
      - in: path
        name: connection_identifier
        required: true
        schema:
          type: string
        description: Unique ID or name of the connection.
      responses:
        '200':
          description: Metadata synced successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncMetadataResponse'
        '400':
          description: Invalid request parameters or hierarchy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Connection, table, or column not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Sync metadata
      x-summary-source: derived
  /api/rest/2.0/connection/update:
    post:
      operationId: updateConnection
      description: 'Version: 9.2.0.cl or later


        **Important**: This endpoint is deprecated and will be removed from ThoughtSpot in September 2025. ThoughtSpot strongly recommends using the

        Update connection V2 endpoint to update your connection objects.


        #### Usage guidelines


        Updates a connection object.


        Requires `DATAMANAGEMENT` (**Can manage data**) and edit permissions to the connection object, or `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege.

        If Role-Based Access Control (RBAC) is enabled on your instance, the `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**) privilege is required.


        To update a connection object, pass these parameters in your API request:


        1. GUID of the connection object.

        2. If you are updating tables or database schema of a connection object:

        a. Add the updated JSON map of metadata with database, schema, and tables in `data_warehouse_config`.

        b. Set `validate` to `true`.

        3. If you are updating a configuration attribute, connection name, or description, you can set `validate` to `false`.


        #### Endpoint URL'
      deprecated: true
      tags:
      - Connections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectionRequest'
        required: true
      parameters: []
      responses:
        '204':
          description: Connection successfully updated.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
