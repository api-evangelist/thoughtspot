      - name
      - data_warehouse_type
      properties:
        id:
          type: string
          description: ID of the connection created.
        name:
          type: string
          description: Name of the connection.
        data_warehouse_type:
          type: string
          enum:
          - SNOWFLAKE
          - AMAZON_REDSHIFT
          - GOOGLE_BIGQUERY
          - AZURE_SYNAPSE
          - TERADATA
          - SAP_HANA
          - STARBURST
          - ORACLE_ADW
