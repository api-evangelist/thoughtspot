                $ref: '#/components/schemas/ErrorResponse'
      summary: Update connection
      x-summary-source: derived
  /api/rest/2.0/connections/{connection_identifier}/status:
    post:
      operationId: updateConnectionStatus
      description: 'Version: 26.6.0.cl or later


        Activates or deactivates a connection. A deactivated connection cannot be used for queries or operations until it is activated again.


        Requires `DATAMANAGEMENT` (**Can manage data**) privilege. If Role-Based Access Control (RBAC) is enabled on your instance, the `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**) privilege is required. Only the connection owner or an administrator can perform this operation.


        #### Usage guidelines


        To update the status of a connection, specify the connection GUID or name in the `connection_identifier` path parameter and the desired `status` in the request body.


        - **ACTIVATED**: Enables the connection. Queries and operations can resume on an activated connection.

        - **DEACTIVATED**: Disables the connection. It does not remove the connection metadata, but only makes the connection unavailable for queries and operations. You can reactivate a deactivated connection by setting "status": "ACTIVATED".


        #### Endpoint URL'
      tags:
      - Connections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectionStatusRequest'
        required: true
      parameters:
      - in: path
        name: connection_identifier
        required: true
        schema:
          type: string
        description: Unique ID or name of the connection.
      responses:
        '204':
          description: Connection status updated successfully.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Object not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Update connection status
      x-summary-source: derived
