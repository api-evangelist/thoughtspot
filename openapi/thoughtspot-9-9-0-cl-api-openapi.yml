openapi: 3.0.0
info:
  title: ThoughtSpot Public REST 10.1.0.cl 9.9.0.cl API
  version: '2.0'
servers:
- url: '{base-url}'
  variables:
    base-url:
      default: https://localhost:443
security:
- bearerAuth: []
tags:
- name: 9.9.0.cl
paths:
  /api/rest/2.0/connections/download-connection-metadata-changes/{connection_identifier}:
    post:
      operationId: downloadConnectionMetadataChanges
      description: "\n <span class=\"since-beta-tag\">Version: 9.9.0.cl or later</span>\n\nExports the difference in connection metadata between CDW and ThoughtSpot\n\nRequires `DATAMANAGEMENT` (**Can manage data**) privilege.\nIf [Role-Based Access Control (RBAC)](https://developers.thoughtspot.com/docs/rbac) is enabled on your instance, the following Data control privileges may be required:  \n- `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)\n- `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)\n- `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)\n\nTo download the connection metadata difference between ThoughtSpot and CDW, pass the connection GUID as `connection_identifier` in the API request.\n\n\n\n\n#### Endpoint URL\n"
      tags:
      - 9.9.0.cl
      parameters:
      - in: path
        name: connection_identifier
        required: true
        schema:
          type: string
        description: GUID of the connection
      responses:
        '200':
          description: Export metadata changes.
          content:
            application/octet-stream: {}
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rest/2.0/connections/fetch-connection-diff-status/{connection_identifier}:
    post:
      operationId: fetchConnectionDiffStatus
      description: "\n <span class=\"since-beta-tag\">Version: 9.9.0.cl or later</span>\n\nValidates the difference in connection metadata between CDW and ThoughtSpot.\n\nRequires `DATAMANAGEMENT` (**Can manage data**) privilege.\nIf [Role-Based Access Control (RBAC)](https://developers.thoughtspot.com/docs/rbac) is enabled on your instance, the following Data control privileges may be required:\n\n- `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)\n- `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)\n- `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)\n\nReturns a boolean indicating whether there is any difference between the connection metadata at ThoughtSpot and CDW.\n\nTo get the connection metadata difference status, pass the connection GUID as `connection_identifier` in the API request.\n\n\n\n\n#### Endpoint URL\n"
      tags:
      - 9.9.0.cl
      parameters:
      - in: path
        name: connection_identifier
        required: true
        schema:
          type: string
        description: GUID of the connection
      responses:
        '200':
          description: true/false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchConnectionDiffStatusResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rest/2.0/dbt/dbt-connection:
    post:
      operationId: dbtConnection
      description: "\n <span class=\"since-beta-tag\">Version: 9.9.0.cl or later</span>\n\nCreates a DBT connection object in ThoughtSpot.\n\nRequires `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege or `DATAMANAGEMENT` (**Can manage data**) privilege.\nIf [Role-Based Access Control (RBAC)](https://developers.thoughtspot.com/docs/rbac) is enabled on your instance, the following Data control privileges may be required:\n\n- `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)\n- `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)\n- `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)\n\n#### About create DBT connection\nDBT connection in ThoughtSpot is used by the user to define DBT credentials for cloud . The API needs  embrace connection, embrace database name, DBT url, import type, DBT account identifier, DBT project identifier, DBT access token and environment details (or) embrace connection, embrace database name, import type, file_content to create a connection object. To know more about DBT, see ThoughtSpot Product Documentation.\n\n\n\n\n#### Endpoint URL\n"
      tags:
      - 9.9.0.cl
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                connection_name:
                  description: Name of the connection.
                  type: string
                database_name:
                  description: Name of the Database.
                  type: string
                import_type:
                  description: Mention type of Import
                  default: DBT_CLOUD
                  type: string
                  enum:
                  - DBT_CLOUD
                  - ZIP_FILE
                access_token:
                  description: Access token is mandatory when Import_Type is DBT_CLOUD.
                  type: string
                dbt_url:
                  description: DBT URL is mandatory when Import_Type is DBT_CLOUD.
                  type: string
                account_id:
                  description: Account ID is mandatory when Import_Type is DBT_CLOUD
                  type: string
                project_id:
                  description: Project ID is mandatory when Import_Type is DBT_CLOUD
                  type: string
                dbt_env_id:
                  description: DBT Environment ID"
                  type: string
                project_name:
                  description: Name of the project
                  type: string
                file_content:
                  description: Upload DBT Manifest and Catalog artifact files as a ZIP file. This field is Mandatory when Import Type is 'ZIP_FILE'
                  type: string
                  format: binary
              required:
              - connection_name
              - database_name
        required: true
      parameters: []
      responses:
        '200':
          description: Succesfully created DBT Connection.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rest/2.0/dbt/generate-sync-tml:
    post:
      operationId: dbtGenerateSyncTml
      description: "\n <span class=\"since-beta-tag\">Version: 9.9.0.cl or later</span>\n\nResynchronize the existing list of models, tables, worksheet tml’s and import them to Thoughtspot based on the DBT connection object.\n\nRequires `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege or `DATAMANAGEMENT` (**Can manage data**) privilege, along with an existing DBT connection.\nIf [Role-Based Access Control (RBAC)](https://developers.thoughtspot.com/docs/rbac) is enabled on your instance, the following data control privileges may be required:\n\n- `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)\n- `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)\n- `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)\n\n\n\n\n#### Endpoint URL\n"
      tags:
      - 9.9.0.cl
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                dbt_connection_identifier:
                  description: Unique ID of the DBT connection.
                  type: string
                file_content:
                  description: Upload DBT Manifest and Catalog artifact files as a ZIP file. This field is mandatory if the connection was created with import_type ‘ZIP_FILE’
                  type: string
                  format: binary
                include_semantic_report:
                  description: 'If true, includes a `semantic_report` per model showing which components were imported or skipped. Each component includes its name, type (such as dimension, measure, or metric), import status, SQL expression, and the corresponding generated ThoughtSpot formula. Note: supported only for Snowflake and Databricks connections.'
                  type: boolean
                  nullable: true
              required:
              - dbt_connection_identifier
        required: true
      parameters: []
      responses:
        '200':
          description: Sync Table and Worksheet TML's are successfully generated.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rest/2.0/dbt/generate-tml:
    post:
      operationId: dbtGenerateTml
      description: "\n <span class=\"since-beta-tag\">Version: 9.9.0.cl or later</span>\n\nGenerate required table and worksheet and import them.\n\nRequires `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege or `DATAMANAGEMENT` (**Can manage data**) privilege, along with an existing DBT connection.\nIf [Role-Based Access Control (RBAC)](https://developers.thoughtspot.com/docs/rbac) is enabled on your instance, the following data control privileges may be required:\n\n- `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)\n- `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)\n- `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)\n\n#### About generate TML\nModels and Worksheets to be imported can be selected by the user as part of the API.\n\n\n\n\n#### Endpoint URL\n"
      tags:
      - 9.9.0.cl
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                dbt_connection_identifier:
                  description: Unique ID of the DBT connection.
                  type: string
                model_tables:
                  description: 'List of Models and their respective Tables

                    Example: ''[{"model_name": "model_name", "model_path": "model_path", "tables": ["table_name"]}]'''
                  type: string
                  format: json
                import_worksheets:
                  description: Mention the worksheet tmls to import
                  type: string
                  enum:
                  - ALL
                  - NONE
                  - SELECTED
                worksheets:
                  description: 'List of worksheets is mandatory when import_Worksheets is type SELECTED

                    Example: ["worksheet_name"]'
                  type: string
                  format: json
                file_content:
                  description: Upload DBT Manifest and Catalog artifact files as a ZIP file. This field is mandatory if the connection was created with import_type ‘ZIP_FILE’
                  type: string
                  format: binary
                include_semantic_report:
                  description: 'If true, includes a `semantic_report` per model showing which components were imported or skipped. Each component includes its name, type (such as dimension, measure, or metric), import status, SQL expression, and the corresponding generated ThoughtSpot formula. Note: supported only for Snowflake and Databricks connections.'
                  type: boolean
                  nullable: true
              required:
              - dbt_connection_identifier
              - model_tables
              - import_worksheets
        required: true
      parameters: []
      responses:
        '200':
          description: Required Table and Worksheet TML's are successfully generated.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rest/2.0/dbt/search:
    post:
      operationId: dbtSearch
      description: "\n <span class=\"since-beta-tag\">Version: 9.9.0.cl or later</span>\n\nGets a list of DBT connection objects by user and organization, available on the ThoughtSpot system.\n\nRequires `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege or `DATAMANAGEMENT` (**Can manage data**) privilege.\nIf [Role-Based Access Control (RBAC)](https://developers.thoughtspot.com/docs/rbac) is enabled on your instance, the following Data control privileges may be required:\n\n- `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)\n- `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)\n- `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)\n\n#### About search DBT connection\nTo get details of a specific DBT connection identifier, database connection identifier, database connection name, database name, project name, project identifier, environment identifier , import type and author.\n\n\n\n\n#### Endpoint URL\n"
      tags:
      - 9.9.0.cl
      parameters: []
      responses:
        '200':
          description: Retrieved list of DBT connections successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DbtSearchResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rest/2.0/dbt/{dbt_connection_identifier}/delete:
    post:
      operationId: deleteDbtConnection
      description: "\n <span class=\"since-beta-tag\">Version: 9.9.0.cl or later</span>\n\nRemoves the specified DBT connection object from the ThoughtSpot system.\n\nRequires `ADMINISTRATION` (**Can administer ThoughtSpot**) or `DATAMANAGEMENT` (**Can manage data ThoughtSpot**) privilege.\nIf [Role-Based Access Control (RBAC)](https://developers.thoughtspot.com/docs/rbac) is enabled on your instance, the following Data control privileges may be required:\n\n- `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)\n- `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)\n- `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)\n\n\n\n\n#### Endpoint URL\n"
      tags:
      - 9.9.0.cl
      parameters:
      - in: path
        name: dbt_connection_identifier
        required: true
        schema:
          type: string
        description: Unique ID of the DBT Connection.
      responses:
        '204':
          description: DBT Connection successfully deleted.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rest/2.0/dbt/update-dbt-connection:
    post:
      operationId: updateDbtConnection
      description: "\n <span class=\"since-beta-tag\">Version: 9.9.0.cl or later</span>\n\nUpdates a DBT connection object.\n\nRequires `ADMINISTRATION` (**Can administer ThoughtSpot**) privilege or `DATAMANAGEMENT` (**Can manage data ThoughtSpot**) privilege, along with an existing DBT connection.\nIf [Role-Based Access Control (RBAC)](https://developers.thoughtspot.com/docs/rbac) is enabled on your instance, the following data control privileges may be required:\n\n- `CAN_MANAGE_CUSTOM_CALENDAR`(**Can manage custom calendars**)\n- `CAN_CREATE_OR_EDIT_CONNECTIONS` (**Can create/edit Connections**)\n- `CAN_MANAGE_WORKSHEET_VIEWS_TABLES` (**Can manage data models**)\n\n#### About update DBT connection\nYou can modify DBT connection object properties such as embrace connection name, embrace database name, import type, account identifier, access token, project identifier and environment (or) embrace connection, embrace database name, import type, file_content settings.\n\n\n\n\n#### Endpoint URL\n"
      tags:
      - 9.9.0.cl
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                dbt_connection_identifier:
                  description: Unique ID of the DBT Connection.
                  type: string
                connection_name:
                  description: Name of the connection.
                  type: string
                database_name:
                  description: Name of the Database.
                  type: string
                import_type:
                  description: Mention type of Import
                  default: DBT_CLOUD
                  type: string
                  enum:
                  - DBT_CLOUD
                  - ZIP_FILE
                access_token:
                  description: Access token is mandatory when Import_Type is DBT_CLOUD.
                  type: string
                dbt_url:
                  description: DBT URL is mandatory when Import_Type is DBT_CLOUD.
                  type: string
                account_id:
                  description: Account ID is mandatory when Import_Type is DBT_CLOUD
                  type: string
                project_id:
                  description: Project ID is mandatory when Import_Type is DBT_CLOUD
                  type: string
                dbt_env_id:
                  description: DBT Environment ID"
                  type: string
                project_name:
                  description: Name of the project
                  type: string
                file_content:
                  description: Upload DBT Manifest and Catalog artifact files as a ZIP file. This field is Mandatory when Import Type is 'ZIP_FILE'
                  type: string
                  format: binary
              required:
              - dbt_connection_identifier
        required: true
      parameters: []
      responses:
        '200':
          description: DBT Connection successfully updated.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    DbtSearchResponse:
      type: object
      properties:
        dbt_connection_identifier:
          type: string
          nullable: true
        project_name:
          type: string
          nullable: true
        connection_id:
          type: string
          nullable: true
        connection_name:
          type: string
          nullable: true
        cdw_database:
          type: string
          nullable: true
        import_type:
          type: string
          nullable: true
        author_name:
          type: string
          nullable: true
    FetchConnectionDiffStatusResponse:
      type: object
      properties:
        status:
          type: boolean
          description: Status of the connection diff.
          nullable: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
