openapi: 3.0.0
info:
  title: ThoughtSpot Public REST 10.1.0.cl API
  version: '2.0'
servers:
- url: '{base-url}'
  variables:
    base-url:
      default: https://localhost:443
security:
- bearerAuth: []
tags:
- name: 10.1.0.cl
paths:
  /api/rest/2.0/metadata/tml/export/batch:
    post:
      operationId: exportMetadataTMLBatched
      description: "\n <span class=\"since-beta-tag\">Version: 10.1.0.cl or later</span>\n\nExports the [TML](https://docs.thoughtspot.com/cloud/latest/tml) representation of metadata objects in JSON or YAML format.\n\n### **Permissions Required**\n\nRequires `DATAMANAGEMENT` (**Can manage data**) and `USERMANAGEMENT` (**Can manage users**) privileges.\n\n#### **Usage Guidelines**\n\nThis API is only applicable for `USER`, `GROUP`, and `ROLES` metadata types.\n\n- `batch_offset` Indicates the starting position within the complete dataset from which the API should begin returning objects. Useful for paginating results efficiently.\n- `batch_size` Specifies the number of objects or items to retrieve in a single request. Helps control response size for better performance.\n- `edoc_format` Defines the format of the TML content. The exported metadata can be in JSON or YAML format.\n- `export_dependent` Specifies whether to include dependent metadata objects in the export. Ensures related objects are also retrieved if needed.\n- `all_orgs_override` Indicates whether the export operation applies across all organizations. Useful for multi-tenant environments where cross-org exports are required.\n\n\n\n\n#### Endpoint URL\n"
      tags:
      - 10.1.0.cl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportMetadataTMLBatchedRequest'
        required: true
      parameters: []
      responses:
        '200':
          description: Export TMLs of specified metadata objects is successful.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ExportMetadataTMLBatchedRequest:
      type: object
      properties:
        metadata_type:
          description: Type of metadata object to export, can be one of USER | ROLE | USER_GROUP
          type: string
          enum:
          - USER
          - USER_GROUP
          - ROLE
        batch_offset:
          description: Indicates the position within the complete set from where the API should begin returning objects.
          default: 0
          type: integer
          format: int32
        batch_size:
          description: Determines the number of objects or items to be retrieved in a single request.
          default: 20
          type: integer
          format: int32
        edoc_format:
          description: TML EDOC content format.
          default: JSON
          type: string
          enum:
          - JSON
          - YAML
        export_dependent:
          description: Indicates whether to export dependent metadata objects of specified metadata objects.
          default: false
          type: boolean
          nullable: true
        all_orgs_override:
          description: Indicates whether to export is happening from all orgs context.
          default: false
          type: boolean
          nullable: true
      required:
      - metadata_type
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
