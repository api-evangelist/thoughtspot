aid: thoughtspot
name: ThoughtSpot
x-enrichment:
  date: '2026-07-21'
  status: enriched
  artifacts_added: 24
  pass: local-v1
description: >-
  ThoughtSpot is an agentic analytics and business intelligence platform that
  turns data into decisions using AI agents (Spotter), Search, automated
  insights, and embedded analytics. The ThoughtSpot Public REST API v2.0
  exposes 191 operations across authentication, users, groups, roles, orgs,
  metadata (Liveboards, Answers, Models, Tables), search and data, AI/Spotter
  agents and conversations, connections, custom actions, webhooks, schedules,
  version control (Git/TML), security and sharing, tags, collections, and system
  administration. Developers also embed ThoughtSpot with the Visual Embed SDK,
  build custom charts with the Chart SDK, and connect agents through an official
  hosted MCP server. This profile was enriched by the API Evangelist pipeline
  from ThoughtSpot's public developer surface (developers.thoughtspot.com,
  docs.thoughtspot.com, the thoughtspot GitHub org, npm, and PyPI).
